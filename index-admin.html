<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a1628">
  <title>Adriatic Steel League - Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" href="images/ASL-logo.png">


  <style>
    :root {
      --text: #ffffff;
      --muted: #c8d3ea;
      --panel: rgba(8, 14, 28, 0.82);
      --panel-2: rgba(12, 20, 38, 0.96);
      --header: rgba(21, 49, 99, 0.95);
      --header-hover: rgba(39, 81, 159, 0.98);
      --line: rgba(255,255,255,0.10);
      --shadow: 0 18px 50px rgba(0,0,0,0.35);
      --radius: 18px;
      --accent: #4a90e2;
      --accent-hover: #5ba3f5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      background: #1a3a5c;
      font-family: 'Lexend', sans-serif;
      font-weight: 400;
      color: var(--text);
    }

    .bg-image {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image: url("images/background.jpeg");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: linear-gradient(rgba(3, 8, 18, 0.65), rgba(3, 8, 18, 0.88));
    }

    /* ── LOGIN SCREEN ── */
    #login-screen {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: rgba(8, 14, 28, 0.90);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 40px 36px;
      backdrop-filter: blur(12px);
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
      animation: fadeInUp 0.5s ease both;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .login-logo {
      display: block;
      margin: 0 auto 20px;
      max-width: 100px;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.6));
    }

    .login-title {
      text-align: center;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .login-subtitle {
      text-align: center;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.35);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 32px;
    }

    .login-divider {
      width: 40px;
      height: 2px;
      background: rgba(74, 144, 226, 0.6);
      margin: 0 auto 32px;
      border-radius: 2px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 13px 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      color: #fff;
      font-family: 'Lexend', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .form-input:focus {
      border-color: rgba(74, 144, 226, 0.6);
      background: rgba(74, 144, 226, 0.08);
    }

    .form-input::placeholder {
      color: rgba(255,255,255,0.2);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      background: rgba(21, 49, 99, 1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      color: #fff;
      font-family: 'Lexend', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.25s ease;
    }

    .btn-login:hover {
      background: rgba(39, 81, 159, 0.98);
      box-shadow: 0 0 20px rgba(74, 144, 226, 0.25);
    }

    .btn-login:active {
      transform: scale(0.98);
    }

    .btn-login:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .login-error {
      margin-top: 14px;
      padding: 10px 14px;
      background: rgba(255, 80, 80, 0.1);
      border: 1px solid rgba(255, 80, 80, 0.25);
      border-radius: 10px;
      font-size: 0.85rem;
      color: #ffaaaa;
      text-align: center;
      display: none;
    }

    .login-footer {
      text-align: center;
      margin-top: 28px;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.5px;
    }

    /* ── ADMIN PANEL ── */
    #admin-screen {
      display: none;
      position: relative;
      z-index: 10;
      min-height: 100vh;
      padding: 24px 16px 48px;
    }

    .admin-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .admin-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .admin-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .admin-brand img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
    }

    .admin-brand-text {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .admin-brand-sub {
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .admin-user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .admin-role-badge {
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .admin-role-badge.admin {
      background: rgba(255, 215, 0, 0.15);
      border: 1px solid rgba(255, 215, 0, 0.35);
      color: #FFD700;
    }

    .admin-role-badge.operator {
      background: rgba(74, 144, 226, 0.15);
      border: 1px solid rgba(74, 144, 226, 0.35);
      color: #4a90e2;
    }

    .btn-logout {
      padding: 8px 18px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 999px;
      color: var(--muted);
      font-family: 'Lexend', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn-logout:hover {
      background: rgba(255, 80, 80, 0.12);
      border-color: rgba(255, 80, 80, 0.3);
      color: #ffaaaa;
    }

    .admin-welcome {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px 24px;
      margin-bottom: 24px;
      backdrop-filter: blur(7px);
      animation: fadeInUp 0.4s ease both;
    }

    .admin-welcome h2 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .admin-welcome p {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .groups-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .group-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      backdrop-filter: blur(7px);
      box-shadow: var(--shadow);
      animation: fadeInUp 0.4s ease both;
      transition: 0.25s ease;
      cursor: pointer;
    }

    .group-card:hover {
      border-color: rgba(255,255,255,0.25);
      transform: translateY(-2px);
      box-shadow: 0 24px 60px rgba(0,0,0,0.45);
    }

    .group-card-header {
      background: var(--header);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .group-card-title {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .group-card-count {
      font-size: 0.75rem;
      color: var(--muted);
      background: rgba(255,255,255,0.08);
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .group-card-body {
      padding: 14px 18px;
    }

    .group-card-players {
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.7;
    }

    .group-card-footer {
      padding: 10px 18px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .group-card-action {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      gap: 16px;
    }

    .loading-spinner {
      width: 34px;
      height: 34px;
      border: 4px solid rgba(255,255,255,0.1);
      border-top: 4px solid rgba(120,170,255,0.85);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 1rem;
      font-weight: 500;
      color: var(--muted);
    }

    @media (max-width: 480px) {
      .login-card { padding: 28px 22px; }
      .admin-topbar { flex-direction: column; align-items: flex-start; }
      .groups-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="bg-image"></div>
  <div class="bg-overlay"></div>

  <!-- LOGIN SCREEN -->
  <div id="login-screen">
    <div class="login-card">
      <a href="index.html"><img class="login-logo" src="images/ASL-logo.png" alt="ASL Logo"></a>
      <div class="login-title">Adriatic Steel League</div>
      <div class="login-subtitle">Admin Panel</div>
      <div class="login-divider"></div>

      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-input" type="email" id="email" placeholder="user@asl.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Lozinka</label>
        <input class="form-input" type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      </div>

      <button class="btn-login" id="btn-login" onclick="handleLogin()">
        Prijava
      </button>

      <div class="login-error" id="login-error"></div>

      <div class="login-footer">Adriatic Steel League ™ ® · Samo ovlašteni pristup</div>
    </div>
  </div>

  <!-- ADMIN PANEL -->
  <div id="admin-screen">
    <div class="admin-container">

      <div class="admin-topbar">
        <div class="admin-brand">
          <img src="images/ASL-logo.png" alt="ASL">
          <div>
            <div class="admin-brand-text">ADRIATIC STEEL LEAGUE</div>
            <div class="admin-brand-sub">Admin Panel · Sezona 2</div>
          </div>
        </div>
        <div class="admin-user-info">
          <span class="admin-role-badge admin" id="role-badge">Admin</span>
          <span id="user-email" style="font-size:0.8rem; color: var(--muted);"></span>
          <button class="btn-logout" onclick="handleLogout()">
            <i class="fas fa-sign-out-alt"></i> Odjava
          </button>
        </div>
      </div>

      <div class="admin-welcome">
        <h2 id="welcome-msg">Dobrodošli!</h2>
        <p id="welcome-sub">Učitavanje podataka...</p>
      </div>

      <div id="groups-container">
        <div class="loading-state">
          <div class="loading-spinner"></div>
          <span class="loading-text">Učitavanje grupa...</span>
        </div>
      </div>

    </div>
  </div>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-analytics.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDyG6WN60VOhp-iHq_18vOLDcHP6zHNoRk",
      authDomain: "adriatic-steel-league.firebaseapp.com",
      projectId: "adriatic-steel-league",
      storageBucket: "adriatic-steel-league.firebasestorage.app",
      messagingSenderId: "269059044337",
      appId: "1:269059044337:web:6b2e69f8604a0546b00a50",
      measurementId: "G-8HLYCZLJ2Y"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    getAnalytics(app);

    // Expose functions to global scope
    window.handleLogin = async function() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btn-login');
      const errorEl = document.getElementById('login-error');

      if (!email || !password) {
        showError('Unesite email i lozinku.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Prijava...';
      errorEl.style.display = 'none';

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Prijava';
        showError('Pogrešan email ili lozinka.');
      }
    };

    window.handleLogout = async function() {
      await signOut(auth);
    };

    function showError(msg) {
      const el = document.getElementById('login-error');
      el.textContent = msg;
      el.style.display = 'block';
    }

    // Enter key on password field
    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') window.handleLogin();
    });

    // Auth state listener
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        // Ulogiran — prikaži admin panel
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('admin-screen').style.display = 'block';
        document.getElementById('user-email').textContent = user.email;

        // Dohvati user podatke
        const userDoc = await getDoc(doc(db, 'users', user.uid));
        const userData = userDoc.exists() ? userDoc.data() : { role: 'operator', groups: [] };

        const isAdmin = userData.role === 'admin';

        // Postavi badge i welcome poruku
        const badge = document.getElementById('role-badge');
        badge.textContent = isAdmin ? 'Admin' : 'Operater';
        badge.className = 'admin-role-badge ' + (isAdmin ? 'admin' : 'operator');

        document.getElementById('welcome-msg').textContent = 'Dobrodošli, ' + user.email.split('@')[0] + '!';
        document.getElementById('welcome-sub').textContent = isAdmin
          ? 'Imate pristup svim grupama — Sezona 2'
          : 'Imate pristup grupama: ' + (userData.groups || []).join(', ');

        // Učitaj grupe
        await loadGroups(isAdmin, userData.groups || []);

      } else {
        // Odlogiran — prikaži login
        document.getElementById('login-screen').style.display = 'flex';
        document.getElementById('admin-screen').style.display = 'none';
        document.getElementById('btn-login').disabled = false;
        document.getElementById('btn-login').textContent = 'Prijava';
      }
    });

    async function loadGroups(isAdmin, allowedGroups) {
      const container = document.getElementById('groups-container');

      try {
        const groupsSnap = await getDocs(collection(db, 'seasons', 'sezona-2', 'groups'));
        const groups = [];

        groupsSnap.forEach(doc => {
          const data = doc.data();
          if (isAdmin || allowedGroups.includes(doc.id)) {
            groups.push({ id: doc.id, ...data });
          }
        });

        groups.sort((a, b) => a.id.localeCompare(b.id));

        if (groups.length === 0) {
          container.innerHTML = '<div style="text-align:center; color: var(--muted); padding: 40px;">Nema dostupnih grupa.</div>';
          return;
        }

        // Učitaj igrače za svaku grupu
        const groupsWithPlayers = await Promise.all(groups.map(async (group) => {
          const playersSnap = await getDocs(collection(db, 'seasons', 'sezona-2', 'groups', group.id, 'players'));
          const players = [];
          playersSnap.forEach(p => players.push(p.data().name));
          return { ...group, players };
        }));

        container.innerHTML = '<div class="groups-grid">' +
          groupsWithPlayers.map((group, i) => `
            <div class="group-card" style="animation-delay: ${i * 0.04}s" onclick="window.location.href='group-detail.html?group=${group.id}'">
              <div class="group-card-header">
                <span class="group-card-title">${group.name}</span>
                <span class="group-card-count">${group.players.length} igrača</span>
              </div>
              <div class="group-card-body">
                <div class="group-card-players">
                  ${group.players.slice(0, 4).join('<br>')}
                  ${group.players.length > 4 ? `<span style="color:rgba(255,255,255,0.3)">+ još ${group.players.length - 4}...</span>` : ''}
                </div>
              </div>
              <div class="group-card-footer">
                <span class="group-card-action">Upravljaj grupom →</span>
              </div>
            </div>
          `).join('') +
        '</div>';

      } catch (err) {
        container.innerHTML = '<div style="color:#ffaaaa; padding: 20px;">Greška pri učitavanju: ' + err.message + '</div>';
      }
    }
  </script>
</body>
</html>
