    window.handleArchiveAccordionClick = handleArchiveAccordionClick;
    window.openArchiveKoloPopup = openArchiveKoloPopup;

    window.addEventListener('resize', () => {
      document.querySelectorAll('.accordion-item.open').forEach(item => {
        const content = item.querySelector('.accordion-content');
        if (content.style.maxHeight !== 'none') content.style.maxHeight = content.scrollHeight + 'px';
      });
    });

    // ── BRACKET RENDER ──
    // R64 fixed draw — 32 matches
    const R64_DRAW = [
      {p1:'1A',p2:'4P'},{p1:'2N',p2:'3C'},{p1:'1O',p2:'4B'},{p1:'2D',p2:'3M'},
      {p1:'1G',p2:'4J'},{p1:'2L',p2:'3E'},{p1:'1I',p2:'4H'},{p1:'2F',p2:'3K'},
      {p1:'1C',p2:'4N'},{p1:'2P',p2:'3A'},{p1:'1M',p2:'4D'},{p1:'2B',p2:'3O'},
      {p1:'1E',p2:'4L'},{p1:'2J',p2:'3G'},{p1:'1K',p2:'4F'},{p1:'2H',p2:'3I'},
      {p1:'1B',p2:'4O'},{p1:'2M',p2:'3D'},{p1:'1P',p2:'4A'},{p1:'2C',p2:'3N'},
      {p1:'1H',p2:'4I'},{p1:'2K',p2:'3F'},{p1:'1J',p2:'4G'},{p1:'2E',p2:'3L'},
      {p1:'1D',p2:'4M'},{p1:'2O',p2:'3B'},{p1:'1N',p2:'4C'},{p1:'2A',p2:'3P'},
      {p1:'1F',p2:'4K'},{p1:'2I',p2:'3H'},{p1:'1L',p2:'4E'},{p1:'2G',p2:'3J'}
    ];

    const ROUND_LABELS = ['Last of 64','Last of 32','Osmina finala','Četvrtfinale','Polufinale','Finale'];
    const ROUND_IDS    = ['R64','R32','R16','QF','SF','F'];

    function renderBracket(matchesByRound, groupStandingsMap) {
      const container = document.getElementById('gornji-zdrijeb-content');

      // Resolve player names from group standings
      function resolveName(code, gsm) {
        if (!code) return null;
        const m = code.match(/^([1-4])([A-P])$/);
        if (!m) return code;
        const rank = parseInt(m[1])-1;
        const grp  = m[2];
        const standings = gsm[grp];
        if (!standings || !standings[rank]) return code;
        return standings[rank].name;
      }

      // Build R64 matches with names
      const r64Matches = R64_DRAW.map((draw, i) => {
        const id = `R64_${i + 1}`;
        const saved = matchesByRound[id] || {};

        // Prikaži pravo ime samo ako je meč već odigran, inače kod
        const p1name = saved.player1 || resolveName(draw.p1, groupStandingsMap) || draw.p1;
        const p2name = saved.player2 || resolveName(draw.p2, groupStandingsMap) || draw.p2;

        bracketMatchData[id] = { ...saved, player1: p1name, player2: p2name, roundLabel: `Last of 64 — Meč ${i + 1}` };
        return { id, player1: p1name, player2: p2name, score: saved.score || '', winner: saved.winner || null };
      });

      // Build subsequent rounds
      const rounds = [r64Matches];
      for (let r = 1; r < ROUND_IDS.length; r++) {
        const prev = rounds[r-1];
        const count = prev.length / 2;
        const cur = [];
        for (let i = 0; i < count; i++) {
          const id    = `${ROUND_IDS[r]}_${i+1}`;
          const saved = matchesByRound[id] || {};
          const p1 = saved.player1 || (prev[i*2]?.winner   ? (prev[i*2].winner==='player1'   ? prev[i*2].player1   : prev[i*2].player2)   : null);
          const p2 = saved.player2 || (prev[i*2+1]?.winner ? (prev[i*2+1].winner==='player1' ? prev[i*2+1].player1 : prev[i*2+1].player2) : null);
          bracketMatchData[id] = { ...saved, player1: p1, player2: p2, roundLabel: `${ROUND_LABELS[r]} — Meč ${i+1}` };
          cur.push({ id, player1: p1, player2: p2, score: saved.score||'', winner: saved.winner||null });
        }
        rounds.push(cur);
      }

      // 3rd place match
      const sfMatches = rounds[4]; // SF
      const thirdId   = 'THIRD_1';
      const savedThird = matchesByRound[thirdId] || {};
      let third_p1 = savedThird.player1 || null;
      let third_p2 = savedThird.player2 || null;
      if (!third_p1 && sfMatches[0]) {
        const sf1 = sfMatches[0];
        third_p1 = sf1.winner ? (sf1.winner==='player1' ? sf1.player2 : sf1.player1) : null;
      }
      if (!third_p2 && sfMatches[1]) {
        const sf2 = sfMatches[1];
        third_p2 = sf2.winner ? (sf2.winner==='player1' ? sf2.player2 : sf2.player1) : null;
      }
      bracketMatchData[thirdId] = { ...savedThird, player1: third_p1, player2: third_p2, roundLabel: 'Utakmica za 3. mjesto' };

      function playerHtml(name, isWinner, isLoser) {
        const cls = isWinner ? 'winner' : isLoser ? 'loser' : (!name ? 'tbd' : '');
        return `<div class="bracket-player ${cls}">
          <span class="bracket-player-name">${escapeHtml(name||'TBD')}</span>
        </div>`;
      }

      function matchHtml(match, pairClass) {
        const saved = bracketMatchData[match.id]||{};
        const score = saved.score||'';
        const hasScore = !!score;
        const parts = hasScore ? score.split('-') : [];
        const s1 = parts[0]||'', s2 = parts[1]||'';
        const w = saved.winner||null;
        return `<div class="bracket-match ${pairClass||''}" onclick="openBracketMatchPopup('${match.id}')">
          <div class="bracket-player ${w==='player1'?'winner':w==='player2'?'loser':(!match.player1?'tbd':'')}">
            <span class="bracket-player-name">${escapeHtml(match.player1||'TBD')}</span>
            ${hasScore?`<span class="bracket-player-score">${s1}</span>`:''}
          </div>
          <div class="bracket-player ${w==='player2'?'winner':w==='player1'?'loser':(!match.player2?'tbd':'')}">
            <span class="bracket-player-name">${escapeHtml(match.player2||'TBD')}</span>
            ${hasScore?`<span class="bracket-player-score">${s2}</span>`:''}
          </div>
        </div>`;
      }

      const thirdMatch = bracketMatchData[thirdId];

      const roundsHtml = rounds.map((matches, ri) => `
        <div class="bracket-round">
          <div class="bracket-round-title">${ROUND_LABELS[ri]}</div>
          <div class="bracket-matches">
            ${ri === rounds.length - 1 ? `<div class="bracket-final-title">🏆 FINALE</div>` : ''}
            ${matches.map((m,i) => matchHtml(m, i%2===0?'pair-top':'pair-bottom')).join('')}
            ${ri === rounds.length - 1 ? `
              <div class="bracket-third-title">🥉 UTAKMICA ZA 3. MJESTO</div>
              ${matchHtml({ id: thirdId, player1: thirdMatch.player1, player2: thirdMatch.player2 })}
            ` : ''}
          </div>
        </div>`).join('');

      container.innerHTML = `
        <div class="bracket-wrap" id="bracket-wrap-upper">
          <div class="bracket-rounds">${roundsHtml}</div>
        </div>
        <div style="text-align:center;padding:14px 12px;font-size:0.82rem;font-weight:600;color:rgba(255,255,255,0.5);">
          Adriatic steel league ™ ®
        </div>`;

      requestAnimationFrame(() => scheduleAllPairOffsets());
      window.__observeBracketWrap('bracket-wrap-upper');
        }

    // ── DONJI ŽDRIJEB ──
    const LROUND_IDS    = ['LR64','LR32','LR16','LQF','LSF','LF'];
    const LROUND_LABELS = ['Donji Last of 64','Donji Last of 32','Donja Osmina finala','Donje Četvrtfinale','Donje Polufinale','Donje Finale'];
    const lowerBracketMatchData = {};

    function renderLowerBracket(matchesByRound) {
      const container = document.getElementById('donji-zdrijeb-content');

      // Build LR64 (nema šablone kodova - imena se upisuju ručno u admin panelu)
      const lr64Matches = Array.from({ length: 32 }, (_, i) => {
        const id = `LR64_${i + 1}`;
        const saved = matchesByRound[id] || {};
        const p1 = saved.player1 || null;
        const p2 = saved.player2 || null;
        lowerBracketMatchData[id] = { ...saved, player1: p1, player2: p2, roundLabel: `Donji Last of 64 — Meč ${i + 1}` };
        return { id, player1: p1, player2: p2, score: saved.score || '', winner: saved.winner || null };
      });

      // Build subsequent rounds
      const rounds = [lr64Matches];
      for (let r = 1; r < LROUND_IDS.length; r++) {
        const prev = rounds[r-1];
        const count = prev.length / 2;
        const cur = [];
        for (let i = 0; i < count; i++) {
          const id    = `${LROUND_IDS[r]}_${i+1}`;
          const saved = matchesByRound[id] || {};
          const p1 = saved.player1 || (prev[i*2]?.winner   ? (prev[i*2].winner==='player1'   ? prev[i*2].player1   : prev[i*2].player2)   : null);
          const p2 = saved.player2 || (prev[i*2+1]?.winner ? (prev[i*2+1].winner==='player1' ? prev[i*2+1].player1 : prev[i*2+1].player2) : null);
          lowerBracketMatchData[id] = { ...saved, player1: p1, player2: p2, roundLabel: `${LROUND_LABELS[r]} — Meč ${i+1}` };
          cur.push({ id, player1: p1, player2: p2, score: saved.score||'', winner: saved.winner||null });
        }
        rounds.push(cur);
      }

      // 3rd place match
      const sfMatches = rounds[4]; // LSF
      const thirdId   = 'LTHIRD_1';
      const savedThird = matchesByRound[thirdId] || {};
      let third_p1 = savedThird.player1 || null;
      let third_p2 = savedThird.player2 || null;
      if (!third_p1 && sfMatches[0]) {
        const sf1 = sfMatches[0];
        third_p1 = sf1.winner ? (sf1.winner==='player1' ? sf1.player2 : sf1.player1) : null;
      }
      if (!third_p2 && sfMatches[1]) {
        const sf2 = sfMatches[1];
        third_p2 = sf2.winner ? (sf2.winner==='player1' ? sf2.player2 : sf2.player1) : null;
      }
      lowerBracketMatchData[thirdId] = { ...savedThird, player1: third_p1, player2: third_p2, roundLabel: 'Donja utakmica za 3. mjesto' };

      function matchHtml(match, pairClass) {
        const saved = lowerBracketMatchData[match.id]||{};
        const score = saved.score||'';
        const hasScore = !!score;
        const parts = hasScore ? score.split('-') : [];
        const s1 = parts[0]||'', s2 = parts[1]||'';
        const w = saved.winner||null;
        return `<div class="bracket-match ${pairClass||''}" onclick="openLowerBracketMatchPopup('${match.id}')">
          <div class="bracket-player ${w==='player1'?'winner':w==='player2'?'loser':(!match.player1?'tbd':'')}">
            <span class="bracket-player-name">${escapeHtml(match.player1||'TBD')}</span>
            ${hasScore?`<span class="bracket-player-score">${s1}</span>`:''}
          </div>
          <div class="bracket-player ${w==='player2'?'winner':w==='player1'?'loser':(!match.player2?'tbd':'')}">
            <span class="bracket-player-name">${escapeHtml(match.player2||'TBD')}</span>
            ${hasScore?`<span class="bracket-player-score">${s2}</span>`:''}
          </div>
        </div>`;
      }

      const thirdMatch = lowerBracketMatchData[thirdId];

      const roundsHtml = rounds.map((matches, ri) => `
        <div class="bracket-round">
          <div class="bracket-round-title">${LROUND_LABELS[ri]}</div>
          <div class="bracket-matches">
            ${ri === rounds.length - 1 ? `<div class="bracket-final-title">🏆 DONJE FINALE</div>` : ''}
            ${matches.map((m,i) => matchHtml(m, i%2===0?'pair-top':'pair-bottom')).join('')}
            ${ri === rounds.length - 1 ? `
              <div class="bracket-third-title">🥉 DONJA UTAKMICA ZA 3. MJESTO</div>
              ${matchHtml({id: thirdId, player1: thirdMatch.player1, player2: thirdMatch.player2})}
            ` : ''}
          </div>
        </div>`).join('');

      container.innerHTML = `
        <div class="bracket-wrap" id="bracket-wrap-lower">
          <div class="bracket-rounds">${roundsHtml}</div>
        </div>
        <div style="text-align:center;padding:14px 12px;font-size:0.82rem;font-weight:600;color:rgba(255,255,255,0.5);">
          Adriatic steel league ™ ®
        </div>`;

      requestAnimationFrame(() => scheduleAllPairOffsets());
      window.__observeBracketWrap('bracket-wrap-lower');
    }

    function openLowerBracketMatchPopup(matchId) {
      const d = lowerBracketMatchData[matchId];
      if (!d) return;
      const score = d.score||''; const hasScore = !!score;
      const p1 = d.player1||'TBD'; const p2 = d.player2||'TBD';
      const statsRows = hasScore ? `
        <div class="popup-stats">
          <div class="popup-stat-val-l">${d.average1??'--'}</div><div class="popup-stat-label">AVG</div><div class="popup-stat-val-r">${d.average2??'--'}</div>
          <div class="popup-stat-val-l">${d.first9_1??'--'}</div><div class="popup-stat-label">First 9</div><div class="popup-stat-val-r">${d.first9_2??'--'}</div>
          <div class="popup-stat-val-l">${d.bestleg1??'--'}</div><div class="popup-stat-label">Best Leg</div><div class="popup-stat-val-r">${d.bestleg2??'--'}</div>
          <div class="popup-stat-val-l">${d.bestcheckout1??'--'}</div><div class="popup-stat-label">Best CO</div><div class="popup-stat-val-r">${d.bestcheckout2??'--'}</div>
          <div class="popup-stat-val-l">${d['180_1']??'--'}</div><div class="popup-stat-label">180s</div><div class="popup-stat-val-r">${d['180_2']??'--'}</div>
        </div>` : `<div class="popup-no-score">Meč još nije odigran</div>`;
      const body = `<div class="popup-match">
        <div class="popup-match-top">
          <span class="popup-player-name">${escapeHtml(p1)}</span>
          <span class="popup-score ${hasScore?'':'empty'}">${score||'-:-'}</span>
          <span class="popup-player-name right">${escapeHtml(p2)}</span>
        </div>${statsRows}</div>`;
      showPopup(d.roundLabel||'', body, '');
    }
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
    import { getAnalytics }  from "https://www.gstatic.com/firebasejs/12.12.0/firebase-analytics.js";
    import { getFirestore, collection, getDocs, query, orderBy, getDoc, doc } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDyG6WN60VOhp-iHq_18vOLDcHP6zHNoRk",
      authDomain: "adriatic-steel-league.firebaseapp.com",
      projectId: "adriatic-steel-league",
      storageBucket: "adriatic-steel-league.firebasestorage.app",
      messagingSenderId: "269059044337",
      appId: "1:269059044337:web:6b2e69f8604a0546b00a50",
      measurementId: "G-8HLYCZLJ2Y"
    };

    const app = initializeApp(firebaseConfig);
    getAnalytics(app);
    const db = getFirestore(app);

    // ── AKTIVNA SEZONA (skalabilno rješenje za prelazak sezona) ──
    // Jedno mjesto u Firestoreu (config/active-season, polje seasonId) određuje
    // koja je sezona "trenutna" - ona se prikazuje u TABLICE, GORNJI/DONJI
    // ŽDRIJEB tabovima i registrira se kao primarna u playerDatabase pretrazi.
    // Kad admin promijeni seasonId ovdje (npr. 'sezona-2' -> 'sezona-3'), cijela
    // stranica se automatski prebacuje bez ijedne izmjene koda ili deploya.
    // Ako dokument ne postoji, fallback je 'sezona-2' (današnje ponašanje).
    const DEFAULT_ACTIVE_SEASON_ID = 'sezona-2';
    let ACTIVE_SEASON_ID = DEFAULT_ACTIVE_SEASON_ID;

    async function resolveActiveSeasonId() {
      try {
        const configDoc = await getDoc(doc(db, 'config', 'active-season'));
        const seasonId = configDoc.exists() ? configDoc.data()?.seasonId : null;
        return seasonId || DEFAULT_ACTIVE_SEASON_ID;
      } catch (err) {
        console.error('Greška pri čitanju config/active-season, koristim default:', err);
        return DEFAULT_ACTIVE_SEASON_ID;
      }
    }

    async function loadStandings(seasonId) {
      const content = document.getElementById('content');
      content.innerHTML = `<div class="loading-state"><div class="loading-spinner"></div><span class="loading-text">Učitavanje podataka...</span></div>`;
      try {
        const seasonDoc   = await getDoc(doc(db, 'seasons', seasonId));
        const trenutnoKolo = seasonDoc.data()?.trenutnoKolo || [1];
        const rawKolos = Array.isArray(trenutnoKolo) ? trenutnoKolo : [trenutnoKolo];
        const visibleKolos = rawKolos
          .flatMap(v => String(v).split(','))
          .map(v => parseInt(v.trim()))
          .filter(v => !isNaN(v));

        const groupsSnap = await getDocs(collection(db, 'seasons', seasonId, 'groups'));
        const groups = [];
        groupsSnap.forEach(d => groups.push({id:d.id,...d.data()}));
        groups.sort((a,b) => a.id.localeCompare(b.id));

        const groupStandingsMap = {};
        const bestMatchByKolo = {};
        const mvpByKolo = {};

        const groupsData = await Promise.all(groups.map(async (group, i) => {
          const playersSnap = await getDocs(query(collection(db,'seasons',seasonId,'groups',group.id,'players'), orderBy('position')));
          const players = []; playersSnap.forEach(p => players.push(p.data().name));

          const matchesSnap = await getDocs(collection(db,'seasons',seasonId,'groups',group.id,'matches'));
          const matchesMap  = {}; matchesSnap.forEach(m => { const d=m.data(); matchesMap[`${d.kolo}_${d.mec}`]=d; });

          const schedule        = generateSchedule(players);
          const visibleSchedule = schedule.filter(r => visibleKolos.includes(r.kolo));
          const standings       = computeStandings(players, schedule, matchesMap);
          
          schedule.forEach(({ kolo, matches }) => {
            matches.forEach(({ mec }) => {
              const m = matchesMap[`${kolo}_${mec}`];
              if (m) {
                considerBestMatch(bestMatchByKolo, kolo, m, group.name);
                considerMVP(mvpByKolo, kolo, m);
              }
            });
          });

          // Extract group letter from group.id (e.g. "grupa-a" -> "A")
          const letter = group.id.replace(/[^a-zA-Z]/g,'').slice(-1).toUpperCase();
          groupStandingsMap[letter] = standings;

          // Register players for global search/profile database
          standings.forEach(standingRow => {
            const playerMatches = buildPlayerMatches(standingRow.name, players, schedule, matchesMap);
            registerPlayerSeasonData(standingRow.name, seasonId, SEASON_LABELS[seasonId] || seasonId, letter, group.name, standingRow, playerMatches);
          });

          const html = createAccordion(group.name, i+1, standings, visibleSchedule, matchesMap);
          return {html, standings};
        }));

        content.innerHTML = groupsData.map(g => g.html).join('');

        const allPlayersStats = [];
        groupsData.forEach(g => allPlayersStats.push(...g.standings));
        latestGroupStats = allPlayersStats;
        latestBestMatchByKolo = bestMatchByKolo;
        latestMvpByKolo = mvpByKolo;
        refreshNajboljiWithPlayoffs();

        if (seasonDoc.exists() && seasonDoc.data().lastUpdated) {
          document.getElementById('updated-time').textContent = seasonDoc.data().lastUpdated.toDate().toLocaleString('hr-HR');
        }

        // Load bracket
        await loadBracket(seasonId, groupStandingsMap);

      } catch(err) { showError(err); }
    }

    async function loadSezona1Data() {
      try {
        const groupsSnap = await getDocs(collection(db, 'seasons', 'sezona-1', 'groups'));
        const groups = []; groupsSnap.forEach(d => groups.push({id:d.id,...d.data()}));
        groups.sort((a,b) => a.id.localeCompare(b.id));

        await Promise.all(groups.map(async group => {
          const playersSnap = await getDocs(collection(db,'seasons','sezona-1','groups',group.id,'players'));
          const letter = group.id.replace(/[^a-zA-Z]/g,'').slice(-1).toUpperCase();

          playersSnap.forEach(p => {
            const d = p.data();
            const standingsRow = {
              name: d.name, win: d.win, draw: d.draw, lost: d.lost, total: d.total,
              legs: d.legs, pts: d.pts, avg: d.avg, f9: d.f9, bl: d.bl, bco: d.bco, x180: d.x180
            };
            registerPlayerSeasonData(d.name, 'sezona-1', SEASON_LABELS['sezona-1'], letter, group.name, standingsRow, [], d.playoff || null);
          });
        }));
      } catch(err) {
        console.error('Greška pri učitavanju sezone 1:', err);
      }
    }

    // Podaci se dohvate i renderiraju odmah čim stignu (Challonge lazy-load
    // rješava mobilnu performansu, pa bracketovi više ne moraju čekati da
    // korisnik otvori taj tab - ovo je bitno i da NAJBOLJI U LIGI odmah
    // uključi playoff mečeve u izračun).
    let upperBracketReady = false;
    let lowerBracketReady = false;

    async function loadBracket(seasonId, groupStandingsMap) {
      try {
        const bracketSnap = await getDocs(collection(db,'seasons',seasonId,'bracket'));
        const matchesByRound = {};
        bracketSnap.forEach(d => { matchesByRound[d.id] = d.data(); });
        renderBracket(matchesByRound, groupStandingsMap);
        upperBracketReady = true;
        refreshNajboljiWithPlayoffs();
      } catch(err) {
        document.getElementById('gornji-zdrijeb-content').innerHTML =
          '<div class="error-state">Greška pri učitavanju ždrijeba: ' + escapeHtml(err.message) + '</div>';
      }
    }

    async function loadLowerBracket(seasonId) {
      try {
        const lowerBracketSnap = await getDocs(collection(db,'seasons',seasonId,'lower-bracket'));
        const matchesByRound = {};
        lowerBracketSnap.forEach(d => { matchesByRound[d.id] = d.data(); });
        renderLowerBracket(matchesByRound);
        lowerBracketReady = true;
        refreshNajboljiWithPlayoffs();
      } catch(err) {
        document.getElementById('donji-zdrijeb-content').innerHTML =
          '<div class="error-state">Greška pri učitavanju ždrijeba: ' + escapeHtml(err.message) + '</div>';
      }
    }

    // Zadnji poznati grupni presjek (postavlja ga loadStandings) - potreban
    // ovdje da refreshNajboljiWithPlayoffs može ponovno spojiti grupne +
    // playoff podatke bez obzira koji od ta dva async izvora stigne zadnji.
    let latestGroupStats = null;       // allPlayersStats iz grupa
    let latestBestMatchByKolo = null;  // best match po kolu (grupna faza)
    let latestMvpByKolo = null;        // MVP po kolu (grupna faza)

    function refreshNajboljiWithPlayoffs() {
      if (!latestGroupStats) return; // grupni podaci još nisu stigli
      // Bracket podaci koji još nisu stigli jednostavno se preskaču (prazan objekt),
      // funkcija se ionako zove ponovno čim upper/lower bracket stigne.
      const playoffData = collectPlayoffStatsAndBestMatch();
      const combinedStats = [...latestGroupStats, ...playoffData.perPlayerStats];
      const combinedBestMatchByKolo = { ...latestBestMatchByKolo, ...playoffData.bestMatchByRound };
      const combinedMvpByKolo = { ...latestMvpByKolo, ...playoffData.mvpByRound };
      setLeagueStatsForSeason(ACTIVE_SEASON_ID, combinedStats, combinedBestMatchByKolo, combinedMvpByKolo);
    }

    // ── NAJBOLJI U LIGI: VIŠE SEZONA ──
    // Sve sezone iz SEASON_ORDER osim trenutno aktivne se pokušavaju učitati
    // za "Najbolji u ligi" tab (aktivna se već puni kroz loadStandings/
    // loadBracket/loadLowerBracket). Izvodi se iz SEASON_ORDER umjesto ručne
    // liste, tako da dodavanje sezona-4 u SEASON_ORDER bude dovoljno - ništa
    // se ovdje ne mora ručno dirati. Sezone bez podataka (prazne grupe) se
    // jednostavno tiho preskaču u loadLeagueStatsForSeason.
    function getAdditionalLeagueStatSeasons() {
      return SEASON_ORDER.filter(s => s !== ACTIVE_SEASON_ID && s !== 'sezona-1'); // sezona-1 ima svoj poseban arhivski format (bez matches subcollectiona)
    }

    // leagueStatsCache[ACTIVE_SEASON_ID] se puni postojećim tokom (latestGroupStats itd.),
    // dodatne sezone pune se kroz loadLeagueStatsForSeason ispod.
    const leagueStatsCache = {};
    let activeNajboljiSeason = ACTIVE_SEASON_ID;

    function setLeagueStatsForSeason(seasonId, groupStats, bestMatchByRound, mvpByRound) {
      leagueStatsCache[seasonId] = { groupStats, bestMatchByRound, mvpByRound };
      renderNajboljiSeasonTabs();
      if (seasonId === activeNajboljiSeason) renderActiveNajboljiSeason();
    }

    function renderNajboljiSeasonTabs() {
      const wrap = document.getElementById('najbolji-season-tabs');
      const seasonIds = Object.keys(leagueStatsCache).filter(s => SEASON_ORDER.includes(s)).sort((a,b)=>SEASON_ORDER.indexOf(a)-SEASON_ORDER.indexOf(b));
      if (seasonIds.length <= 1) { wrap.innerHTML = ''; return; } // samo jedna sezona - nema smisla prikazivati tabove
      wrap.innerHTML = seasonIds.map(s =>
        `<button class="player-season-tab ${s===activeNajboljiSeason?'active':''}" onclick="switchNajboljiSeason('${s}')">${escapeHtml(SEASON_LABELS[s]||s)}</button>`
      ).join('');
    }

    function switchNajboljiSeason(seasonId) {
      activeNajboljiSeason = seasonId;
      renderNajboljiSeasonTabs();
      renderActiveNajboljiSeason();
    }
    window.switchNajboljiSeason = switchNajboljiSeason;

    function renderActiveNajboljiSeason() {
      const data = leagueStatsCache[activeNajboljiSeason];
      if (!data) return;
      renderNajbolji(data.groupStats);
      renderBestMatches(data.bestMatchByRound, data.mvpByRound);
    }

    // Generički loader za sezone koje NISU trenutno aktivna sezona (npr. sezona-3
    // dok se igra usporedno ili nakon što sezona-2 završi). Ne dira TABLICE tab,
    // koloDataMap, playerDatabase ni bilo koji postojeći sezona-2 kod - samo
    // izračunava iste agregate (standings + best match/MVP + playoff) za tu sezonu
    // i puni leagueStatsCache preko setLeagueStatsForSeason.
    async function loadLeagueStatsForSeason(seasonId) {
      try {
        const groupsSnap = await getDocs(collection(db, 'seasons', seasonId, 'groups'));
        const groups = []; groupsSnap.forEach(d => groups.push({id:d.id,...d.data()}));
        if (!groups.length) return; // sezona još nema grupa - preskoči tiho
        groups.sort((a,b) => a.id.localeCompare(b.id));

        const bestMatchByKolo = {};
        const mvpByKolo = {};

        const groupsData = await Promise.all(groups.map(async group => {
          const playersSnap = await getDocs(query(collection(db,'seasons',seasonId,'groups',group.id,'players'), orderBy('position')));
          const players = []; playersSnap.forEach(p => players.push(p.data().name));

          const matchesSnap = await getDocs(collection(db,'seasons',seasonId,'groups',group.id,'matches'));
          const matchesMap  = {}; matchesSnap.forEach(m => { const d=m.data(); matchesMap[`${d.kolo}_${d.mec}`]=d; });

          const schedule  = generateSchedule(players);
          const standings = computeStandings(players, schedule, matchesMap);

          schedule.forEach(({ kolo, matches }) => {
            matches.forEach(({ mec }) => {
              const m = matchesMap[`${kolo}_${mec}`];
              if (m) {
                considerBestMatch(bestMatchByKolo, kolo, m, group.name);
                considerMVP(mvpByKolo, kolo, m);
              }
            });
          });

          return standings;
        }));

        const groupStats = groupsData.flat();

        // Playoff (gornji/donji ždrijeb) za tu sezonu, ako postoji - koristi
        // odvojene mape (ne globalne bracketMatchData/lowerBracketMatchData
        // koje su rezervirane za trenutno aktivnu sezonu i njen popup/profil prikaz).
        const [bracketSnap, lowerBracketSnap] = await Promise.all([
          getDocs(collection(db,'seasons',seasonId,'bracket')).catch(() => null),
          getDocs(collection(db,'seasons',seasonId,'lower-bracket')).catch(() => null)
        ]);
        const bracketDataMap = {};
        if (bracketSnap) bracketSnap.forEach(d => { bracketDataMap[d.id] = d.data(); });
        const lowerBracketDataMap = {};
        if (lowerBracketSnap) lowerBracketSnap.forEach(d => { lowerBracketDataMap[d.id] = d.data(); });

        const playoffData = collectPlayoffStatsAndBestMatch(bracketDataMap, lowerBracketDataMap);
        const combinedStats = [...groupStats, ...playoffData.perPlayerStats];
        const combinedBestMatchByKolo = { ...bestMatchByKolo, ...playoffData.bestMatchByRound };
        const combinedMvpByKolo = { ...mvpByKolo, ...playoffData.mvpByRound };

        setLeagueStatsForSeason(seasonId, combinedStats, combinedBestMatchByKolo, combinedMvpByKolo);
      } catch(err) {
        console.error(`Greška pri učitavanju "Najbolji u ligi" za ${seasonId}:`, err);
      }
    }

    function loadAdditionalLeagueStatSeasons() {
      getAdditionalLeagueStatSeasons().forEach(seasonId => loadLeagueStatsForSeason(seasonId));
    }

    // ── TABLICE ARHIVA (prošle sezone, puni standings + raspored, read-only) ──
    // Odvojeno od aktivne sezone (koja koristi koloDataMap/createAccordion) -
    // koristi arhivske, namespace-ane funkcije definirane u prvom <script> bloku
    // (archiveKoloDataMap, createArchiveAccordion...), tako da nikad ne kolidira
    // s DOM-om ili globalnim mapama aktivne sezone.
    const archiveDataCache = {}; // seasonId -> html string (izgrađen jednom, keširan)
    let activeTablicaTab = 'active'; // 'active' | seasonId arhive

    async function loadArchiveSeason(seasonId) {
      if (archiveDataCache[seasonId]) return; // već učitano
      try {
        const groupsSnap = await getDocs(collection(db, 'seasons', seasonId, 'groups'));
        const groups = []; groupsSnap.forEach(d => groups.push({id:d.id,...d.data()}));
        if (!groups.length) return; // sezona nema grupa (arhiva još ne postoji) - preskoči tiho

        groups.sort((a,b) => a.id.localeCompare(b.id));

        const groupsHtml = await Promise.all(groups.map(async (group, i) => {
          const playersSnap = await getDocs(query(collection(db,'seasons',seasonId,'groups',group.id,'players'), orderBy('position')));
          const players = []; playersSnap.forEach(p => players.push(p.data().name));

          const matchesSnap = await getDocs(collection(db,'seasons',seasonId,'groups',group.id,'matches'));
          const matchesMap  = {}; matchesSnap.forEach(m => { const d=m.data(); matchesMap[`${d.kolo}_${d.mec}`]=d; });

          const schedule  = generateSchedule(players);
          const standings = computeStandings(players, schedule, matchesMap);
          const uid = `arch-${seasonId}-${i+1}`;

          return createArchiveAccordion(group.name, uid, String(i+1), standings, schedule, matchesMap);
        }));

        archiveDataCache[seasonId] = groupsHtml.join('');
        renderTablicaSeasonTabs(); // sezona sad ima podataka - prikaži joj tab
      } catch (err) {
        console.error(`Greška pri učitavanju arhive za ${seasonId}:`, err);
      }
    }

    function renderTablicaSeasonTabs() {
      const wrap = document.getElementById('tablice-season-tabs');
      const archiveSeasons = Object.keys(archiveDataCache).filter(s => SEASON_ORDER.includes(s)).sort((a,b)=>SEASON_ORDER.indexOf(a)-SEASON_ORDER.indexOf(b));
      if (!archiveSeasons.length) { wrap.innerHTML = ''; return; } // nema arhive - ne prikazuj tabove (današnje ponašanje)

      const activeLabel = SEASON_LABELS[ACTIVE_SEASON_ID] || ACTIVE_SEASON_ID;
      const buttons = [
        `<button class="player-season-tab ${activeTablicaTab==='active'?'active':''}" onclick="switchTablicaTab('active')">${escapeHtml(activeLabel)}</button>`,
        ...archiveSeasons.map(s =>
          `<button class="player-season-tab ${activeTablicaTab===s?'active':''}" onclick="switchTablicaTab('${s}')">${escapeHtml(SEASON_LABELS[s]||s)} (Arhiva)</button>`
        )
      ];
      wrap.innerHTML = buttons.join('');
    }

    function switchTablicaTab(target) {
      activeTablicaTab = target;
      renderTablicaSeasonTabs();
      const contentEl = document.getElementById('content');
      const archiveEl = document.getElementById('archive-content');
      if (target === 'active') {
        contentEl.style.display = '';
        archiveEl.style.display = 'none';
      } else {
        contentEl.style.display = 'none';
        archiveEl.style.display = '';
        archiveEl.innerHTML = archiveDataCache[target] || '<div class="empty-state">Nema podataka za ovu sezonu.</div>';
      }
    }
    window.switchTablicaTab = switchTablicaTab;

    function loadArchiveSeasons() {
      // Sezona 1 ima poseban legacy oblik (standings polja izravno na igraču,
      // bez matches subcollectiona) i već ima svoj prikaz kroz playerDatabase/
      // profil popup - generateSchedule+computeStandings bi za nju dao krive
      // (nul-ove) rezultate jer nema mečeva za izračun, pa se ovdje preskače.
      SEASON_ORDER.filter(s => s !== ACTIVE_SEASON_ID && s !== 'sezona-1').forEach(seasonId => loadArchiveSeason(seasonId));
    }

    // ── BOOTSTRAP ──
    // Redoslijed je bitan: prvo se pročita koja je sezona aktivna, tek onda
    // se pokreću svi loaderi koji o tome ovise (TABLICE, bracketovi, Najbolji
    // u ligi, arhiva). Sezona 1 (posebni legacy oblik) učitava se neovisno.
    async function bootstrap() {
      ACTIVE_SEASON_ID = await resolveActiveSeasonId();
      window.ACTIVE_SEASON_ID = ACTIVE_SEASON_ID;
      activeNajboljiSeason = ACTIVE_SEASON_ID;

      loadSezona1Data();
      loadStandings(ACTIVE_SEASON_ID);
      loadLowerBracket(ACTIVE_SEASON_ID);
      loadAdditionalLeagueStatSeasons();
      loadArchiveSeasons();
    }

    bootstrap();
  </script>
</body>
</html>
