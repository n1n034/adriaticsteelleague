<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a1628">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-status-bar-style" content="black-translucent">
  <title>Adriatic Steel League</title>
  <meta name="description" content="Adriatic Steel League - službena darts liga sa 8 grupa, uživo rezultati, tablice i statistike igrača. Pratite ždrijeb, najbolje u ligi i sve matcheve Sezone 2.">
  <meta name="keywords" content="Adriatic Steel League, ASL, darts liga, darts rezultati, darts tablice, darts Croatia, darts Hrvatska, steel tip darts">
  <meta name="author" content="Adriatic Steel League">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;800&display=swap" rel="stylesheet"></noscript>
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></noscript>
  <link rel="icon" href="images/ASL-logo.webp">

  <style>
    :root {
      --text: #ffffff;
      --muted: #c8d3ea;
      --panel: rgba(8, 14, 28, 0.82);
      --panel-2: rgba(12, 20, 38, 0.96);
      --header: rgba(21, 49, 99, 0.95);
      --header-hover: rgba(39, 81, 159, 0.98);
      --line: rgba(255,255,255,0.10);
      --shadow: 0 18px 50px rgba(0,0,0,0.35);
      --radius: 18px;
      --table-head: #183a78;
      --table-row-hover: rgba(110, 168, 255, 0.14);
    }

    * { box-sizing: border-box; scrollbar-width: none; -ms-overflow-style: none; }
    *::-webkit-scrollbar { display: none; }

    html, body {
      margin: 0; padding: 0;
      width: 100%; min-height: 100%;
      overflow-x: hidden;
      background: #1a3a5c;
      font-family: 'Lexend', sans-serif;
      font-weight: 400;
      color: var(--text);
    }

    button, input, select, textarea { font-family: inherit; }

    .bg-image {
      position: fixed; inset: 0; z-index: 0;
      background-image: url("images/background.webp");
      background-size: cover; background-position: center center; background-repeat: no-repeat;
    }

    .bg-overlay {
      position: fixed; inset: 0; z-index: -1;
      background: linear-gradient(rgba(3,8,18,0.55), rgba(3,8,18,0.78));
    }

    .page { position: relative; min-height: 100vh; width: 100%; padding: 26px; }

    .container { max-width: 1300px; margin: 0 auto; animation: fadeInUp 0.5s ease both; }

    .hero { text-align: center; margin-bottom: 40px; }
    .hero p { margin: 15px 0 15px 0; font-size: 2rem; font-weight: 600; letter-spacing: 1px; text-align: center; text-shadow: 0 6px 6px rgba(0, 0, 0, 0.5); }

    .tabs { display: flex; justify-content: space-evenly; flex-wrap: wrap; margin-bottom: 24px; }

    .tab-btn {
      background: rgba(10,19,38,0.78); border: 1px solid rgba(255,255,255,0.18);
      color: #fff; padding: 10px 40px; border-radius: 999px;
      font-size: 1rem; font-weight: 700; letter-spacing: 0.5px;
      cursor: pointer; transition: 0.25s ease;
    }
    .tab-btn:hover { background: rgba(38,74,138,0.92); }
    .tab-btn.active { box-shadow: 0 0 12px rgba(255,255,255,0.55); background: rgba(21,49,99,1); border-color: rgba(255,255,255,0.8); }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .league-logo {
      display: block; margin: 0 auto; height: auto;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.75)) drop-shadow(0 0 18px rgba(120,170,255,0.18));
    }

    h1 { margin: 15px 0 15px 0; font-size: 3.5rem; letter-spacing: 1px; text-align: center; text-shadow: 0 6px 6px rgba(0, 0, 0, 0.5); }

    .social { display: flex; justify-content: center; align-items: center; gap: 14px; flex-wrap: wrap; }
    .social a {
      width: 50px; height: 50px; display: inline-flex; align-items: center; justify-content: center;
      border-radius: 999px; text-decoration: none; color: #fff;
      background: rgba(10,19,38,0.78); border: 1px solid rgba(255,255,255,0.12);
      transition: 0.25s ease; box-shadow: 0 8px 20px rgba(0,0,0,0.50); font-size: 1.2rem;
    }
    .social a:hover { transform: translateY(-2px); background: rgba(38,74,138,0.92); }

    .last-updated { text-align: left; font-size: 1rem; font-weight: 700;  text-transform: uppercase; letter-spacing: 0.5px; margin: 20px 0; text-shadow: 0 6px 6px rgba(0, 0, 0, 0.5);}

    /* -- ZADNJI MEČEVI -- */
    .recent-matches-wrap { margin: 0 0 22px; animation: fadeInUp 0.5s ease both; }
    .recent-matches-title {
      font-size: 0.82rem; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; text-shadow: 0 6px 6px rgba(0, 0, 0, 0.5);
      margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
    }
    .recent-matches-row {
      overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 24px, #000 calc(100% - 24px), transparent);
      mask-image: linear-gradient(90deg, transparent, #000 24px, #000 calc(100% - 24px), transparent);
    }
    .recent-matches-track {
      display: flex; gap: 10px; width: max-content; cursor: grab; touch-action: pan-y;
      animation: recentMatchesSlide linear infinite; animation-duration: var(--rm-duration, 34s);
    }
    .recent-matches-track:active { cursor: grabbing; }
    .recent-matches-row.no-slide .recent-matches-track { animation: none; cursor: default; touch-action: auto; }
    .recent-matches-wrap:hover .recent-matches-track { animation-play-state: paused; }
    @keyframes recentMatchesSlide {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }
    .recent-match-chip {
      flex: 0 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
      padding: 10px 16px; white-space: nowrap; box-shadow: var(--shadow);
    }
    .recent-match-players { font-size: 0.85rem; font-weight: 700; }
    .recent-match-score { color: var(--table-head); background: rgba(255,255,255,0.9); border-radius: 6px; padding: 1px 7px; margin: 0 6px; font-weight: 800; }
    .recent-match-meta { font-size: 0.7rem; color: var(--muted); margin-top: 3px; }

    @keyframes recentMatchHighlightPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(126,184,255,0); }
      25% { box-shadow: 0 0 0 4px rgba(126,184,255,0.65); }
    }
    .popup-match.highlight-target { animation: recentMatchHighlightPulse 1.1s ease-out 2; border-radius: 14px; }

    /* -- PLAYER SEARCH -- */
    .player-search-wrap {
      position: relative; margin-bottom: 24px; animation: fadeInUp 0.5s ease both; z-index: 60;
      display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    }

    .player-search-box {
      display: flex; align-items: center; gap: 10px;
      background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 12px 18px; backdrop-filter: blur(7px); box-shadow: var(--shadow);
      transition: 0.2s ease;
      width: max-content;
      height: 44px;
    }
    .player-search-box:has(.player-search-input:focus) { border-color: rgba(120,170,255,0.4); box-shadow: 0 0 0 3px rgba(120,170,255,0.12); }

    .player-search-icon { color: var(--muted); font-size: 0.95rem; }

    .player-search-input {
      flex: 1; background: transparent; border: none; outline: none;
      color: #fff; font-size: 1rem; font-family: 'Lexend', sans-serif;
    }
    .player-search-input::placeholder { color: rgba(255,255,255,0.35); }

    .player-search-results {
      position: absolute; top: calc(100% + 8px); left: 0; right: 0; z-index: 50;
      background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px;
      box-shadow: var(--shadow); overflow: hidden; max-height: 340px; overflow-y: auto;
      animation: fadeInUp 0.2s ease both;
    }

    .player-search-item {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 11px 16px; cursor: pointer; transition: 0.15s ease;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .player-search-item:last-child { border-bottom: none; }
    .player-search-item:hover { background: var(--table-row-hover); }
    .player-search-item-name { font-size: 1rem; font-weight: 600; color: #fff; }
    .player-search-item-group { font-size: 0.8rem; color: var(--muted); white-space: nowrap; }

    .player-search-empty { padding: 16px; text-align: center; color: var(--muted); font-size: 0.88rem; }

    .loading-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 20px; gap: 16px; }
    .loading-spinner { width: 34px; height: 34px; border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid rgba(120,170,255,0.85); border-radius: 50%; animation: spin 1s linear infinite; }
    .loading-text { font-size: 1rem; font-weight: 500; letter-spacing: 0.5px; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

    .accordion-item {
      background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
      overflow: hidden; margin-bottom: 16px; box-shadow: var(--shadow);
      backdrop-filter: blur(7px); animation: fadeInUp 0.5s ease both;
    }
    .accordion-item.open { border: 1px solid #c7d2eb; box-shadow: 0 0 12px rgba(255,255,255,0.55); }

    .accordion-header {
      width: 100%; border: none; background: var(--header); color: #fff;
      padding: 15px; font-size: 1rem; font-weight: 700; cursor: pointer;
      text-align: left; transition: 0.25s ease;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .accordion-header:hover { background: var(--header-hover); }

    .accordion-title { display: flex; align-items: center; gap: 12px; }
    .accordion-badge {
      min-width: 36px; height: 36px; padding: 0 10px; border-radius: 999px;
      display: inline-flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.14);
      font-size: 0.9rem; font-weight: 700;
    }
    .accordion-icon { font-size: 1.5rem; }

    .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; background: rgba(6,12,24,0.50); }
    #najbolji-content .accordion-item.open .accordion-content { max-height: none !important; }
    .accordion-inner { padding: 16px; }

    .table-wrap { overflow-x: auto; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08); background: var(--panel-2); transition: 0.25s ease;}

    table { width: 100%; border-collapse: collapse; background: var(--panel-2); color: #eef4ff; }
    thead th { background: var(--table-head); color: #fff; text-align: center; padding: 13px 14px; font-size: 1rem; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.10); white-space: nowrap; }
    tbody td { padding: 12px 14px; font-size: 1rem; color: #edf3ff; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.07); white-space: nowrap; }
    tbody tr:nth-child(even) { background: rgba(255,255,255,0.035); }
    tbody tr:nth-child(4) td { border-bottom: 2px solid rgba(255,255,255,0.75); }
    tfoot td.table-footer-brand { text-align: center; padding: 10px 12px; font-size: 0.82rem; font-weight: 600; letter-spacing: 0.3px; color: rgba(255,255,255,0.7); background: rgba(255,255,255,0.03); border-top: 1px solid rgba(255,255,255,0.10); }
    #tab-najbolji tbody tr td { text-align: left; border-bottom: none; }
    tbody tr:hover { background: var(--table-row-hover); }

    .form-badges { display: inline-flex; gap: 3px; vertical-align: middle; }
    .form-badge {
      width: 18px; height: 18px; border-radius: 5px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 0.62rem; font-weight: 800; color: #fff; flex-shrink: 0;
    }
    .form-badge.w { background: rgba(46,204,113,0.85); }
    .form-badge.l { background: rgba(231,76,60,0.85); }
    .form-badge.d { background: rgba(243,156,18,0.85); }

    .empty-state, .error-state { background: rgba(10,18,34,0.94); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 18px; color: #e7efff; }
    .error-state { color: #ffd7d7; border-color: rgba(255,120,120,0.18); }

    /* -- BRACKET -- */
    .bracket-wrap {
      overflow-x: auto; 
      animation: fadeInUp 0.5s ease both;
      position: relative;
    }

    .bracket-rounds {
      display: flex; align-items: stretch;
      min-width: max-content; gap: 0;
    }

    .bracket-round { display: flex; flex-direction: column; width: 100%; }

    /* Bracket connectors */
    .bracket-round:not(:first-child) .bracket-match::before {
      content: '';
      position: absolute;
      top: 50%;
      right: 100%;
      width: 8px;
      height: 0;
      border-top: 1.5px solid rgba(255,255,255,1);
      pointer-events: none;
    }

    .bracket-round:not(:last-child) .bracket-match.pair-top::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 100%;
      width: 8px;
      height: calc(var(--pair-offset, 0px) / 2);
      border-right: 1.5px solid rgba(255,255,255,1);
      border-top: 1.5px solid rgba(255,255,255,1);
      pointer-events: none;
    }

    .bracket-round:not(:last-child) .bracket-match.pair-bottom::after {
      content: '';
      position: absolute;
      bottom: 50%;
      left: 100%;
      width: 8px;
      height: calc(var(--pair-offset, 0px) / 2);
      border-right: 1.5px solid rgba(255,255,255,1);
      border-bottom: 1.5px solid rgba(255,255,255,1);
      pointer-events: none;
    }

    .bracket-match { position: relative; }

    .bracket-round-title {
      text-align: center; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.5px;
      padding: 10px 12px; background: rgba(21,49,99,0.9);
      white-space: nowrap; border-right: 1px solid rgba(255,255,255,0.06);
    }

    .bracket-matches {
      display: flex; flex-direction: column; flex: 1;
      justify-content: space-around; padding: 8px 0; position: relative;
    }

    .bracket-match {
      display: flex; flex-direction: column;
      margin: 4px 8px; position: relative; cursor: pointer;
    }
    .bracket-match:hover .bracket-player { border-color: rgba(120,170,255,0.3); }

    .bracket-player {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 10px; background: rgba(12,20,38,0.9);
      border: 1px solid rgba(255,255,255,0.08);
      font-size: 0.82rem; gap: 8px; transition: 0.2s ease;
    }
    .bracket-player:first-child { border-radius: 8px 8px 0 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .bracket-player:last-child  { border-radius: 0 0 8px 8px; }
    .bracket-player.winner { background: rgba(21,49,99,0.95); border-color: rgba(120,170,255,0.35); font-weight: 700; color: #fff; }
    .bracket-player.loser  { opacity: 0.4; }
    .bracket-player.tbd    { color: rgba(255,255,255,0.3); font-style: italic; }
    .bracket-player-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
    .bracket-player-score { font-weight: 800; font-size: 0.85rem; min-width: 20px; text-align: right; color: #7eb8ff; }
    .bracket-round:last-child .bracket-matches{justify-content: center;}
    

    /* 3rd place match */
    .bracket-third-title {
      text-align: center; font-size: 0.75rem; font-weight: 700;
      color: #cd7f32; letter-spacing: 0.5px; margin: 10px;
    }

    .bracket-final-title {
      text-align: center; font-size: 0.85rem; font-weight: 800;
      color: #FFD700; letter-spacing: 1px; margin: 10px;
      text-shadow: 0 0 12px rgba(255,215,0,0.35);
    }

    /* -- TOAST (poruke poslije upload zahtjeva za avatar) -- */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      padding: 12px 20px;
      background: rgba(12, 20, 38, 0.97);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #fff;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      transform: translateY(80px);
      opacity: 0;
      transition: 0.3s ease;
      max-width: calc(100vw - 32px);
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast.success {
      border-color: rgba(46, 204, 113, 0.4);
      color: #2ecc71;
    }

    .toast.error {
      border-color: rgba(231, 76, 60, 0.4);
      color: #e74c3c;
    }

    /* -- POPUP -- */
    .match-popup-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(0,0,0,0.72); backdrop-filter: blur(4px);
      display: flex; align-items: flex-start; justify-content: center;
      padding: 24px 16px; animation: fadeInUp 0.2s ease both;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    /* Popup zauzima otprilike 80% ekrana (visina) na svim veličinama -
       primjetno veći, "punjiji" prikaz nego mala plutajuća kartica, ali bez
       da doslovno pokriva cijeli ekran. */
    .match-popup {
      position: relative;
      background: linear-gradient(180deg, rgba(13,20,38,0.98), rgba(6,10,20,0.98));
      border: 1px solid rgba(126,184,255,0.18);
      border-radius: 22px;
      padding: 28px;
      width: 100%;
      max-width: 680px;
      box-shadow:
        0 30px 80px rgba(0,0,0,0.65),
        inset 0 1px 0 rgba(255,255,255,0.06);
    }

    .popup-close {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: .2s ease;
    }

    .popup-close:hover {
      background: rgba(126,184,255,0.18);
      border-color: rgba(126,184,255,0.35);
      transform: scale(1.05);
    }

    .popup-back-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      height: 42px;
      padding: 0 16px;
      border-radius: 21px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: .2s ease;
    }

    .popup-back-btn:hover {
      background: rgba(126,184,255,0.18);
      border-color: rgba(126,184,255,0.35);
      transform: scale(1.05);
    }

    /* .match-popup je max-width:680px i centriran (overlay justify-content:
       center) - desni rub mu je uvijek na 50vw + 340px čim ima mjesta za pun
       max-width. calc(50vw - 340px - 58px) računa poziciju gumba 16px desno
       od tog ruba (58 = 42px širina gumba + 16px razmak). max(20px, ...) je
       ključan: na uskim ekranima calc ide negativan (nema mjesta sa strane),
       pa max() vrati 20px i gumb ostane u kutu ekrana - bez toga bi gumb na
       srednjim širinama (~700-830px) izlazio izvan viewporta jer bi formula
       gurnula desni rub gumba preko ruba ekrana. Glatko klizi između "u kutu"
       i "sa strane popupa" bez skoka na točnoj granici, bez potrebe za
       @media prijelomom za ovo - samo se 480px niže brine za veličinu gumba
       na sitnim telefonima. */
    .popup-fixed-close {
      position: fixed; top: 55px; right: max(20px, calc(50vw - 252px - 58px)); z-index: 1010;
      width: 42px; height: 42px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(10,19,38,0.85); backdrop-filter: blur(4px);
      color: #fff; font-size: 1.1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease; box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }
    .popup-fixed-close:hover {
      background: rgba(38,74,138,0.92); border-color: rgba(126,184,255,0.35); transform: scale(1.05);
    }
    @media (max-width: 480px) {
      .popup-fixed-close { top: 46px; right: 38px; width: 38px; height: 38px; font-size: 1rem; }
    }

    .popup-match {
      position: relative;
      background:linear-gradient(135deg,rgba(24,39,72,0.95),rgba(9,15,28,0.95));
      border: 1px solid rgba(255,255,255,0.06);
      margin-bottom: 20px;
      border-radius: 22px;
      overflow: hidden;
      transition: .2s ease;
    }

    .popup-match:last-child{
      margin-bottom: 0;
    }

    .popup-match.mvp-card{
      margin-bottom: 0;
    }

    .popup-match:hover {
      border-color: rgba(126,184,255,0.25);
      transform: translateY(-2px);
    }

    .popup-match-top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      padding: 20px;
      column-gap: 40px;
    }

    .popup-player-name {
      font-size: 1.05rem;
      font-weight: 800;
      color: #fff;
      justify-self: center;
      text-align: center;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .popup-player-name.right {
      justify-self: center;

    // -- HELPERS --
    function escapeHtml(v) {
      if (v === null || v === undefined) return '';
      return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }

    function switchTab(name) {
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + name).classList.add('active');
      event.currentTarget.classList.add('active');

      if (name === 'avg-lige') {
        window.loadAvgLige(activeAvgLigeTab);
      }
    }

    // -- BERGER --
    const berger8 = [
      [[8,1],[2,7],[3,6],[4,5]],[[6,4],[5,8],[7,3],[1,2]],[[4,7],[3,1],[8,2],[5,6]],
      [[2,3],[7,5],[1,4],[6,8]],[[6,7],[4,2],[5,1],[8,3]],[[2,5],[1,6],[7,8],[3,4]],[[5,3],[8,4],[6,2],[7,1]]
    ];
    const berger9 = [
      {bye:1,matches:[[2,9],[3,8],[4,7],[5,6]]},{bye:6,matches:[[7,5],[8,4],[9,3],[1,2]]},
      {bye:2,matches:[[3,1],[4,9],[5,8],[6,7]]},{bye:7,matches:[[8,6],[9,5],[1,4],[2,3]]},
      {bye:3,matches:[[4,2],[5,1],[6,9],[7,8]]},{bye:8,matches:[[9,7],[1,6],[2,5],[3,4]]},
      {bye:4,matches:[[5,3],[6,2],[7,1],[8,9]]},{bye:9,matches:[[1,8],[2,7],[3,6],[4,5]]},
      {bye:5,matches:[[6,4],[7,3],[8,2],[9,1]]}
    ];

    function generateSchedule(players) {
      const n = players.length, rounds = [];
      if (n === 8) {
        berger8.forEach((pairs, ri) => {
          rounds.push({ kolo: ri+1, matches: pairs.map((p,mi) => ({mec:mi+1, player1:players[p[0]-1], player2:players[p[1]-1]})), bye: null });
        });
        return rounds;
      }
      if (n === 9) {
        berger9.forEach((round, ri) => {
          rounds.push({ kolo: ri+1, matches: round.matches.map((p,mi) => ({mec:mi+1, player1:players[p[0]-1], player2:players[p[1]-1]})), bye: round.bye ? players[round.bye-1] : null });
        });
        return rounds;
      }

      // Generički circle-method za ostale veličine grupa - identična logika kao
      // group-detail.html-ov generateSchedule (mora ostati bajt-identična, jer
      // se mečevi traže po "kolo_mec" ključu - bilo kakva razlika u algoritmu
      // između admin unosa i ovog prikaza dala bi krive/nespojene parove).
      const list = [...players];
      if (n % 2 !== 0) list.push('BYE');
      const total = list.length;
      const fixed = list[0];
      const rotating = list.slice(1);
      const numRounds = total - 1;
      const matchesPerRound = total / 2;

      for (let r = 0; r < numRounds; r++) {
        const circle = [fixed, ...rotating];
        const roundMatches = [];
        for (let m = 0; m < matchesPerRound; m++) {
          const p1 = circle[m];
          const p2 = circle[total - 1 - m];
          if (p1 !== 'BYE' && p2 !== 'BYE') {
            roundMatches.push({ mec: roundMatches.length + 1, player1: p1, player2: p2 });
          }
        }
        rounds.push({ kolo: r + 1, matches: roundMatches, bye: null });
        rotating.unshift(rotating.pop());
      }
      return rounds;
    }

    // -- ZADNJI MEČEVI --
    // Kratka dinamička lista odigranih mečeva (grupe, AVG lige, bracket, lower
    // bracket) unutar zadnjih N dana - broj mečeva tjedno je velik (48+) i
    // raspoređeno se upisuju kroz cijeli tjedan (dogovori igrača), pa ni fiksni
    // broj zadnjih mečeva ni "trenutno kolo" ne daju kratku, uvijek-svježu
    // listu - klizni vremenski prozor od zadnjeg upisa (m.timestamp) to rješava.
    //
    // Raspon i broj kartica su podesivi bez deploya kroz isti config/active-season
    // Firestore dokument koji već nosi seasonId/trenutnoKolo/trenutnoKoloAvg (vidi
    // resolveActiveSeasonId niže u fileu) - polje sliderConfig, mapa s tri broja:
    //   rangeDays    - koliko dana unatrag ulazi u listu (klizni prozor, vidi gore) -
    //                  primjenjuje se bez obzira na broj mečeva u tom rasponu
    //   maxItems     - gornja granica broja mečeva dostupnih u "Zadnji mečevi" popupu
    //                  (klik na karticu - vidi openRecentMatchesPopup niže)
    //   sliderItems  - koliko od tih (maxItems) mečeva se stvarno prikazuje kao
    //                  kartice u sliderru na naslovnici (uvijek najnovijih N, jer
    //                  je currentRecentItems već sortiran po vremenu)
    // SLIDER_CONFIG_DEFAULTS je fallback kad polje/dokument ne postoji ili je
    // neispravno - isti obrazac kao parseInt(activeSeasonConfig.trenutnoKolo) || 1.
    const SLIDER_CONFIG_DEFAULTS = { rangeDays: 3, maxItems: 15, sliderItems: 6 };
    let recentMatchesPool = [];
    // Snapshot točno onih kartica koje su trenutno prikazane u sliderru - puni ga
    // renderRecentMatches, čita openRecentMatchesPopup (klik na karticu otvara
    // popup sa SVIM ovim mečevima, skrolan/highlightan na baš onaj kliknuti).
    let currentRecentItems = [];

    // legs/seasonId su isti podaci koje već računaju openKoloPopup/openArchiveKoloPopup/
    // openBracketMatchPopup/openLowerBracketMatchPopup za svoj tip meča - pozivatelj ih
    // izračuna jednom ovdje da renderMatchPopupCard može ispravno prikazati "Best of X
    // legs" i AVG/First9 +/- diff i za mečeve u "Zadnji mečevi" popupu.
    function pushRecentMatch(m, label, { legs, seasonId } = {}) {
      if (!m || !m.score || !m.timestamp) return;
      const ts = typeof m.timestamp.toMillis === 'function' ? m.timestamp.toMillis() : new Date(m.timestamp).getTime();
      if (!ts || isNaN(ts)) return;
      recentMatchesPool.push({ player1: m.player1, player2: m.player2, score: m.score, ts, label, d: m, legs, seasonId });
    }

    function renderRecentMatches() {
      const wrap = document.getElementById('recent-matches-wrap');
      if (!wrap) return;
      const cfg = window.activeSeasonConfig?.sliderConfig || {};
      const rangeDays = parseInt(cfg.rangeDays) || SLIDER_CONFIG_DEFAULTS.rangeDays;
      const maxItems = parseInt(cfg.maxItems) || SLIDER_CONFIG_DEFAULTS.maxItems;
      const sliderItems = parseInt(cfg.sliderItems) || SLIDER_CONFIG_DEFAULTS.sliderItems;
      const cutoff = Date.now() - rangeDays * 24 * 60 * 60 * 1000;
      const seen = new Set();
      const items = recentMatchesPool
        .filter(m => m.ts >= cutoff)
        .sort((a, b) => b.ts - a.ts)
        .filter(m => {
          const key = `${m.player1}|${m.player2}|${m.score}|${m.ts}`;
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        })
        .slice(0, maxItems);

      currentRecentItems = items;

      if (!items.length) { wrap.style.display = 'none'; wrap.innerHTML = ''; return; }
      wrap.style.display = '';

      // Slider prikazuje samo prvih sliderItems (najnoviji, items je već sortiran
      // po vremenu) - ostatak do maxItems ostaje dostupan samo unutar popupa
      // (openRecentMatchesPopup ispod čita cijeli currentRecentItems, ne visibleItems).
      const visibleItems = items.slice(0, sliderItems);

      // index je pozicija u currentRecentItems (isti niz koji koristi
      // openRecentMatchesPopup) - klik na BILO koju karticu (uklj. drugu,
      // dupliciranu polovicu trake) otvara isti popup skrolan na taj meč.
      const chipHtml = (m, i) => `
            <div class="recent-match-chip" onclick="openRecentMatchesPopup(${i})" style="cursor:pointer;">
              <div class="recent-match-players">${escapeHtml(m.player1 || '?')}<span class="recent-match-score">${escapeHtml(m.score)}</span>${escapeHtml(m.player2 || '?')}</div>
              <div class="recent-match-meta">${escapeHtml(m.label || '')}</div>
            </div>`;

      // Infinite slider (traka duplicirana - kod translateX(-50%) izgleda
      // besprijekorno, jer je druga polovica identična prvoj). Ispod praga od
      // 4 kartice duplo/animacija izgleda čudno (prekratko/skače), pa se onda
      // prikaže statično bez animacije (klasa no-slide gasi @keyframes).
      const SLIDE_MIN_ITEMS = 4;
      const slide = visibleItems.length >= SLIDE_MIN_ITEMS;
      const chipsHtml = visibleItems.map(chipHtml).join('');
      const trackHtml = slide ? chipsHtml + visibleItems.map(chipHtml).join('') : chipsHtml;
      const duration = Math.max(visibleItems.length * 5, 20);

      wrap.innerHTML = `
        <div class="recent-matches-title"><i class="fas fa-bolt"></i> Zadnji mečevi:</div>
        <div class="recent-matches-row${slide ? '' : ' no-slide'}">
          <div class="recent-matches-track" data-duration="${duration}" style="--rm-duration:${duration}s;">${trackHtml}</div>
        </div>`;
    }

    // Klik na bilo koju karticu u "Zadnji mečevi" sliderru - otvara JEDAN popup sa
    // SVIM mečevima trenutno prikazanim u sliderru (currentRecentItems, isti snapshot),
    // skrolan/highlightan na baš onaj na koji je kliknuto (isti obrazac kao
    // openKoloPopup/openArchiveKoloPopup, vidi scrollToPopupMatch niže u fileu -
    // dostupna je do trenutka poziva jer je bootstrap asinkron).
    function openRecentMatchesPopup(index) {
      if (!currentRecentItems.length) return;
      const matchesHtml = currentRecentItems.map((m, i) => renderMatchPopupCard({
        titleLabel: m.label,
        legs: m.legs,
        matchTimestamp: m.d.timestamp || null,
        p1: m.player1, p2: m.player2, d: m.d, seasonId: m.seasonId,
        domId: `recent-match-${i}`,
        fromRecentMatchIndex: i
      })).join('');
      showPopup('Zadnji mečevi', matchesHtml, '');
      scrollToPopupMatch(`recent-match-${index}`);
    }

    // -- ZADNJI MEČEVI: DRAG ZA SLIDER --
    // Klasičan "draggable marquee" trik: dok se vuče, @keyframes animacija se
    // posve isključi (animation:none) i transform se ručno postavlja po
    // pokazivaču; na otpuštanje, animacija se vrati ali s negativnim
    // animation-delay koji odgovara točnoj poziciji gdje je korisnik pustio -
    // pa nastavlja glatko dalje umjesto da skoči na početak. Prag pomaka
    // (RM_DRAG_THRESHOLD) razlikuje "klik na meč" od "vuci slider" - dok se
    // taj prag ne pređe, klik i dalje normalno otvara meč.
    const RM_DRAG_THRESHOLD = 6;
    let rmDrag = null;

    function rmCurrentTranslateX(el) {
      const t = getComputedStyle(el).transform;
      if (!t || t === 'none') return 0;
      const m = t.match(/^matrix\(([^)]+)\)$/);
      if (!m) return 0;
      return parseFloat(m[1].split(',')[4]) || 0;
    }

    // Bitno: dok se prag pomaka (RM_DRAG_THRESHOLD) ne pređe, ne smije se
    // dirnuti ni transform ni animation - inače i običan klik (pointerdown pa
    // odmah pointerup, bez pomaka) resetira animaciju usred klika, što zna
    // spriječiti da se onclick na kartici uopće okine (baš ovo je bio bug:
    // svaki klik je samo "resetirao" slider umjesto da otvori meč).
    function rmDragStart(e) {
      const track = e.target.closest('.recent-matches-track');
      if (!track || track.closest('.no-slide')) return;
      const halfWidth = track.scrollWidth / 2;
      if (!halfWidth) return;
      rmDrag = {
        track, halfWidth,
        startX: e.clientX,
        pointerId: e.pointerId,
        baseX: null, // postavlja se tek u rmDragMove, kad prag stvarno bude pređen
        duration: parseFloat(track.dataset.duration) || 26,
        moved: false
      };
    }

    function rmDragMove(e) {
      if (!rmDrag) return;
      const dx = e.clientX - rmDrag.startX;
      if (!rmDrag.moved) {
        if (Math.abs(dx) <= RM_DRAG_THRESHOLD) return;
        rmDrag.moved = true;
        rmDrag.baseX = rmCurrentTranslateX(rmDrag.track);
        rmDrag.track.style.animation = 'none';
        try { rmDrag.track.setPointerCapture(rmDrag.pointerId); } catch (err) { /* ignoriraj */ }
      }
      let x = (rmDrag.baseX + dx) % rmDrag.halfWidth;
      if (x > 0) x -= rmDrag.halfWidth; // drži unutar [-halfWidth, 0] - beskonačno u oba smjera
      rmDrag.track.style.transform = `translateX(${x}px)`;
    }

    function rmDragEnd() {
      if (!rmDrag) return;
      const { track, halfWidth, duration, moved } = rmDrag;
      if (moved) {
        const x = rmCurrentTranslateX(track);
        const fraction = Math.abs(x) / halfWidth;
        track.style.transform = '';
        track.style.animation = '';
        track.style.animationDelay = `-${(fraction * duration).toFixed(3)}s`;
        // Spriječi da se ova vuka protumači kao klik na karticu ispod prsta/miša.
        const suppressClick = ev => { ev.stopPropagation(); ev.preventDefault(); };
        track.addEventListener('click', suppressClick, { capture: true, once: true });
      }
      // nije moved -> ništa nije ni dirnuto (animation/transform), klik prolazi normalno
      rmDrag = null;
    }

    document.getElementById('recent-matches-wrap')?.addEventListener('pointerdown', rmDragStart);
    window.addEventListener('pointermove', rmDragMove);
    window.addEventListener('pointerup', rmDragEnd);
    window.addEventListener('pointercancel', rmDragEnd);

    // Bracket/lower-bracket match dokumenti nemaju spremljen roundLabel (samo
    // player1/player2/score/timestamp, id oblika "QF_2") - ROUND_IDS/
    // ROUND_LABELS/LROUND_IDS/LROUND_LABELS su definirani niže u ovom fileu,
    // ali su const na top-level scope-u pa su dostupni do trenutka kad se ova
    // funkcija stvarno pozove (asinkroni bootstrap, nakon punog parsea filea).
    function bracketRoundLabelFromId(id, lower) {
      if (id === 'THIRD_1') return 'Utakmica za 3. mjesto';
      const cut = id.lastIndexOf('_');
      const prefix = cut === -1 ? id : id.slice(0, cut);
      const num = cut === -1 ? '' : id.slice(cut + 1);
      const ids = lower ? LROUND_IDS : ROUND_IDS;
      const labels = lower ? LROUND_LABELS : ROUND_LABELS;
      const i = ids.indexOf(prefix);
      const base = i !== -1 ? labels[i] : prefix;
      return num ? `${base} - Meč ${num}` : base;
    }

    function computeStandings(players, schedule, matchesMap) {
      const stats = {};
      players.forEach(p => { stats[p] = {win:0,draw:0,lost:0,total:0,legs:0,pts:0,avgSum:0,avgCount:0,f9Sum:0,f9Count:0,bl:0,bco:0,x180:0,form:[]}; });
      schedule.forEach(({kolo,matches}) => {
        matches.forEach(({mec,player1,player2}) => {
          const m = matchesMap[`${kolo}_${mec}`];
          if (!m || !m.score) return;
          const parts = m.score.split('-'); if (parts.length!==2) return;
          const s1=parseInt(parts[0]),s2=parseInt(parts[1]); if(isNaN(s1)||isNaN(s2)) return;
          const st1=stats[player1],st2=stats[player2]; if(!st1||!st2) return;
          st1.total++;st2.total++;st1.legs+=(s1-s2);st2.legs+=(s2-s1);
          if (m.score === '0-0') {
          } else if(m.score==='5-5'){st1.draw++;st2.draw++;st1.pts++;st2.pts++;st1.form.push('D');st2.form.push('D');}
          else if(s1>s2){st1.win++;st2.lost++;st1.pts+=2;st1.form.push('W');st2.form.push('L');}
          else{st2.win++;st1.lost++;st2.pts+=2;st1.form.push('L');st2.form.push('W');}
          // 0 se tretira kao "nema podatka" (isto kao null) - stvaran AVG/First9
          // od točno 0.00 nije realan, pa bi ušao u prosjek samo greškom.
          if(m.average1){st1.avgSum+=parseFloat(m.average1)||0;st1.avgCount++;}
          if(m.average2){st2.avgSum+=parseFloat(m.average2)||0;st2.avgCount++;}
          if(m.first9_1){st1.f9Sum+=parseFloat(m.first9_1)||0;st1.f9Count++;}
          if(m.first9_2){st2.f9Sum+=parseFloat(m.first9_2)||0;st2.f9Count++;}
          if (m.bestleg1) st1.bl = st1.bl === 0 ? parseInt(m.bestleg1) : Math.min(st1.bl, parseInt(m.bestleg1) || 999);
          if (m.bestleg2) st2.bl = st2.bl === 0 ? parseInt(m.bestleg2) : Math.min(st2.bl, parseInt(m.bestleg2) || 999);
          if(m.bestcheckout1)st1.bco=Math.max(st1.bco,parseInt(m.bestcheckout1)||0);
          if(m.bestcheckout2)st2.bco=Math.max(st2.bco,parseInt(m.bestcheckout2)||0);
          if(m['180_1'])st1.x180+=parseInt(m['180_1'])||0;
          if(m['180_2'])st2.x180+=parseInt(m['180_2'])||0;
        });
      });
      return Object.entries(stats).map(([name,s])=>({
        name,win:s.win,draw:s.draw,lost:s.lost,total:s.total,legs:s.legs,pts:s.pts,
        avg:s.avgCount>0?(s.avgSum/s.avgCount).toFixed(2):'--',
        f9:s.f9Count>0?(s.f9Sum/s.f9Count).toFixed(2):'--',
        bl:s.bl||'--',bco:s.bco||'--',x180:s.x180,
        form:s.form.slice(-5)
      })).sort((a,b)=>b.pts-a.pts||b.legs-a.legs||(a.avg==='--'?1:b.avg==='--'?-1:parseFloat(b.avg)-parseFloat(a.avg)));
    }

    // -- AVG LIGE --
    const AVG_LEAGUE_LABELS = { diamond: '💎 Diamond', gold: '🥇 Gold', silver: '🥈 Silver', bronze: '🥉 Bronze', zenska: '👑 Ženska liga' };
    const avgLigeDataCache = {}; // leagueId -> html string (izgrađeno jednom, keširano)
    let activeAvgLigeTab = 'zenska';

    function generateAvgSchedule(players) {
      const n = players.length;
      const berger8 = [
        [[8, 1], [2, 7], [3, 6], [4, 5]], [[6, 4], [5, 8], [7, 3], [1, 2]], [[4, 7], [3, 1], [8, 2], [5, 6]],
        [[2, 3], [7, 5], [1, 4], [6, 8]], [[6, 7], [4, 2], [5, 1], [8, 3]], [[2, 5], [1, 6], [7, 8], [3, 4]],
        [[5, 3], [8, 4], [6, 2], [7, 1]]
      ];
      const berger9 = [
        { bye: 1, matches: [[2, 9], [3, 8], [4, 7], [5, 6]] }, { bye: 6, matches: [[7, 5], [8, 4], [9, 3], [1, 2]] },
        { bye: 2, matches: [[3, 1], [4, 9], [5, 8], [6, 7]] }, { bye: 7, matches: [[8, 6], [9, 5], [1, 4], [2, 3]] },
        { bye: 3, matches: [[4, 2], [5, 1], [6, 9], [7, 8]] }, { bye: 8, matches: [[9, 7], [1, 6], [2, 5], [3, 4]] },
        { bye: 4, matches: [[5, 3], [6, 2], [7, 1], [8, 9]] }, { bye: 9, matches: [[1, 8], [2, 7], [3, 6], [4, 5]] },
        { bye: 5, matches: [[6, 4], [7, 3], [8, 2], [9, 1]] }
      ];

      // Za manje grupe generiramo privremenu listu s BYE igračem
      let list = [...players];
      if (n % 2 !== 0) { list.push('BYE'); }
      const total = list.length;

      if (total === 8) {
        return berger8.map((pairs, ri) => ({
          kolo: ri + 1,
          matches: pairs.map((p, mi) => ({ mec: mi + 1, player1: list[p[0] - 1], player2: list[p[1] - 1] }))
        }));
      }

      if (total === 9 || (n === 9)) {
        return berger9.map((round, ri) => ({
          kolo: ri + 1,
          matches: round.matches.map((p, mi) => ({ mec: mi + 1, player1: players[p[0] - 1], player2: players[p[1] - 1] }))
        }));
      }

      // Generički round-robin za ostale veličine (4, 6, 10, 12...)
      const rounds = [];
      const fixed = list[0];
      const rotating = list.slice(1);
      const numRounds = total - 1;
      const matchesPerRound = total / 2;

      for (let r = 0; r < numRounds; r++) {
        const circle = [fixed, ...rotating];
        const roundMatches = [];
        for (let m = 0; m < matchesPerRound; m++) {
          const p1 = circle[m];
          const p2 = circle[total - 1 - m];
          if (p1 !== 'BYE' && p2 !== 'BYE') {
            roundMatches.push({ mec: roundMatches.length + 1, player1: p1, player2: p2 });
          }
        }
        rounds.push({ kolo: r + 1, matches: roundMatches });
        rotating.unshift(rotating.pop());
      }
      return rounds;
    }

    // loadAvgLige() živi u module <script> bloku niže (treba Firestore importe:
    // db/getDocs/collection/query/orderBy) i izlaže se kao window.loadAvgLige.
    function switchAvgLigeTab(leagueId, btn) {
      activeAvgLigeTab = leagueId;
      document.querySelectorAll('#avg-lige-tabs .player-season-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      window.loadAvgLige(leagueId);
    }
    window.switchAvgLigeTab = switchAvgLigeTab;

    function switchGroupTab(uid, tab, btn) {
      const target = document.getElementById(uid+'-'+tab);
      const other  = tab==='standings'?'raspored':'standings';
      document.getElementById(uid+'-'+other).style.display = 'none';
      target.style.display=''; target.style.animation='none';
      requestAnimationFrame(()=>{ target.style.animation=''; });
      const btns = btn.closest('div').querySelectorAll('.grp-tab-btn');
      btns.forEach(b=>{ b.style.background='rgba(10,19,38,0.78)'; b.style.borderColor='rgba(255,255,255,0.12)'; b.style.color='var(--muted)'; });
      btn.style.background='rgba(21,49,99,1)'; btn.style.borderColor='rgba(255,255,255,0.2)'; btn.style.color='#fff';
    }

    // Klik na ime igrača otvara njegov profil - koristi se u "Najbolji u ligi"
    // tabu (renderNajbolji) i svugdje drugdje gdje se ime igrača prikazuje kao
    // običan tekst umjesto punog mpc-player-col bloka. Nema efekta (obično ime,
    // bez klika) ako igrač iz nekog razloga još nije registriran u playerDatabase.
    function playerNameLinkHtml(name) {
      const safe = escapeHtml(name);
      if (!playerDatabase[name]) return safe;
      const nameJs = safe.replace(/'/g, "\\'");
      return `<span class="player-name-link" onclick="openPlayerProfile('${nameJs}')">${safe}</span>`;
    }

    function renderNajbolji(allPlayersStats) {
      const medal = i => i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}.`;
      const top5avg  = [...allPlayersStats].filter(p=>p.avg!=='--').sort((a,b)=>parseFloat(b.avg)-parseFloat(a.avg)).slice(0,5);
      const top5f9   = [...allPlayersStats].filter(p=>p.f9!=='--').sort((a,b)=>parseFloat(b.f9)-parseFloat(a.f9)).slice(0,5);
      const top5bl   = [...allPlayersStats].filter(p=>p.bl!=='--'&&p.bl>0).sort((a,b)=>a.bl-b.bl).slice(0,5);
      const top5bco  = [...allPlayersStats].filter(p=>p.bco!=='--'&&p.bco>0).sort((a,b)=>b.bco-a.bco).slice(0,5);
      const top5x180 = [...allPlayersStats].filter(p=>p.x180>0).sort((a,b)=>b.x180-a.x180).slice(0,5);
      const rows = Array.from({length:5},(_,i)=>`
        <tr>
          <td style="text-align:left;">${top5avg[i]  ?`${medal(i)} ${playerNameLinkHtml(top5avg[i].name)} - ${top5avg[i].avg}`  :''}</td>
          <td style="text-align:left;">${top5f9[i]   ?`${medal(i)} ${playerNameLinkHtml(top5f9[i].name)} - ${top5f9[i].f9}`    :''}</td>
          <td style="text-align:left;">${top5bl[i]   ?`${medal(i)} ${playerNameLinkHtml(top5bl[i].name)} - ${top5bl[i].bl}`    :''}</td>
          <td style="text-align:left;">${top5bco[i]  ?`${medal(i)} ${playerNameLinkHtml(top5bco[i].name)} - ${top5bco[i].bco}` :''}</td>
          <td style="text-align:left;">${top5x180[i] ?`${medal(i)} ${playerNameLinkHtml(top5x180[i].name)} - ${top5x180[i].x180}`:''}</td>
        </tr>`).join('');
      document.getElementById('najbolji-content').innerHTML = `
        <div class="accordion-item open">
          <div class="accordion-header" style="pointer-events:none;">
            <div class="accordion-title"><span class="accordion-badge">⭐</span><span>Najbolji u ligi</span></div>
          </div>
          <div class="accordion-content" style="max-height:none;">
            <div class="accordion-inner">
              <div class="table-wrap"><table>
                <thead><tr><th>Najveći AVG</th><th>Najveći First 9</th><th>Najbolji Leg</th><th>Najveći CO</th><th>Najviše 180</th></tr></thead>
                <tbody>${rows}</tbody>
                <tfoot><tr><td colspan="5" class="table-footer-brand">Adriatic steel league ™ ®</td></tr></tfoot>
              </table></div>
            </div>
          </div>
        </div>`;
    }

    // -- NAJBOLJI MEČ KOLA --
        function avgSumOf(m) {
          const a1 = parseFloat(m.average1);
          const a2 = parseFloat(m.average2);
          if (isNaN(a1) || isNaN(a2)) return null;
          return a1 + a2;
        }

        function x180SumOf(m) {
          return (parseInt(m['180_1']) || 0) + (parseInt(m['180_2']) || 0);
        }

        function considerBestMatch(bestMatchByKolo, kolo, match, groupName) {
          if (!match.score) return; // samo odigrani mečevi
          const avgSum = avgSumOf(match);
          if (avgSum === null) return; // treba oba prosjeka za usporedbu
          const x180Sum = x180SumOf(match);
          const existing = bestMatchByKolo[kolo];
          const better = !existing
            || avgSum > existing.avgSum
            || (avgSum === existing.avgSum && x180Sum > existing.x180Sum); // tiebreak: više 180-ica

          if (better) {
            bestMatchByKolo[kolo] = { ...match, groupName, avgSum, x180Sum };
          }
        }

        function considerMVP(mvpByKolo, kolo, match) {
            if (!match.score) return;
            const parts = match.score.split('-');
            if (parts.length !== 2) return;
            const s1 = parseInt(parts[0]), s2 = parseInt(parts[1]);
            if (isNaN(s1) || isNaN(s2) || s1 === s2) return; // bez pobjednika nema MVP-a (remi se ne broji)

            const winnerIsP1 = s1 > s2;
            const winnerName = winnerIsP1 ? match.player1 : match.player2;
            const winnerAvg = parseFloat(winnerIsP1 ? match.average1 : match.average2);
            if (isNaN(winnerAvg)) return;

            const existing = mvpByKolo[kolo];
            if (!existing || winnerAvg > existing.avg) {
              mvpByKolo[kolo] = { name: winnerName, avg: winnerAvg };
            }
          }

        function renderBestMatches(bestMatchByKolo, mvpByKolo) {
            const container = document.getElementById('best-matches-content');
            // Grupna kola su brojevi (sortiraju se numerički i prikazuju prva),
            // playoff runde su stringovi poput "Gornji ždrijeb: Osmina finala"
            // (sortiraju se alfabetski i prikazuju iza svih grupnih kola).
            const rawKeys = Object.keys(bestMatchByKolo);
            const numericKeys = rawKeys.filter(k => !isNaN(Number(k))).map(Number).sort((a, b) => a - b);
            const stringKeys  = rawKeys.filter(k => isNaN(Number(k))).sort((a, b) => a.localeCompare(b));
            const kolos = [...numericKeys, ...stringKeys];
            if (!kolos.length) { container.innerHTML = ''; return; }

            const cardsHtml = kolos.map(kolo => {
              const m = bestMatchByKolo[kolo];
              const mvp = mvpByKolo[kolo];
              const mvpHtml = mvp ? `
            <div class="popup-match mvp-card" style="width: 100%;display:flex;align-items:center;justify-content:center;gap:14px;padding:16px 20px;">
              <span style="font-size:1.3rem;">🏆</span>
              <div style="text-align:left;">
                <div style="font-size:0.68rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,0.55);">MVP kola</div>
                <div style="font-size:1.05rem;font-weight:800;color:#fff;">${playerNameLinkHtml(mvp.name)}</div>
              </div>
              <div style="margin-left:auto;text-align:right;">
                <div style="font-size:0.68rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,0.55);">AVG</div>
                <div style="font-size:1.1rem;font-weight:800;color:#7eb8ff;">${mvp.avg.toFixed(2)}</div>
              </div>
            </div>` : '';
            return `<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;">
            <div style="flex:1;min-width:280px;">
              <div class="popup-match" style="margin-bottom:0;">
                <div class="popup-match-num">${typeof kolo === 'number' ? `Kolo ${kolo}` : escapeHtml(kolo)} - ${escapeHtml(m.groupName)}</div>
                <div class="popup-match-top">
                  <span class="popup-player-name">${playerNameLinkHtml(m.player1)}</span>
                  <span class="popup-score">${escapeHtml(m.score)}</span>
                  <span class="popup-player-name right">${playerNameLinkHtml(m.player2)}</span>
                </div>
                <div class="popup-stats">
                  <div class="popup-stat-val-l">${m.average1 ?? '--'}</div><div class="popup-stat-label">AVG</div><div class="popup-stat-val-r">${m.average2 ?? '--'}</div>
                  <div class="popup-stat-val-l">${m.first9_1 ?? '--'}</div><div class="popup-stat-label">First 9</div><div class="popup-stat-val-r">${m.first9_2 ?? '--'}</div>
                  <div class="popup-stat-val-l">${m.bestleg1 ?? '--'}</div><div class="popup-stat-label">Best Leg</div><div class="popup-stat-val-r">${m.bestleg2 ?? '--'}</div>
                  <div class="popup-stat-val-l">${m.bestcheckout1 ?? '--'}</div><div class="popup-stat-label">Best CO</div><div class="popup-stat-val-r">${m.bestcheckout2 ?? '--'}</div>
                  <div class="popup-stat-val-l">${m['180_1'] ?? '--'}</div><div class="popup-stat-label">180s</div><div class="popup-stat-val-r">${m['180_2'] ?? '--'}</div>
                </div>
              </div>
            </div>
            ${mvp ? `<div style="width:100%;display:flex;align-items:center;">${mvpHtml}</div>` : ''}
          </div>`;
          }).join('');

          container.innerHTML = `
          <div class="accordion-item open">
            <div class="accordion-header" style="pointer-events:none;">
              <div class="accordion-title"><span class="accordion-badge">🔥</span><span>Najbolji meč kola</span></div>
            </div>
            <div class="accordion-content" style="max-height:none;">
              <div class="accordion-inner">${cardsHtml}</div>
            </div>
          </div>`;
          }

    // -- PLAYOFF PODACI ZA "NAJBOLJI U LIGI" --
    // Prolazi kroz sve odigrane mečeve iz gornjeg i donjeg ždrijeba, gradi:
    //  - perPlayerStats: isti oblik objekta kao computeStandings() vraća po igraču
    //    (avg/f9/bl/bco/x180), tako da se može spojiti s grupnim allPlayersStats
    //    i ući u iste top 5 liste.
    //  - bestMatchByRound / mvpByRound: ista logika kao considerBestMatch/considerMVP,
    //    samo ključ nije "kolo" nego naziv runde (npr. "Gornji: Osmina finala"),
    //    da se ne pomiješa s grupnim kolima kad se objekti spoje.
    function collectPlayoffStatsAndBestMatch(bracketDataMap, lowerBracketDataMap) {
      // Default na sezona-2 globale radi postojećih poziva (bez argumenata) -
      // ovo drži staro ponašanje netaknutim dok se sezona 3 ne doda posebno.
      bracketDataMap = bracketDataMap || bracketMatchData;
      lowerBracketDataMap = lowerBracketDataMap || lowerBracketMatchData;
      const perPlayer = {}; // name -> {avgSum,avgCount,f9Sum,f9Count,bl,bco,x180}
      const bestMatchByRound = {};
      const mvpByRound = {};

      function ensurePlayer(name) {
        if (!perPlayer[name]) perPlayer[name] = {avgSum:0,avgCount:0,f9Sum:0,f9Count:0,bl:0,bco:0,x180:0};
        return perPlayer[name];
      }

      function processMatch(id, m, bracketLabel) {
        if (!m || !m.score || !m.player1 || !m.player2) return; // samo odigrani, oba igrača poznata
        const roundKey = `${bracketLabel}: ${(m.roundLabel||id).split('-')[0].trim()}`;

        // 0 se tretira kao "nema podatka" (isto kao null) - stvaran AVG/First9
        // od točno 0.00 nije realan, pa bi ušao u prosjek samo greškom.
        if (m.average1) { const s1 = ensurePlayer(m.player1); s1.avgSum += parseFloat(m.average1)||0; s1.avgCount++; }
        if (m.average2) { const s2 = ensurePlayer(m.player2); s2.avgSum += parseFloat(m.average2)||0; s2.avgCount++; }
        if (m.first9_1) { const s1 = ensurePlayer(m.player1); s1.f9Sum += parseFloat(m.first9_1)||0; s1.f9Count++; }
        if (m.first9_2) { const s2 = ensurePlayer(m.player2); s2.f9Sum += parseFloat(m.first9_2)||0; s2.f9Count++; }
        if (m.bestleg1) { const s1 = ensurePlayer(m.player1); s1.bl = s1.bl === 0 ? parseInt(m.bestleg1) : Math.min(s1.bl, parseInt(m.bestleg1)||999); }
        if (m.bestleg2) { const s2 = ensurePlayer(m.player2); s2.bl = s2.bl === 0 ? parseInt(m.bestleg2) : Math.min(s2.bl, parseInt(m.bestleg2)||999); }
        if (m.bestcheckout1) { const s1 = ensurePlayer(m.player1); s1.bco = Math.max(s1.bco, parseInt(m.bestcheckout1)||0); }
        if (m.bestcheckout2) { const s2 = ensurePlayer(m.player2); s2.bco = Math.max(s2.bco, parseInt(m.bestcheckout2)||0); }
        if (m['180_1']) { const s1 = ensurePlayer(m.player1); s1.x180 += parseInt(m['180_1'])||0; }
        if (m['180_2']) { const s2 = ensurePlayer(m.player2); s2.x180 += parseInt(m['180_2'])||0; }

        considerBestMatch(bestMatchByRound, roundKey, m, bracketLabel);
        considerMVP(mvpByRound, roundKey, m);
      }

      Object.entries(bracketDataMap || {}).forEach(([id, m]) => processMatch(id, m, 'Gornji ždrijeb'));
      Object.entries(lowerBracketDataMap || {}).forEach(([id, m]) => processMatch(id, m, 'Donji ždrijeb'));

      const perPlayerStats = Object.entries(perPlayer).map(([name,s]) => ({
        name,
        avg: s.avgCount>0 ? (s.avgSum/s.avgCount).toFixed(2) : '--',
        f9:  s.f9Count>0  ? (s.f9Sum/s.f9Count).toFixed(2)  : '--',
        bl:  s.bl||'--', bco: s.bco||'--', x180: s.x180,
        // avgCount/f9Count čuvamo kao "koliko mečeva ulazi u taj prosjek" -
        // mergePlayerStats() ih koristi za ispravno ponderiranje umjesto da
        // svaki playoff zapis broji kao samo "jedan meč" (total fallback).
        _avgMatchCount: s.avgCount, _f9MatchCount: s.f9Count
      }));

      return { perPlayerStats, bestMatchByRound, mvpByRound };
    }

    // -- FORM (zadnjih 5 mečeva W/L/D) --
    function formFromMatches(matches) {
      return matches.filter(m => m.hasScore).map(m => m.result === 'win' ? 'W' : m.result === 'loss' ? 'L' : 'D').slice(-5);
    }

    function formHtml(form) {
      if (!form || !form.length) return '';
      const labels = { W:'W', L:'L', D:'D' };
      return `<span class="form-badges">${form.map(r =>
        `<span class="form-badge ${r.toLowerCase()}">${labels[r]}</span>`
      ).join('')}</span>`;
    }

    // -- KOLO POPUP MAP --
    const koloDataMap = {};

    // -- PLAYER DATABASE (multi-season ready) --
    // playerDatabase[playerName] = { seasons: { 'sezona-2': { seasonLabel, group, groupName, standings, matches:[...] } } }
    const playerDatabase = {};
    const SEASON_ORDER = ['sezona-1', 'sezona-2', 'sezona-3']; // proširiti kad dođe sezona-4...
    const SEASON_LABELS = { 'sezona-1': 'Sezona 1', 'sezona-2': 'Sezona 2', 'sezona-3': 'Sezona 3' };

    function registerPlayerSeasonData(playerName, seasonId, seasonLabel, group, groupName, standingsRow, matches, playoff = null) {
      if (!playerDatabase[playerName]) playerDatabase[playerName] = { seasons: {} };
      playerDatabase[playerName].seasons[seasonId] = {
        seasonLabel, group, groupName, standings: standingsRow, matches, playoff
      };
    }

    // AVG lige (avg-leagues/{seasonId}/{leagueId}/...) su odvojene od sezona - ne
    // idu u entry.seasons nego u vlastitu granu, da se "Sveukupno"/sezonski tabovi
    // nikad ne pomiješaju s AVG podacima. Ugniježđeno po sezoni pa po ligi (isti
    // raspored kao Firestore putanja), 'kind' grana prikaz:
    //   'live'    - puno praćenje mečeva (trenutna sezona, avg-leagues/{sezona}/{liga}/{groupId})
    //   'history' - samo finalni avg+result, bez mečeva (npr. sezona 2, prije
    //               nego je postojao ovaj sustav; avg-leagues/{sezona}/{liga}/rezultati)
    function ensureAvgBucket(playerName, seasonId, leagueId) {
      if (!playerDatabase[playerName]) playerDatabase[playerName] = { seasons: {} };
      if (!playerDatabase[playerName].avgLeagues) playerDatabase[playerName].avgLeagues = {};
      if (!playerDatabase[playerName].avgLeagues[seasonId]) playerDatabase[playerName].avgLeagues[seasonId] = {};
    }

    function registerAvgPlayerData(playerName, seasonId, leagueId, leagueLabel, groupId, groupName, standingsRow, matches) {
      ensureAvgBucket(playerName, seasonId, leagueId);
      playerDatabase[playerName].avgLeagues[seasonId][leagueId] = {
        kind: 'live', leagueLabel, groupId, groupName, standings: standingsRow, matches
      };
    }

    function registerAvgHistoryData(playerName, seasonId, leagueId, leagueLabel, avg, result) {
      ensureAvgBucket(playerName, seasonId, leagueId);
      playerDatabase[playerName].avgLeagues[seasonId][leagueId] = { kind: 'history', leagueLabel, avg, result };
    }

    function buildPlayerMatches(playerName, players, schedule, matchesMap) {
      const matches = [];
      schedule.forEach(({kolo, matches: kMatches}) => {
        kMatches.forEach(({mec, player1, player2}) => {
          if (player1 !== playerName && player2 !== playerName) return;
          const m = matchesMap[`${kolo}_${mec}`];
          if (!m || !m.score) return; // prikazuju se samo odigrani mečevi
          const isP1 = player1 === playerName;
          const opponent = isP1 ? player2 : player1;

          // Normaliziraj rezultat tako da prvi broj bude rezultat ovog igrača
          const parts = m.score.split('-');
          const selfScore = isP1 ? parts[0] : parts[1];
          const oppScore  = isP1 ? parts[1] : parts[0];
          const score = `${selfScore}-${oppScore}`;
          const s1 = parseInt(selfScore), s2 = parseInt(oppScore);
          let result = 'draw';
          if (!isNaN(s1) && !isNaN(s2)) {
            result = s1 > s2 ? 'win' : s1 < s2 ? 'loss' : 'draw';
          }

          matches.push({
            kolo, opponent, score, hasScore: true, result,
            avgSelf: isP1 ? m.average1 : m.average2,
            avgOpp:  isP1 ? m.average2 : m.average1,
            f9Self:  isP1 ? m.first9_1 : m.first9_2,
            f9Opp:   isP1 ? m.first9_2 : m.first9_1,
            blSelf:  isP1 ? m.bestleg1 : m.bestleg2,
            blOpp:   isP1 ? m.bestleg2 : m.bestleg1,
            bcoSelf: isP1 ? m.bestcheckout1 : m.bestcheckout2,
            bcoOpp:  isP1 ? m.bestcheckout2 : m.bestcheckout1,
            x180Self: isP1 ? m['180_1'] : m['180_2'],
            x180Opp:  isP1 ? m['180_2'] : m['180_1'],
            corateSelf: isP1 ? m.checkoutrate1 : m.checkoutrate2,
            corateOpp:  isP1 ? m.checkoutrate2 : m.checkoutrate1,
            coattSelf: isP1 ? m.checkouts1 : m.checkouts2,
            coattOpp:  isP1 ? m.checkouts2 : m.checkouts1
          });
        });
      });
      matches.sort((a,b) => a.kolo - b.kolo);
      return matches;
    }

    // -- AGGREGATED ("Sveukupno") STATS --
    // Dodaje mečeve (koriste se za playoff, gornji+donji ždrijeb) tog igrača u
    // postojeći agg objekt - koristi je computeStatsWithPlayoffMatches (i
    // sezonski i AVG tab u player profilu prolaze kroz nju).
    function addMatchesToAgg(agg, matches) {
      matches.forEach(m => {
        // 0 se tretira kao "nema podatka" (isto kao null) - stvaran AVG/First9
        // od točno 0.00 nije realan, pa bi ušao u prosjek samo greškom.
        const avgN = parseFloat(m.avgSelf), f9N = parseFloat(m.f9Self);
        if (!isNaN(avgN) && avgN > 0) { agg.avgSum += avgN; agg.avgCount += 1; }
        if (!isNaN(f9N) && f9N > 0)  { agg.f9Sum  += f9N;  agg.f9Count  += 1; }
        const blN = parseInt(m.blSelf), bcoN = parseInt(m.bcoSelf);
        if (!isNaN(blN) && blN > 0) agg.bl = agg.bl === 0 ? blN : Math.min(agg.bl, blN);
        if (!isNaN(bcoN) && bcoN > 0) agg.bco = Math.max(agg.bco, bcoN);
        agg.x180 += parseInt(m.x180Self) || 0;
        agg.total += 1;
        if (m.result === 'win') agg.win += 1;
        else if (m.result === 'loss') agg.lost += 1;
        else if (m.result === 'draw') agg.draw += 1;
      });
    }

    // Grupni standings + playoff mečevi spojeni u jedan stats objekt - koristi
    // ga i sezonski tab (computeSeasonStatsWithPlayoffs) i AVG tab
    // (computeAvgStatsWithPlayoffs) u player profilu.
    function computeStatsWithPlayoffMatches(standingsRow, playoffMatches) {
      const s = standingsRow;
      const agg = {
        win: s.win, draw: s.draw, lost: s.lost, total: s.total,
        legs: s.legs, pts: s.pts, x180: s.x180,
        avgSum: s.avg !== '--' ? parseFloat(s.avg) * s.total : 0,
        avgCount: s.avg !== '--' ? s.total : 0,
        f9Sum: s.f9 !== '--' ? parseFloat(s.f9) * s.total : 0,
        f9Count: s.f9 !== '--' ? s.total : 0,
        bl: (s.bl !== '--' && s.bl) ? s.bl : 0,
        bco: (s.bco !== '--' && s.bco) ? s.bco : 0,
      };
      addMatchesToAgg(agg, playoffMatches);
      return {
        win: agg.win, draw: agg.draw, lost: agg.lost, total: agg.total,
        legs: agg.legs, pts: agg.pts, x180: agg.x180,
        avg: agg.avgCount > 0 ? (agg.avgSum/agg.avgCount).toFixed(2) : '--',
        f9:  agg.f9Count  > 0 ? (agg.f9Sum/agg.f9Count).toFixed(2)  : '--',
        bl:  agg.bl || '--', bco: agg.bco || '--'
      };
    }

    // getPlayoffMatchesForPlayer sam bira live vs. arhivske bracket mape prema
    // seasonId, pa ovdje više nema potrebe za "samo aktivna sezona" ogradom.
    function computeSeasonStatsWithPlayoffs(playerName, seasonId, standingsRow) {
      const playoffMatches = getPlayoffMatchesForPlayer(playerName, seasonId);
      return computeStatsWithPlayoffMatches(standingsRow, playoffMatches);
    }

    // AVG tab u player profilu - playoff dostupan čim avgBracketDataMap[seasonId][leagueId]
    // ima podataka (loadAvgBracket).
    function computeAvgStatsWithPlayoffs(playerName, seasonId, leagueId, standingsRow) {
      return computeStatsWithPlayoffMatches(standingsRow, getAvgPlayoffMatchesForPlayer(playerName, seasonId, leagueId));
    }

    function computeOverallStats(playerName) {
      const entry = playerDatabase[playerName];
      if (!entry) return null;

      // "Sveukupno" = zbroj/min/max/prosjek preko BLOKOVA, gdje je jedan blok
      // = već izračunati stats objekt jednog profil-taba (isti oblik kao
      // computeSeasonStatsWithPlayoffs/computeAvgStatsWithPlayoffs vraćaju):
      //   - svaka sezona (Sezona 1/2/3 tab) = jedan blok
      //   - svaka "live" AVG liga (AVG tab kartica s mečevima) = jedan blok
      // Poziva iste funkcije koje pune pojedinačne tabove (ne re-derivira
      // agregaciju ovdje), da "Sveukupno" nikad ne može odstupiti od zbroja
      // onoga što je stvarno prikazano na tim tabovima.
      const blocks = [];
      SEASON_ORDER.forEach(seasonId => {
        const sd = entry.seasons[seasonId];
        if (!sd) return;
        blocks.push(computeSeasonStatsWithPlayoffs(playerName, seasonId, sd.standings));
      });

      // "history" AVG zapisi (registerAvgHistoryData, arhivski rezultati bez
      // mečeva) nemaju win/draw/lost/total/legs/pts/x180/bl/bco/f9 - Firestore
      // dokument (avg-leagues/{sezona}/{liga}/rezultati) ih genuinely ne sprema.
      // Zato ne postaju puni blok, nego doprinose SAMO prosjeku AVG-a.
      const historyAvgValues = [];
      Object.entries(entry.avgLeagues || {}).forEach(([seasonId, byLeague]) => {
        Object.entries(byLeague).forEach(([leagueId, ad]) => {
          if (ad.kind === 'live') {
            blocks.push(computeAvgStatsWithPlayoffs(playerName, seasonId, leagueId, ad.standings));
          } else if (ad.kind === 'history') {
            const v = parseFloat(ad.avg);
            if (!isNaN(v)) historyAvgValues.push(v);
          }
        });
      });

      // win/draw/lost/total/legs/pts/x180 - pravi zbroj preko svih blokova
      // (sezone + live AVG lige). Playoff je već uključen u svaki blok (obje
      // izvorne funkcije to rade), pa se ovdje ne dodaje ponovno.
      const sums = {win:0, draw:0, lost:0, total:0, legs:0, pts:0, x180:0};
      blocks.forEach(b => {
        sums.win += b.win; sums.draw += b.draw; sums.lost += b.lost; sums.total += b.total;
        sums.legs += b.legs; sums.pts += b.pts; sums.x180 += b.x180;
      });

      // Best leg / best checkout - min/max preko istog seta blokova. Blok bez
      // te vrijednosti ('--', npr. AVG liga koja još nije odigrala meč) se
      // isključuje iz usporedbe, isto kao svugdje drugdje u ovoj datoteci.
      let bl = 0, bco = 0;
      blocks.forEach(b => {
        if (b.bl !== '--') bl = bl === 0 ? b.bl : Math.min(bl, b.bl);
        if (b.bco !== '--') bco = Math.max(bco, b.bco);
      });

      // AVG/First 9 - prost prosjek blokova (svaki blok jednake težine,
      // bez obzira na broj mečeva u njemu - dogovoreno s korisnikom).
      // avgValues uključuje i povijesne AVG zapise (imaju samo avg);
      // f9Values ne, jer povijesni zapisi nemaju First 9 podatak.
      const avgValues = [
        ...blocks.map(b => b.avg).filter(v => v !== '--').map(parseFloat),
        ...historyAvgValues
      ];
      const f9Values = blocks.map(b => b.f9).filter(v => v !== '--').map(parseFloat);

      const avg = avgValues.length ? (avgValues.reduce((a,b) => a+b, 0) / avgValues.length).toFixed(2) : '--';
      const f9  = f9Values.length  ? (f9Values.reduce((a,b) => a+b, 0)  / f9Values.length).toFixed(2)  : '--';

      return {
        win: sums.win, draw: sums.draw, lost: sums.lost, total: sums.total,
        legs: sums.legs, pts: sums.pts, x180: sums.x180,
        avg, f9,
        bl: bl || '--', bco: bco || '--'
      };
    }

    // -- AVG GRAF KROZ KOLA --
    function avgChartHtml(matches, overallAvg, form) {
      const formHtml_ = (form && form.length) ? `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,0.06);">
          <span style="font-size:0.7rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);">Forma (zadnjih ${form.length})</span>
          ${formHtml(form)}
        </div>` : '';

      const MAX_POINTS = 7;
      const points = matches
        .filter(m => m.hasScore && m.avgSelf != null && !isNaN(parseFloat(m.avgSelf)) && parseFloat(m.avgSelf) > 0)
        .map(m => ({ label: m.chartLabel || `K${m.kolo}`, avg: parseFloat(m.avgSelf), season: m._season, result: m.result }))
        .slice(-MAX_POINTS);

      if (points.length < 2) {
        return `<div class="player-avg-chart-wrap">${formHtml_}<div class="player-avg-chart-empty">Nema dovoljno odigranih mečeva za prikaz grafa.</div></div>`;
      }

      const W = 600, H = 180, padL = 34, padR = 14, padT = 16, padB = 26;
      const innerW = W - padL - padR, innerH = H - padT - padB;

      const avgs = points.map(p => p.avg);
      let minAvg = Math.min(...avgs), maxAvg = Math.max(...avgs);
      if (minAvg === maxAvg) { minAvg -= 1; maxAvg += 1; }
      const pad = (maxAvg - minAvg) * 0.18;
      minAvg -= pad; maxAvg += pad;


      const xStep = points.length > 1 ? innerW / (points.length - 1) : 0;
      const xy = points.map((p, i) => ({
        x: padL + i * xStep,
        y: padT + innerH - ((p.avg - minAvg) / (maxAvg - minAvg)) * innerH,
        ...p
      }));

      const linePath = xy.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
      const areaPath = `${linePath} L${xy[xy.length-1].x.toFixed(1)},${(padT+innerH).toFixed(1)} L${xy[0].x.toFixed(1)},${(padT+innerH).toFixed(1)} Z`;

      const gridLines = [0, 0.5, 1].map(t => {
        const y = padT + innerH * t;
        const val = (maxAvg - (maxAvg - minAvg) * t).toFixed(1);
        return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
                <text x="${padL-6}" y="${(y+3).toFixed(1)}" font-size="14" fill="rgba(255,255,255,0.4)" text-anchor="end">${val}</text>`;
      }).join('');

      // Referentna linija: sezonski/overall prosjek AVG-a
      const avgRefNum = parseFloat(overallAvg);
      const avgRefLine = (!isNaN(avgRefNum) && avgRefNum >= minAvg && avgRefNum <= maxAvg) ? (() => {
        const yRef = padT + innerH - ((avgRefNum - minAvg) / (maxAvg - minAvg)) * innerH;
        return `<line x1="${padL}" y1="${yRef.toFixed(1)}" x2="${W-padR}" y2="${yRef.toFixed(1)}" stroke="rgba(255,255,255,0.28)" stroke-width="1" stroke-dasharray="4,4"/>
                <text x="${W-padR}" y="${(yRef-4).toFixed(1)}" font-size="14" fill="rgba(255,255,255,1)" text-anchor="end">AVG ${avgRefNum.toFixed(1)}</text>`;
      })() : '';

      // Max 7 točaka - prikaži sve x-oznake
      const xLabels = xy.map((p,i) =>
        `<text x="${p.x.toFixed(1)}" y="${H-8}" font-size="14" fill="rgba(255,255,255,0.4)" text-anchor="middle">${escapeHtml(p.label)}</text>`
      ).join('');

      const dotColor = r => r === 'win' ? '#2ecc71' : r === 'loss' ? '#e74c3c' : r === 'draw' ? '#f39c12' : '#7eb8ff';
      const dots = xy.map(p =>
        `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="${dotColor(p.result)}" stroke="#0d1426" stroke-width="1.5">
           <title>${escapeHtml(p.label)}: ${p.avg.toFixed(2)}</title>
         </circle>`
      ).join('');

      const lastAvg = xy[xy.length-1].avg.toFixed(2);
      const firstAvg = xy[0].avg.toFixed(2);
      const trendUp = xy[xy.length-1].avg >= xy[0].avg;

      return `<div class="player-avg-chart-wrap">
        ${formHtml_}
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <span style="font-size:0.7rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);">AVG kroz kola</span>
          <span style="font-size:0.75rem;font-weight:700;color:${trendUp?'#2ecc71':'#e74c3c'};">${firstAvg} → ${lastAvg}</span>
        </div>
        <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="avgFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#7eb8ff" stop-opacity="0.32"/>
              <stop offset="100%" stop-color="#7eb8ff" stop-opacity="0"/>
            </linearGradient>
            <filter id="avgGlow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="2.5" result="blur"/>
              <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          ${gridLines}
          <path d="${areaPath}" fill="url(#avgFill)"/>
          <path d="${linePath}" fill="none" stroke="#7eb8ff" stroke-width="2" filter="url(#avgGlow)"/>
          ${dots}
          ${xLabels}
          ${avgRefLine}
        </svg>
      </div>`;
    }

    // -- PLAYOFF MEČEVI IGRAČA --
    // Zajednička ekstrakcija iz proizvoljne bracket data mape (matchId -> data) -
    // koristi je i sezonski ždrijeb (gornji+donji) i AVG ždrijeb (jedan, po ligi).
    function collectMatchesFromBracketData(dataMap, bracketLabel, playerName) {
      const result = [];
      Object.entries(dataMap || {}).forEach(([id, d]) => {
        if (!d || !d.score) return; // samo odigrani
        const isP1 = d.player1 === playerName;
        const isP2 = d.player2 === playerName;
        if (!isP1 && !isP2) return;
        const opponent = isP1 ? d.player2 : d.player1;
        const parts = String(d.score).split('-');
        const selfScore = isP1 ? parts[0] : parts[1];
        const oppScore  = isP1 ? parts[1] : parts[0];
        const score = `${selfScore}-${oppScore}`;
        const s1 = parseInt(selfScore), s2 = parseInt(oppScore);
        let result_ = 'draw';
        if (!isNaN(s1) && !isNaN(s2)) result_ = s1 > s2 ? 'win' : s1 < s2 ? 'loss' : 'draw';
        result.push({
          id, bracketLabel, roundLabel: d.roundLabel || '',
          opponent, score, hasScore: true, result: result_,
          avgSelf: isP1 ? d.average1 : d.average2,
          avgOpp:  isP1 ? d.average2 : d.average1,
          f9Self:  isP1 ? d.first9_1 : d.first9_2,
          f9Opp:   isP1 ? d.first9_2 : d.first9_1,
          blSelf:  isP1 ? d.bestleg1 : d.bestleg2,
          blOpp:   isP1 ? d.bestleg2 : d.bestleg1,
          bcoSelf: isP1 ? d.bestcheckout1 : d.bestcheckout2,
          bcoOpp:  isP1 ? d.bestcheckout2 : d.bestcheckout1,
          x180Self: isP1 ? d['180_1'] : d['180_2'],
          x180Opp:  isP1 ? d['180_2'] : d['180_1'],
          corateSelf: isP1 ? d.checkoutrate1 : d.checkoutrate2,
          corateOpp:  isP1 ? d.checkoutrate2 : d.checkoutrate1,
          coattSelf: isP1 ? d.checkouts1 : d.checkouts2,
          coattOpp:  isP1 ? d.checkouts2 : d.checkouts1
        });
      });
      return result;
    }

    // Sezonski playoff (gornji + donji ždrijeb) - za AKTIVNU sezonu čita se iz
    // live bracketMatchData/lowerBracketMatchData mapa (pune se dok se gradi
    // ŽDRIJEB prikaz), za ARHIVSKE sezone iz archiveBracketMatchData[seasonId]/
    // archiveLowerBracketMatchData[seasonId] (pune se u ensureArchiveBracketBuilt/
    // ensureArchiveLowerBracketBuilt, eager pozvano iz loadArchiveSeason).
    function getPlayoffMatchesForPlayer(playerName, seasonId) {
      const targetSeason = seasonId || window.ACTIVE_SEASON_ID;
      const isActiveSeason = targetSeason === (window.ACTIVE_SEASON_ID || 'sezona-2');
      const upperData = isActiveSeason ? bracketMatchData : (archiveBracketMatchData[targetSeason] || {});
      const lowerData = isActiveSeason ? lowerBracketMatchData : (archiveLowerBracketMatchData[targetSeason] || {});
      return [
        ...collectMatchesFromBracketData(upperData, 'Gornji ždrijeb', playerName),
        ...collectMatchesFromBracketData(lowerData, 'Donji ždrijeb', playerName)
      ];
    }

    // AVG playoff - jedan zajednički ždrijeb po ligi (ne gornji/donji, ne fiksni
    // R64 kao sezona), avgBracketDataMap[seasonId][leagueId] se puni u
    // loadAvgBracket (module blok, jedan dokument s mapom mečeva). Prazno dok
    // taj dokument ne postoji - vraća [].
    function getAvgPlayoffMatchesForPlayer(playerName, seasonId, leagueId) {
      return collectMatchesFromBracketData((avgBracketDataMap[seasonId]||{})[leagueId], 'Playoff', playerName);
    }
