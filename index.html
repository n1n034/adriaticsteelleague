    // Zajednička "stat-boxevi + graf + forma + lista mečeva + playoff" sekcija -
    // koristi je i sezonski/Sveukupno prikaz i AVG tab. AVG tab je može pozvati
    // više puta (jednom po ligi, ako igrač igra više AVG liga odjednom), zato
    // idxRef (dijeljeni brojač {value:N}) umjesto lokalnog indeksa - drži
    // player-match-detail-N/playoff-match-detail-N id-jeve jedinstvenima kad se
    // više sekcija renderira u istom popupu.
    function buildProfileSectionHtml(stats, matches, playoffMatches, playoffNote, idxRef) {
      const roundShortLabel = (roundLabel) => {
        const base = (roundLabel || '').split('-')[0].trim();
        const map = {
          'Last of 64': 'L64', 'Donji Last of 64': 'L64',
          'Last of 32': 'L32', 'Donji Last of 32': 'L32',
          'Osmina finala': 'OF', 'Donja Osmina finala': 'OF',
          'Četvrtfinale': 'ČF', 'Donje Četvrtfinale': 'ČF',
          'Polufinale': 'PF', 'Donje Polufinale': 'PF',
          'Finale': 'F', 'Donje Finale': 'F',
          'Utakmica za 3. mjesto': '3.mj', 'Donja utakmica za 3. mjesto': '3.mj'
        };
        return map[base] || base || 'PO';
      };

      const playoffTextHtml = playoffNote
        ? `<div style="background:rgba(6,12,24,0.6);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:12px 14px;margin-bottom:10px;">
             <p style="font-size:0.9rem;color:#edf3ff;line-height:1.6;margin:0;">${escapeHtml(playoffNote)}</p>
           </div>`
        : '';
      const playoffMatchesHtml = playoffMatches.length
        ? playoffMatches.map(m => playoffMatchRow(m, idxRef.value++)).join('')
        : '';
      const playoffHtml = (playoffTextHtml || playoffMatchesHtml)
        ? `<div class="player-matches-title" style="margin-top:16px;">Playoff</div>${playoffTextHtml}${playoffMatchesHtml}`
        : '';

      // Za graf: regularni mečevi (kronološki) + playoff mečevi nakon njih (grupna faza pa ždrijeb),
      // uvijek prikazuje zadnjih 7 - avgChartHtml sam reže na zadnjih MAX_POINTS.
      const matchesForChart = [
        ...matches.map(m => ({ ...m, chartLabel: `K${m.kolo}` })),
        ...playoffMatches.map(m => ({ ...m, chartLabel: roundShortLabel(m.roundLabel) }))
      ];
      const form = formFromMatches(matchesForChart);
      const chartHtml = avgChartHtml(matchesForChart, stats.avg, form);

      const matchesHtml = matches.length
        ? `<div class="player-matches-title">Mečevi</div>${matches.map(m => matchRow(m, idxRef.value++)).join('')}`
        : '';

      return `${statBoxes(stats)}${chartHtml}${matchesHtml}${playoffHtml}`;
    }

    function renderPlayerProfile() {
      const entry = playerDatabase[currentProfilePlayer];
      if (!entry) return;

      const availableSeasons = SEASON_ORDER.filter(s => entry.seasons[s]);
      const availableAvgSeasons = SEASON_ORDER.filter(s => entry.avgLeagues?.[s]);
      const latestSeason = availableSeasons[availableSeasons.length-1];
      const groupLabel = latestSeason ? entry.seasons[latestSeason].groupName : '';

      const tabsHtml = `
        <div class="player-season-tabs">
          <button class="player-season-tab ${currentProfileSeason==='overall'?'active':''}" onclick="switchProfileSeason('overall')">Sveukupno</button>
          ${availableSeasons.map(s => `<button class="player-season-tab ${currentProfileSeason===s?'active':''}" onclick="switchProfileSeason('${s}')">${SEASON_LABELS[s]||s}</button>`).join('')}
          ${availableAvgSeasons.length ? `<button class="player-season-tab ${currentProfileSeason==='avg'?'active':''}" onclick="switchProfileSeason('avg')">AVG</button>` : ''}
        </div>`;

      const idxRef = { value: 0 };
      let contentHtml;

      if (currentProfileSeason === 'avg') {
        // Svaka AVG liga/sezona u kojoj igrač igra dobiva vlastitu sekciju
        // (naslov liga+sezona, pa 'kind' grana prikaz - live: puni stat/graf/
        // mečevi/playoff blok kao sezonski tab; history: kompaktna kartica bez
        // mečeva, vidi avgHistoryCardHtml). Sortirano po SEASON_ORDER.
        contentHtml = availableAvgSeasons.map(seasonId => {
          const byLeague = entry.avgLeagues[seasonId];
          return Object.keys(byLeague).map(leagueId => {
            const ad = byLeague[leagueId];
            if (ad.kind === 'history') {
              return avgHistoryCardHtml(ad.leagueLabel, SEASON_LABELS[seasonId] || seasonId, ad.avg, ad.result);
            }
            const stats = computeAvgStatsWithPlayoffs(currentProfilePlayer, seasonId, leagueId, ad.standings);
            const matches = ad.matches.map(m => ({...m, _season: `avg:${seasonId}:${leagueId}`}));
            const playoffMatches = getAvgPlayoffMatchesForPlayer(currentProfilePlayer, seasonId, leagueId).map(m => ({...m, _season: `avg:${seasonId}:${leagueId}`}));
            const leagueHeader = `<div class="player-profile-group" style="margin:14px 0 10px;font-size:0.95rem;">${escapeHtml(ad.leagueLabel)} - ${escapeHtml(SEASON_LABELS[seasonId] || seasonId)} - ${escapeHtml(ad.groupName)}</div>`;
            return leagueHeader + buildProfileSectionHtml(stats, matches, playoffMatches, null, idxRef);
          }).join('');
        }).join('');
      } else {
        let stats, matches;
        if (currentProfileSeason === 'overall') {
          stats = computeOverallStats(currentProfilePlayer);
          matches = [];
          availableSeasons.forEach(s => matches.push(...entry.seasons[s].matches.map(m => ({...m, _season: s}))));
          matches.sort((a,b) => SEASON_ORDER.indexOf(a._season) - SEASON_ORDER.indexOf(b._season) || a.kolo - b.kolo);
        } else {
          const sd = entry.seasons[currentProfileSeason];
          stats = computeSeasonStatsWithPlayoffs(currentProfilePlayer, currentProfileSeason, sd.standings);
          matches = sd.matches.map(m => ({...m, _season: currentProfileSeason}));
        }

        const sd = currentProfileSeason !== 'overall' ? entry.seasons[currentProfileSeason] : null;
        const playoffNote = sd?.playoff || null;

        // Playoff mečevi iz ždrijeba - za "Sveukupno" spoji playoff iz SVIH
        // sezona koje ih imaju, za pojedinačni sezonski tab samo te sezone
        // (getPlayoffMatchesForPlayer sam bira live vs. arhivsku bracket mapu).
        const playoffMatches = currentProfileSeason === 'overall'
          ? availableSeasons.flatMap(s => getPlayoffMatchesForPlayer(currentProfilePlayer, s).map(m => ({...m, _season: s})))
          : getPlayoffMatchesForPlayer(currentProfilePlayer, currentProfileSeason).map(m => ({...m, _season: currentProfileSeason}));

        contentHtml = buildProfileSectionHtml(stats, matches, playoffMatches, playoffNote, idxRef);
      }

      // Fixed close X (popup-fixed-close-btn) već pokriva "zatvori sve" za svaki
      // popup, uklj. ovaj - drugi X ovdje bi bio duplikat. Jedina iznimka je
      // dolazak s "Zadnji mečevi" (recentMatchesBackIndex postavljen), gdje ovaj
      // gumb postaje "Natrag" umjesto X, i vraća na taj popup umjesto da zatvara sve.
      const backOrCloseHtml = recentMatchesBackIndex != null ? `
          <div>
            <button class="popup-back-btn" onclick="backToRecentMatchesFromProfile()">
              <i class="fas fa-arrow-left"></i> Natrag
            </button>
          </div>` : '';

      const body = `
        <div class="player-profile-header">
          <div class="player-profile-user">
            <div class="player-avatar-wrap" onclick="triggerAvatarUpload('${escapeHtml(currentProfilePlayer).replace(/'/g,"\\'")}')" title="Klikni za promjenu slike">
              <div class="player-avatar">${
                window.playerPhotos?.[slugify(currentProfilePlayer)]
                  ? `<img src="${escapeHtml(window.playerPhotos[slugify(currentProfilePlayer)])}" alt="">`
                  : escapeHtml(getInitials(currentProfilePlayer))
              }</div>
              <div class="player-avatar-camera"><i class="fas fa-camera"></i></div>
            </div>
            <div class="player-profile-info">
              <div class="player-profile-name">${escapeHtml(currentProfilePlayer)}</div>
              <div class="player-profile-group">${escapeHtml(groupLabel)}</div>
            </div>
          </div>
          ${backOrCloseHtml}
        </div>
        ${tabsHtml}
        ${contentHtml}`;

      showPopup('', body, '');
    }

    // highlightMec - opcionalno, kad se popup otvara izravno na jedan meč (npr.
    // klik na "Zadnji mečevi" karticu) - nakon rendera se skrola/istakne baš
    // taj meč unutar liste svih mečeva tog kola, umjesto da se ostavi da ga
    // korisnik sam traži.
    function openKoloPopup(groupIndex, kolo, highlightMec) {
      const data = koloDataMap[`${groupIndex}_${kolo}`];
      if (!data) return;
      const {matches, matchesMap, bye} = data;
      const byeHtml = bye ? `<div style="font-size:0.8rem;color:var(--muted);margin-bottom:12px;">BYE: ${escapeHtml(bye)}</div>` : '';
      const legs = getGroupPhaseLegs(false);
      const matchesHtml = matches.map(({mec,player1,player2}) => {
        const saved = matchesMap[`${kolo}_${mec}`] || {};
        return renderMatchPopupCard({
          titleLabel: `Meč ${mec}`,
          legs,
          matchTimestamp: saved.timestamp || null,
          p1: player1, p2: player2, d: saved, seasonId: window.ACTIVE_SEASON_ID,
          domId: `popup-match-${groupIndex}-${kolo}-${mec}`
        });
      }).join('');
      showPopup(`Kolo ${kolo}`, matchesHtml, byeHtml);
      if (highlightMec != null) scrollToPopupMatch(`popup-match-${groupIndex}-${kolo}-${highlightMec}`);
    }

    // -- PAIR OFFSET (za connector linije) --
    // Nakon rendera, izmjeri stvarni pixel-razmak između centra svakog
    // "pair-top" meča i njegovog partnera "pair-bottom" unutar iste kolone,
    // i postavi ga kao CSS varijablu --pair-offset na oba elementa.
    // Layout (space-around) ostaje potpuno netaknut - ovo samo čita pozicije.
    function setPairOffsets(wrapId) {
      const wrap = document.getElementById(wrapId);
      if (!wrap) return;

      // FAZA 1 - READ: pročitaj sve offsetTop vrijednosti prije bilo kakvog upisa,
      // da se izbjegne layout thrashing (browser bi inače morao reflow-ati
      // nakon svakog pojedinačnog write-a prije sljedećeg read-a).
      const pairs = [];
      wrap.querySelectorAll('.bracket-round').forEach(round => {
        const matches = round.querySelectorAll(':scope > .bracket-matches > .bracket-match');
        for (let i = 0; i < matches.length; i += 2) {
          const top = matches[i];
          const bottom = matches[i+1];
          if (!top || !bottom) continue;
          pairs.push({ top, bottom, offset: bottom.offsetTop - top.offsetTop });
        }
      });

      // FAZA 2 - WRITE: sad kad su sva čitanja gotova, upiši sve CSS varijable odjednom.
      pairs.forEach(({ top, bottom, offset }) => {
        top.style.setProperty('--pair-offset', offset + 'px');
        bottom.style.setProperty('--pair-offset', offset + 'px');
      });
    }

    // Pokreni mjerenje tek kad je layout stvarno stabilan: nakon fontova,
    // slika, i dva animacijska framea (da flex/space-around završi).
    const BRACKET_WRAP_IDS = ['bracket-wrap-upper', 'bracket-wrap-lower', 'archive-bracket-wrap-upper', 'archive-bracket-wrap-lower'];

    function scheduleAllPairOffsets() {
      const run = () => {
        requestAnimationFrame(() => requestAnimationFrame(() => {
          BRACKET_WRAP_IDS.forEach(id => { if (document.getElementById(id)) setPairOffsets(id); });
        }));
      };
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(run);
      } else {
        run();
      }
    }

    // ResizeObserver hvata SVE promjene veličine (resize prozora, otvaranje
    // accordiona, zoom, orijentacija na mobitelu) - ne samo window resize.
    let pairOffsetDebounce = null;
    function debouncedRecalc() {
      clearTimeout(pairOffsetDebounce);
      pairOffsetDebounce = setTimeout(() => {
        BRACKET_WRAP_IDS.forEach(id => { if (document.getElementById(id)) setPairOffsets(id); });
      }, 100);
    }

    if (window.ResizeObserver) {
      const bracketResizeObserver = new ResizeObserver(debouncedRecalc);
      // Promatra oba wrapa čim postoje u DOM-u (pozivamo i nakon svakog rendera ispod)
      window.__observeBracketWrap = (id) => {
        const el = document.getElementById(id);
        if (el) bracketResizeObserver.observe(el);
      };
    } else {
      window.addEventListener('resize', debouncedRecalc);
      window.__observeBracketWrap = () => {};
    }

    // -- BRACKET CONFIG HELPERI (Best of X legs) --
    // window.bracketConfig se puni u modul bloku (loadBracketConfig, poziva
    // se iz bootstrap prije svake interakcije). Funkcije žive ovdje, u istom
    // non-module scriptu kao popup funkcije koje ih pozivaju - nema window.*
    // exposure koraka koji bi mogao izostati ako modul blok negdje pukne.
    function getGroupPhaseLegs(isAvg = false) {
      return isAvg ? window.bracketConfig?.avgLegs : window.bracketConfig?.seasonLegs;
    }

    // matchId npr. "R64_3", "QF_1", "LQF_3", "THIRD_1", "LTHIRD_1" -> round key "R64"/"QF"/"THIRD"
    function roundKeyFromMatchId(matchId) {
      const withoutIndex = matchId.replace(/_\d+$/, '');
      return withoutIndex.startsWith('L') ? withoutIndex.slice(1) : withoutIndex;
    }

    function getPlayoffLegs(matchId, isAvg = false) {
      const round = roundKeyFromMatchId(matchId);
      const rounds = isAvg ? window.bracketConfig?.avgPlayoff?.rounds : window.bracketConfig?.playoff?.rounds;
      return rounds?.[round]?.legs;
    }

    // -- BRACKET POPUP --
    const bracketMatchData = {};

    function openBracketMatchPopup(matchId) {
      const d = bracketMatchData[matchId];
      if (!d) return;
      const p1 = d.player1||'TBD'; const p2 = d.player2||'TBD';
      const legs = getPlayoffLegs(matchId, false);
      const body = renderMatchPopupCard({
        titleLabel: d.roundLabel || '',
        legs,
        matchTimestamp: d.timestamp || null,
        p1, p2, d, seasonId: window.ACTIVE_SEASON_ID
      });
      showPopup('', body, '');
    }

    // -- v5 MATCH POPUP CARD (zajednička helper funkcija) --
    // Koristi je openKoloPopup, openArchiveKoloPopup, openBracketMatchPopup i
    // openLowerBracketMatchPopup. Prima:
    //   titleLabel   - tekst u plavoj traci (npr. "Kolo 3" ili "Last of 64 - Meč 5")
    //   legs         - broj legova (Best of X) ili undefined/null (label se ne prikaže)
    //   matchTimestamp - Date objekt ili null (ispisuje se ispod "Best of X legs")
    //   p1, p2       - imena igrača
    //   d            - objekt s podatcima meča (score, average1/2, itd.)
    //   seasonId     - sezona kojoj meč pripada (za +/- diff vs sezonski prosjek u statDiffHtml)
    //   domId        - opcionalni id na wrapper divu, za scrollIntoView/highlight kad se
    //                  na ovaj meč dolazi izravno (npr. iz "Zadnji mečevi" na naslovnici)
    //   fromRecentMatchIndex - opcionalno, samo kad kartu gradi openRecentMatchesPopup:
    //                  index tog meča u currentRecentItems. Prosljeđuje se u klik na
    //                  igrača (openPlayerProfile) da profil zna prikazati "Natrag" umjesto
    //                  X i vratiti se baš na ovaj meč u "Zadnji mečevi" popupu.
    function renderMatchPopupCard({ titleLabel, legs, matchTimestamp, p1, p2, d, seasonId, domId, fromRecentMatchIndex }) {
      const score = d?.score || '';
      const hasScore = !!score;
      const scoreParts = hasScore ? score.split('-') : ['', ''];
      const s1 = parseInt(scoreParts[0]); const s2 = parseInt(scoreParts[1]);
      const p1Winner = hasScore && !isNaN(s1) && !isNaN(s2) && s1 > s2;
      const p2Winner = hasScore && !isNaN(s1) && !isNaN(s2) && s2 > s1;

      const initials = (name) => (name || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
      // Isti princip kao player profile avatar - stvarna slika (players/{slug}.photoURL)
      // umjesto inicijala, kad postoji.
      const avatarHtml = (name) => {
        const url = name && window.playerPhotos?.[slugify(name)];
        return url ? `<img src="${escapeHtml(url)}" alt="">` : escapeHtml(initials(name));
      };

      const titlebarHtml = titleLabel ? `<div class="mpc-titlebar"><span class="mpc-titlebar-text">${escapeHtml(titleLabel)}</span></div>` : '';

      const legsHtml = legs ? `
        <div class="mpc-legs-block">
          <div class="mpc-legs-title">Best of ${legs} legs</div>
          ${matchTimestamp ? `<div class="mpc-legs-timestamp">${formatMatchTimestamp(matchTimestamp)}</div>` : ''}
        </div>` : '';

      const playerColHtml = (name, isLoser, isWinner) => {
        const clickable = name && name !== 'TBD' && playerDatabase[name];
        const nameJs = escapeHtml(name || '').replace(/'/g, "\\'");
        const profileCallJs = fromRecentMatchIndex != null
          ? `openPlayerProfile('${nameJs}', ${fromRecentMatchIndex})`
          : `openPlayerProfile('${nameJs}')`;
        return `
          <div class="mpc-player-col ${isLoser ? 'loser' : ''} ${clickable ? 'clickable' : ''}" ${clickable ? `onclick="${profileCallJs}"` : ''}>
            <div class="mpc-avatar">${avatarHtml(name)}</div>
            <div class="mpc-player-name">${escapeHtml(name)}</div>
            <div class="mpc-winner-tag">${isWinner ? '<i class="fas fa-trophy"></i> pobjeda' : ''}</div>
          </div>`;
      };

      const playersHtml = `
        <div class="mpc-players">
          ${playerColHtml(p1, hasScore && p2Winner, p1Winner)}
          <div class="mpc-score">${hasScore ? `${escapeHtml(scoreParts[0])}<span class="mpc-score-sep">:</span>${escapeHtml(scoreParts[1])}` : '<span style="color:rgba(255,255,255,0.2);">- : -</span>'}</div>
          ${playerColHtml(p2, hasScore && p1Winner, p2Winner)}
        </div>`;

      const domIdAttr = domId ? ` id="${domId}"` : '';

      if (!hasScore) {
        return `<div class="popup-match"${domIdAttr}>${titlebarHtml}${legsHtml}${playersHtml}<div class="popup-no-score">Meč još nije odigran</div></div>`;
      }

      // Osnovni statovi (uvijek prikazani ako postoji rezultat)
      const statsHtml = renderMpcStatsHtml(d, p1Winner, p2Winner, p1, p2, seasonId);

      return `<div class="popup-match"${domIdAttr}>${titlebarHtml}${legsHtml}${playersHtml}${statsHtml}</div>`;
    }

    // Vraća "+2.34" (zeleno) ili "-1.10" (crveno) usporedbom meč-statistike
    // (AVG ili First 9) s igračevim sezonskim prosjekom TE sezone
    // (window.playerSeasonAvgMap[seasonId][playerName][statKey], punjen u
    // setLeagueStatsForSeason za svaku sezonu posebno - ne samo aktivnu).
    // statKey je 'avg' ili 'f9'. Vraća '' ako podatak nedostaje ili se ne
    // može parsirati (uklj. kad seasonId nije poznat, npr. AVG lige mečevi) -
    // bez fallback vrijednosti.
    function statDiffHtml(matchVal, playerName, statKey, seasonId) {
      if (matchVal == null || !playerName) return '';
      const seasonStats = window.playerSeasonAvgMap?.[seasonId]?.[playerName];
      const seasonVal = seasonStats?.[statKey];
      if (seasonVal == null || seasonVal === '--') return '';
      const mv = parseFloat(matchVal), sv = parseFloat(seasonVal);
      if (isNaN(mv) || isNaN(sv)) return '';
      const diff = mv - sv;
      if (diff === 0) return '';
      const sign = diff > 0 ? '+' : '';
      const color = diff > 0 ? 'var(--pos, #2ecc71)' : '#e74c3c';
      return `<div class="mpc-stat-box-diff" style="color:${color};">${sign}${diff.toFixed(2)}</div>`;
    }

    // Zajednički "tri kolone" stats blok (koristi ga i renderMatchPopupCard i
    // player profil matchRow expand sekcija). d mora imati average1/2,
    // first9_1/2, itd. u "player1/player2" konvenciji. p1/p2 (imena) su
    // opcionalni - ako nedostaju, AVG/First9 razlika se jednostavno ne prikazuje.
    function renderMpcStatsHtml(d, p1Winner, p2Winner, p1, p2, seasonId) {
      const statRows = [
        ['AVG', d.average1, d.average2, null, null, 'avg'],
        ['First 9', d.first9_1, d.first9_2, null, null, 'f9'],
      ];

      // CO rate % - prikazuje se samo ako podatak postoji za barem jednog igrača
      if (d.checkoutrate1 != null || d.checkoutrate2 != null) {
        statRows.push([
          'CO rate %',
          d.checkoutrate1 != null ? `${d.checkoutrate1}%` : null,
          d.checkoutrate2 != null ? `${d.checkoutrate2}%` : null,
          d.checkouts1, d.checkouts2
        ]);
      }

      statRows.push(
        ['Best CO', d.bestcheckout1, d.bestcheckout2],
        ['Best Leg', d.bestleg1, d.bestleg2],
        ['180s', d['180_1'], d['180_2']],
      );

      const renderStatRow = ([label, v1, v2, sub1, sub2, diffKey]) => `
        <div class="mpc-stat-row">
          <div class="mpc-stat-box ${p2Winner ? 'loser' : ''}">
            <div class="mpc-stat-box-val">${v1 ?? '--'}</div>
            ${sub1 ? `<div class="mpc-stat-box-sub">${escapeHtml(sub1)}</div>` : ''}
            ${diffKey ? statDiffHtml(v1, p1, diffKey, seasonId) : ''}
          </div>
          <div class="mpc-stat-mid"><span class="mpc-stat-mid-label">${label}</span></div>
          <div class="mpc-stat-box ${p1Winner ? 'loser' : ''}">
            <div class="mpc-stat-box-val">${v2 ?? '--'}</div>
            ${sub2 ? `<div class="mpc-stat-box-sub">${escapeHtml(sub2)}</div>` : ''}
            ${diffKey ? statDiffHtml(v2, p2, diffKey, seasonId) : ''}
          </div>
        </div>`;

      return `<div class="mpc-stats">${statRows.map(renderStatRow).join('')}</div>`;
    }

    function formatMatchTimestamp(ts) {
      try {
        const dt = ts?.toDate ? ts.toDate() : (ts instanceof Date ? ts : new Date(ts));
        if (isNaN(dt.getTime())) return '';
        return dt.toLocaleDateString('hr-HR', { day: 'numeric', month: 'short', year: 'numeric' }) +
          ', ' + dt.toLocaleTimeString('hr-HR', { hour: '2-digit', minute: '2-digit' });
      } catch { return ''; }
    }

    function showPopup(title, bodyHtml, extraHtml) {
      document.getElementById('match-popup-content').innerHTML = `${extraHtml}${bodyHtml}`;
      document.getElementById('match-popup-overlay').style.display = 'flex';
      document.getElementById('popup-fixed-close-btn').style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    // Skrola na konkretan .popup-match unutar upravo otvorenog popupa (koji
    // može sadržavati više mečeva jednog kola) i kratko ga istakne pulsom -
    // koristi ga openKoloPopup/openArchiveKoloPopup kad se stiže izravno na
    // jedan meč (npr. "Zadnji mečevi" na naslovnici), a taj meč nije nužno
    // prvi/vidljiv u popupu.
    function scrollToPopupMatch(domId) {
      if (!domId) return;
      requestAnimationFrame(() => {
        const el = document.getElementById(domId);
        if (!el) return;
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.classList.add('highlight-target');
        setTimeout(() => el.classList.remove('highlight-target'), 2400);
      });
    }

    function closePopup(e) {
      if (e && e.target !== document.getElementById('match-popup-overlay')) return;
      document.getElementById('match-popup-overlay').style.display = 'none';
      document.getElementById('popup-fixed-close-btn').style.display = 'none';
      document.body.style.overflow = '';
    }

    document.addEventListener('keydown', e => {
      if (e.key==='Escape') {
        document.getElementById('match-popup-overlay').style.display='none';
        document.getElementById('popup-fixed-close-btn').style.display='none';
        document.body.style.overflow='';
      }
    });

    // Mapa groupIndex -> funkcija koja gradi (standingsHtml, rasporedHtml) na zahtjev.
    // Sadržaj svake grupe (standings tablica + raspored kartice po kolu) je relativno
    // skup za izgraditi/layoutirati (posebno raspored s puno ugniježđenih kartica),
    // pa se ne generira za svih 8 grupa odmah - samo kad korisnik otvori tu grupu.
    const groupContentBuilders = {};
    const groupContentBuilt = {};

    // highlightMec - vidi komentar na openKoloPopup (isti obrazac).
    function openArchiveKoloPopup(uid, kolo, highlightMec) {
      const data = archiveKoloDataMap[`${uid}_${kolo}`];
      if (!data) return;
      const {matches, matchesMap, bye} = data;
      // uid je 'arch-{seasonId}-{i}' (TABLICE arhiva) ili 'avg-{leagueId}-{i}'
      // (AVG lige, dijeli isti accordion/popup kod, uvijek trenutna ACTIVE_SEASON_ID

      // playerSeasonAvgMap ključ 'avg:{seasonId}:{leagueId}' (vidi fetchAvgLeagueData),
      // tako da +/- diff radi identično za oba slučaja.
      const seasonMatch = uid.match(/^arch-(.+)-\d+$/);
      const avgMatch = uid.match(/^avg-(.+)-\d+$/);
      const seasonId = seasonMatch ? seasonMatch[1] : (avgMatch ? `avg:${window.ACTIVE_SEASON_ID}:${avgMatch[1]}` : null);

    // -- BRACKET RENDER --
    // R64 fixed draw - 32 matches
    const R64_DRAW = [
      {p1:'1A',p2:'4P'},{p1:'2N',p2:'3C'},{p1:'1O',p2:'4B'},{p1:'2D',p2:'3M'},
      {p1:'1G',p2:'4J'},{p1:'2L',p2:'3E'},{p1:'1I',p2:'4H'},{p1:'2F',p2:'3K'},
      {p1:'1C',p2:'4N'},{p1:'2P',p2:'3A'},{p1:'1M',p2:'4D'},{p1:'2B',p2:'3O'},
      {p1:'1E',p2:'4L'},{p1:'2J',p2:'3G'},{p1:'1K',p2:'4F'},{p1:'2H',p2:'3I'},
      {p1:'1B',p2:'4O'},{p1:'2M',p2:'3D'},{p1:'1P',p2:'4A'},{p1:'2C',p2:'3N'},
      {p1:'1H',p2:'4I'},{p1:'2K',p2:'3F'},{p1:'1J',p2:'4G'},{p1:'2E',p2:'3L'},
      {p1:'1D',p2:'4M'},{p1:'2O',p2:'3B'},{p1:'1N',p2:'4C'},{p1:'2A',p2:'3P'},
      {p1:'1F',p2:'4K'},{p1:'2I',p2:'3H'},{p1:'1L',p2:'4E'},{p1:'2G',p2:'3J'}
    ];

    // Donji ždrijeb (LR64) - isto ogledalo R64_DRAW rasporeda parova, samo za
    // mjesta 5.-8. iz svake grupe umjesto 1.-4. (rank + 4). Gornji ždrijeb
    // uzima "prvake" grupa, donji "ostatak" - ista logika izbjegavanja da
    // igrači iz iste grupe padnu jedni na druge u prvom kolu.
    const LR64_DRAW = R64_DRAW.map(({p1, p2}) => ({
      p1: String(parseInt(p1) + 4) + p1.slice(-1),
      p2: String(parseInt(p2) + 4) + p2.slice(-1)
    }));

    const ROUND_LABELS = ['Last of 64','Last of 32','Osmina finala','Četvrtfinale','Polufinale','Finale'];
    const ROUND_IDS    = ['R64','R32','R16','QF','SF','F'];

    // Resolve ime igrača iz kôda seeda (npr. "1A" = 1. mjesto grupe A, "5A" =
    // 5. mjesto grupe A) preko group standings mape - koristi ga i gornji
    // (R64_DRAW) i donji (LR64_DRAW) ždrijeb.
    function resolveName(code, gsm) {
      if (!code) return null;
      const m = code.match(/^(\d+)([A-P])$/);
      if (!m) return code;
      const rank = parseInt(m[1])-1;
      const grp  = m[2];
      const standings = gsm[grp];
      if (!standings || !standings[rank]) return null;
      // Dok igrač nije odigrao nijedan meč, computeStandings sortira sve
      // izjednačene na 0 stabilnim sortom - vrati ih u redoslijedu upisa u
      // grupu (nositelj prvi), što IZGLEDA kao razriješen plasman iako nije.
      // Zato se ime prikazuje tek kad taj rang stvarno ima odigranu partiju.
      if (!standings[rank].total) return null;
      return standings[rank].name;
    }

    // Gradi HTML gornjeg žrijeba i puni proslijeđenu matchDataStore mapu (umjesto
    // da uvijek piše u globalnu bracketMatchData) - tako isti builder služi i za
    // živu sezonu i za arhivske sezone (svaka sa svojom namespace-anom mapom),
    // bez kolizije. popupCallBuilder(matchId) vraća onclick JS string, pa live i
    // arhivski prikaz mogu pozivati različite popup handlere.
    // hideNames - opcionalno (samo javni prikaz žive sezone, vidi
    // liveBracketNamesHidden): imena igrača se u kartici zamijene s "TBD" a klik
    // na karticu je isključen (popup bi otkrio imena). matchDataStore i dalje
    // dobiva prava imena - iz njega čitaju profili igrača.
    function buildBracketHtml(matchesByRound, groupStandingsMap, matchDataStore, popupCallBuilder, wrapId, hideNames = false) {
      // Build R64 matches with names
      const r64Matches = R64_DRAW.map((draw, i) => {
        const id = `R64_${i + 1}`;
        const saved = matchesByRound[id] || {};

        // Prikaži pravo ime samo ako je poznato (odigrano ili standings

    function compressImageForUpload(file, maxSize, quality) {

        const img = new Image();
        const reader = new FileReader();
        reader.onload = e => { img.src = e.target.result; };
        reader.onerror = () => reject(new Error('Nije moguće pročitati datoteku.'));
        img.onload = () => {
          let { width, height } = img;
          if (width > height) {
            if (width > maxSize) { height = Math.round(height * maxSize / width); width = maxSize; }
          } else {
            if (height > maxSize) { width = Math.round(width * maxSize / height); height = maxSize; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('Kompresija slike nije uspjela.')), 'image/jpeg', quality);
        };
        img.onerror = () => reject(new Error('Nije moguće učitati sliku.'));
        reader.readAsDataURL(file);
      });

        // permission-denied - ne smije srušiti stvarni upload ispod, samo se stari fajl
        // tad neće očistiti (ostane siroče u Storageu dok ga admin ne odobri/odbije).
        try {
          const existingReq = await getDoc(doc(db, 'photoRequests', slug));
          if (existingReq.exists()) {
            const oldPath = storagePathFromDownloadURL(existingReq.data().photoURL || '');
            if (oldPath) { try { await deleteObject(ref(storage, oldPath)); } catch (e) { /* ignoriraj */ } }
          }
        } catch (e) { /* ignoriraj - vidi komentar iznad */ }

        const blob = await compressImageForUpload(file, 500, 0.85);
        const storageRef = ref(storage, `player-photos-pending/${slug}-${Date.now()}.jpg`);
        await uploadBytes(storageRef, blob, { contentType: 'image/jpeg' });
        const url = await getDownloadURL(storageRef);
        await setDoc(doc(db, 'photoRequests', slug), { playerName: name, photoURL: url, submittedAt: serverTimestamp() });

        showToast('Zahtjev poslan! Admin će uskoro pregledati sliku.', 'success');
      } catch (err) {
        showToast('Greška: ' + err.message, 'error');
      }
    };

    async function loadStandings(seasonId) {
      const content = document.getElementById('content');
      content.innerHTML = `<div class="loading-state"><div class="loading-spinner"></div><span class="loading-text">Učitavanje podataka...</span></div>`;
      try {
        const maxKolo = parseInt(window.activeSeasonConfig?.trenutnoKolo) || 1;
        const seasonDoc = await getDoc(doc(db, 'seasons', seasonId));

        const groupsSnap = await getDocs(collection(db, 'seasons', seasonId, 'groups'));
        const groups = [];
        groupsSnap.forEach(d => groups.push({id:d.id,...d.data()}));
        groups.sort((a,b) => a.id.localeCompare(b.id));

        const groupStandingsMap = {};
        const bestMatchByKolo = {};
        const mvpByKolo = {};

        const groupsData = await Promise.all(groups.map(async (group, i) => {
          const playersSnap = await getDocs(query(collection(db,'seasons',seasonId,'groups',group.id,'players'), orderBy('position')));
          const players = []; playersSnap.forEach(p => players.push(p.data().name));

          const matchesSnap = await getDocs(collection(db,'seasons',seasonId,'groups',group.id,'matches'));
          const matchesMap  = {}; matchesSnap.forEach(m => { const d=m.data(); matchesMap[`${d.kolo}_${d.mec}`]=d; pushRecentMatch(d, group.name, { legs: getGroupPhaseLegs(false), seasonId }); });

          const schedule        = generateSchedule(players);
          const visibleSchedule = schedule.filter(r => r.kolo <= maxKolo);
          const standings       = computeStandings(players, schedule, matchesMap);

          schedule.forEach(({ kolo, matches }) => {
            matches.forEach(({ mec }) => {
              const m = matchesMap[`${kolo}_${mec}`];
              if (m) {
                considerBestMatch(bestMatchByKolo, kolo, m, group.name);
                considerMVP(mvpByKolo, kolo, m);
              }
            });
          });

          // Extract group letter from group.id (e.g. "grupa-a" -> "A")
          const letter = group.id.replace(/[^a-zA-Z]/g,'').slice(-1).toUpperCase();
          groupStandingsMap[letter] = standings;

          // Register players for global search/profile database
          standings.forEach(standingRow => {
            const playerMatches = buildPlayerMatches(standingRow.name, players, schedule, matchesMap);
            registerPlayerSeasonData(standingRow.name, seasonId, SEASON_LABELS[seasonId] || seasonId, letter, group.name, standingRow, playerMatches);
          });

          const html = createAccordion(group.name, i+1, standings, visibleSchedule, matchesMap);
          return {html, standings};
        }));

        content.innerHTML = groupsData.map(g => g.html).join('');

        const allPlayersStats = [];
        groupsData.forEach(g => allPlayersStats.push(...g.standings));
        latestGroupStats = allPlayersStats;
        latestBestMatchByKolo = bestMatchByKolo;
        latestMvpByKolo = mvpByKolo;
        refreshNajboljiWithPlayoffs();
        renderRecentMatches();

        if (seasonDoc.exists() && seasonDoc.data().lastUpdated) {
          document.getElementById('updated-time').textContent = seasonDoc.data().lastUpdated.toDate().toLocaleString('hr-HR');
        }

        // Load bracket (gornji + donji, oba trebaju groupStandingsMap za seed kodove)
        await loadBracket(seasonId, groupStandingsMap);
        await loadLowerBracket(seasonId, groupStandingsMap);

      } catch(err) { showError(err); }
    }

    async function loadSezona1Data() {

        groups.sort((a,b) => a.id.localeCompare(b.id));

    // Podaci se dohvate i renderiraju odmah čim stignu, umjesto da čekaju
    // da korisnik otvori taj tab - ovo je bitno i da NAJBOLJI U LIGI odmah
    // uključi playoff mečeve u izračun.
    let upperBracketReady = false;
    let lowerBracketReady = false;

    async function loadBracket(seasonId, groupStandingsMap) {
      try {
        const bracketSnap = await getDocs(collection(db,'seasons',seasonId,'bracket'));
        const matchesByRound = {};
        bracketSnap.forEach(d => { const data = d.data(); matchesByRound[d.id] = data; pushRecentMatch(data, bracketRoundLabelFromId(d.id, false), { legs: getPlayoffLegs(d.id, false), seasonId }); });
        renderBracket(matchesByRound, groupStandingsMap);

        renderRecentMatches();

          '<div class="error-state">Greška pri učitavanju ždrijeba: ' + escapeHtml(err.message) + '</div>';
      }

    async function loadLowerBracket(seasonId, groupStandingsMap) {
      try {
        const lowerBracketSnap = await getDocs(collection(db,'seasons',seasonId,'lower-bracket'));
        const matchesByRound = {};
        lowerBracketSnap.forEach(d => { const data = d.data(); matchesByRound[d.id] = data; pushRecentMatch(data, bracketRoundLabelFromId(d.id, true), { legs: getPlayoffLegs(d.id, false), seasonId }); });
        renderLowerBracket(matchesByRound, groupStandingsMap || {});
        lowerBracketReady = true;
        refreshNajboljiWithPlayoffs();
        renderRecentMatches();
      } catch(err) {
        document.getElementById('donji-zdrijeb-content').innerHTML =
          '<div class="error-state">Greška pri učitavanju ždrijeba: ' + escapeHtml(err.message) + '</div>';
      }
    }

    // Zadnji poznati grupni presjek (postavlja ga loadStandings) - potreban
    // ovdje da refreshNajboljiWithPlayoffs može ponovno spojiti grupne +
    // playoff podatke bez obzira koji od ta dva async izvora stigne zadnji.
    let latestGroupStats = null;       // allPlayersStats iz grupa
    let latestBestMatchByKolo = null;  // best match po kolu (grupna faza)
    let latestMvpByKolo = null;        // MVP po kolu (grupna faza)

    // Spaja duplicirane zapise istog igrača (npr. jedan iz grupne faze, jedan
    // iz playoffa) u JEDAN zapis prije nego uđe u top 5 liste ("Najbolji u
    // ligi" je inače prikazivao istog igrača dvaput ako je igrao i grupnu
    // fazu i playoff). AVG/First 9 se spajaju kao PONDERIRANI prosjek (po
    // broju odigranih mečeva, `total`), Best Leg preko Math.min (manje darts
    // = bolje), Best CO preko Math.max, 180s se zbrajaju. win/draw/lost/total/
    // legs/pts se zbrajaju (playoff zapisi ih obično nemaju, pa su 0/undefined).
    function mergePlayerStats(statsArray) {
      const avgWeightOf = (p) => p.avg !== '--' ? (p._avgMatchCount ?? p.total ?? 1) : 0;
      const f9WeightOf  = (p) => p.f9  !== '--' ? (p._f9MatchCount  ?? p.total ?? 1) : 0;

      const byName = {};
      statsArray.forEach(p => {
        if (!byName[p.name]) {
          byName[p.name] = { ...p };
          byName[p.name]._avgWeight = avgWeightOf(p);
          byName[p.name]._f9Weight  = f9WeightOf(p);
          return;
        }
        const existing = byName[p.name];
        const w1 = existing._avgWeight, w2 = avgWeightOf(p);
        if (w1 + w2 > 0) {
          const sum1 = existing.avg !== '--' ? parseFloat(existing.avg) * w1 : 0;
          const sum2 = p.avg !== '--' ? parseFloat(p.avg) * w2 : 0;
          existing.avg = ((sum1 + sum2) / (w1 + w2)).toFixed(2);
          existing._avgWeight = w1 + w2;
        }
        const wf1 = existing._f9Weight, wf2 = f9WeightOf(p);
        if (wf1 + wf2 > 0) {
          const sumf1 = existing.f9 !== '--' ? parseFloat(existing.f9) * wf1 : 0;
          const sumf2 = p.f9 !== '--' ? parseFloat(p.f9) * wf2 : 0;
          existing.f9 = ((sumf1 + sumf2) / (wf1 + wf2)).toFixed(2);
          existing._f9Weight = wf1 + wf2;
        }
        const blCandidates = [existing.bl, p.bl].filter(v => v !== '--' && v > 0);
        existing.bl = blCandidates.length ? Math.min(...blCandidates) : (existing.bl || '');
        const bcoCandidates = [existing.bco, p.bco].filter(v => v !== '--' && v > 0);
        existing.bco = bcoCandidates.length ? Math.max(...bcoCandidates) : (existing.bco || '');
        existing.x180 = (existing.x180 || 0) + (p.x180 || 0);
        existing.win  = (existing.win  || 0) + (p.win  || 0);
        existing.draw = (existing.draw || 0) + (p.draw || 0);
        existing.lost = (existing.lost || 0) + (p.lost || 0);
        existing.total = (existing.total || 0) + (p.total || 0);
        existing.legs = (existing.legs || 0) + (p.legs || 0);
        existing.pts  = (existing.pts  || 0) + (p.pts  || 0);
      });
      return Object.values(byName);
    }

    function refreshNajboljiWithPlayoffs() {
      if (!latestGroupStats) return; // grupni podaci još nisu stigli
      // Bracket podaci koji još nisu stigli jednostavno se preskaču (prazan objekt),
      // funkcija se ionako zove ponovno čim upper/lower bracket stigne.
      const playoffData = collectPlayoffStatsAndBestMatch();
      const combinedStats = mergePlayerStats([...latestGroupStats, ...playoffData.perPlayerStats]);
      const combinedBestMatchByKolo = { ...latestBestMatchByKolo, ...playoffData.bestMatchByRound };
      const combinedMvpByKolo = { ...latestMvpByKolo, ...playoffData.mvpByRound };
      setLeagueStatsForSeason(ACTIVE_SEASON_ID, combinedStats, combinedBestMatchByKolo, combinedMvpByKolo);
      // window.playerSeasonAvgMap[ACTIVE_SEASON_ID] se puni unutar setLeagueStatsForSeason
    }

    // -- NAJBOLJI U LIGI: VIŠE SEZONA --
    // Sve sezone iz SEASON_ORDER osim trenutno aktivne se pokušavaju učitati
    // za "Najbolji u ligi" tab (aktivna se već puni kroz loadStandings/
    // loadBracket/loadLowerBracket). Izvodi se iz SEASON_ORDER umjesto ručne
    // liste, tako da dodavanje sezona-4 u SEASON_ORDER bude dovoljno - ništa
    // se ovdje ne mora ručno dirati. Sezone bez podataka (prazne grupe) se
    // jednostavno tiho preskaču u loadLeagueStatsForSeason.
    function getAdditionalLeagueStatSeasons() {
      return SEASON_ORDER.filter(s => s !== ACTIVE_SEASON_ID && s !== 'sezona-1'); // sezona-1 ima svoj poseban arhivski format (bez matches subcollectiona)
    }

    // leagueStatsCache[ACTIVE_SEASON_ID] se puni postojećim tokom (latestGroupStats itd.),
    // dodatne sezone pune se kroz loadLeagueStatsForSeason ispod.
    const leagueStatsCache = {};
    let activeNajboljiSeason = ACTIVE_SEASON_ID;

    function setLeagueStatsForSeason(seasonId, groupStats, bestMatchByRound, mvpByRound) {
      leagueStatsCache[seasonId] = { groupStats, bestMatchByRound, mvpByRound };

      // playerName -> {avg, f9} za OVU sezonu (uključuje playoff kad je
      // dostupan - groupStats je već spojen s playoffom i za aktivnu i za
      // arhivske sezone, vidi refreshNajboljiWithPlayoffs/loadLeagueStatsForSeason).
      // Namespace-ano po sezoni jer statDiffHtml u match popupu mora uspoređivati
      // meč sa PRAVOM sezonom tog meča, ne uvijek s aktivnom sezonom.
      window.playerSeasonAvgMap = window.playerSeasonAvgMap || {};
      window.playerSeasonAvgMap[seasonId] = {};
      groupStats.forEach(p => { window.playerSeasonAvgMap[seasonId][p.name] = { avg: p.avg, f9: p.f9 }; });

      renderGlobalSeasonToggle();
      if (seasonId === activeNajboljiSeason) renderActiveNajboljiSeason();
    }

    function renderActiveNajboljiSeason() {
      const data = leagueStatsCache[activeNajboljiSeason];
      if (!data) return;
      renderNajbolji(data.groupStats);
      renderBestMatches(data.bestMatchByRound, data.mvpByRound);
    }

    // Generički loader za sezone koje NISU trenutno aktivna sezona (npr. sezona-3
    // dok se igra usporedno ili nakon što sezona-2 završi). Ne dira TABLICE tab,
    // koloDataMap, playerDatabase ni bilo koji postojeći sezona-2 kod - samo
    // izračunava iste agregate (standings + best match/MVP + playoff) za tu sezonu
    // i puni leagueStatsCache preko setLeagueStatsForSeason.
    async function loadLeagueStatsForSeason(seasonId) {
      try {
        const groupsSnap = await getDocs(collection(db, 'seasons', seasonId, 'groups'));
        const groups = []; groupsSnap.forEach(d => groups.push({id:d.id,...d.data()}));
        if (!groups.length) return; // sezona još nema grupa - preskoči tiho
        groups.sort((a,b) => a.id.localeCompare(b.id));

        const bestMatchByKolo = {};
        const mvpByKolo = {};

        const groupsData = await Promise.all(groups.map(async group => {
          const playersSnap = await getDocs(query(collection(db,'seasons',seasonId,'groups',group.id,'players'), orderBy('position')));
          const players = []; playersSnap.forEach(p => players.push(p.data().name));

          const matchesSnap = await getDocs(collection(db,'seasons',seasonId,'groups',group.id,'matches'));
          const matchesMap  = {}; matchesSnap.forEach(m => { const d=m.data(); matchesMap[`${d.kolo}_${d.mec}`]=d; });

          const schedule  = generateSchedule(players);
          const standings = computeStandings(players, schedule, matchesMap);

          schedule.forEach(({ kolo, matches }) => {
            matches.forEach(({ mec }) => {
              const m = matchesMap[`${kolo}_${mec}`];
              if (m) {
                considerBestMatch(bestMatchByKolo, kolo, m, group.name);
                considerMVP(mvpByKolo, kolo, m);
              }
            });
          });

          return standings;
        }));

        const groupStats = groupsData.flat();

        // Playoff (gornji/donji ždrijeb) za tu sezonu, ako postoji - koristi
        // odvojene mape (ne globalne bracketMatchData/lowerBracketMatchData
        // koje su rezervirane za trenutno aktivnu sezonu i njen popup/profil prikaz).
        const [bracketSnap, lowerBracketSnap] = await Promise.all([
          getDocs(collection(db,'seasons',seasonId,'bracket')).catch(() => null),
          getDocs(collection(db,'seasons',seasonId,'lower-bracket')).catch(() => null)
        ]);
        const bracketDataMap = {};
        if (bracketSnap) bracketSnap.forEach(d => { bracketDataMap[d.id] = d.data(); });
        const lowerBracketDataMap = {};
        if (lowerBracketSnap) lowerBracketSnap.forEach(d => { lowerBracketDataMap[d.id] = d.data(); });

        const playoffData = collectPlayoffStatsAndBestMatch(bracketDataMap, lowerBracketDataMap);
        const combinedStats = mergePlayerStats([...groupStats, ...playoffData.perPlayerStats]);
        const combinedBestMatchByKolo = { ...bestMatchByKolo, ...playoffData.bestMatchByRound };
        const combinedMvpByKolo = { ...mvpByKolo, ...playoffData.mvpByRound };

        setLeagueStatsForSeason(seasonId, combinedStats, combinedBestMatchByKolo, combinedMvpByKolo);
      } catch(err) {
        console.error(`Greška pri učitavanju "Najbolji u ligi" za ${seasonId}:`, err);
      }
    }

    function loadAdditionalLeagueStatSeasons() {
      getAdditionalLeagueStatSeasons().forEach(seasonId => loadLeagueStatsForSeason(seasonId));
    }

    // -- AVG LIGE (Diamond/Gold/Silver/Bronze/Ženska, Firestore avg-leagues/{seasonId}/{leagueId}/...) --
    // "Trenutna" AVG sezona = ACTIVE_SEASON_ID (isti config/active-season kao
    // TABLICE/ŽDRIJEB) - kad admin prebaci aktivnu sezonu, AVG lige ide s njom
    // bez ikakve dodatne postavke. Grupa je dokument IZRAVNO u {leagueId}
    // kolekciji (nema posrednog "groups" naziva), pa "rezultati" i "bracket"
    // (jednodokumentni, vidi niže) žive kao susjedi grupa u istoj kolekciji -
    // AVG_RESERVED_DOC_IDS filtrira te rezervirane nazive kod listanja grupa.
    //
    // Koristi iste rendering funkcije kao arhiva (createArchiveAccordion i njena
    // pratnja, definirane u prvom <script> bloku) i computeStandings/
    // generateAvgSchedule (također prvi blok, čisti DOM/izračun bez Firestore
    // importa) - ovaj loader treba biti u module bloku samo zbog getDocs/db.
    //
    // Razdvojeno od DOM-a (fetchAvgLeagueData) da se isti fetch+registracija
    // mogu pozvati eager kod bootstrapa (za player profile AVG tab, bez obzira
    // je li korisnik uopće otvorio AVG LIGE tab) bez pisanja u #avg-lige-content.
    const AVG_RESERVED_DOC_IDS = ['rezultati', 'bracket'];

    async function fetchAvgLeagueData(leagueId) {
      if (avgLigeDataCache[leagueId]) return; // već učitano
      const seasonId = ACTIVE_SEASON_ID;
      const maxAvgKolo = parseInt(window.activeSeasonConfig?.trenutnoKoloAvg) || 1;
      const groupsSnap = await getDocs(collection(db, 'avg-leagues', seasonId, leagueId));
      const groups = [];
      groupsSnap.forEach(d => { if (!AVG_RESERVED_DOC_IDS.includes(d.id)) groups.push({id:d.id,...d.data()}); });
      groups.sort((a,b) => a.id.localeCompare(b.id));

      const groupsData = await Promise.all(groups.map(async (group, i) => {
        const playersSnap = await getDocs(query(collection(db,'avg-leagues',seasonId,leagueId,group.id,'players'), orderBy('position')));
        const players = []; playersSnap.forEach(p => players.push(p.data().name));

        const matchesSnap = await getDocs(collection(db,'avg-leagues',seasonId,leagueId,group.id,'matches'));
        const matchesMap = {}; matchesSnap.forEach(m => { const d=m.data(); matchesMap[`${d.kolo}_${d.mec}`]=d; pushRecentMatch(d, `${AVG_LEAGUE_LABELS[leagueId] || leagueId} - ${group.name}`, { legs: getGroupPhaseLegs(true), seasonId: `avg:${seasonId}:${leagueId}` }); });

        const schedule        = generateAvgSchedule(players);
        const visibleSchedule = schedule.filter(r => r.kolo <= maxAvgKolo);
        const standings       = computeStandings(players, schedule, matchesMap);
        const uid = `avg-${leagueId}-${i+1}`;

        // Registriraj igrače za player profile "AVG" tab + AVG-scoped
        // playerSeasonAvgMap (za +/- diff u match popupu, ključ 'avg:{sezona}:{liga}').
        standings.forEach(standingRow => {
          const playerMatches = buildPlayerMatches(standingRow.name, players, schedule, matchesMap);
          registerAvgPlayerData(standingRow.name, seasonId, leagueId, AVG_LEAGUE_LABELS[leagueId] || leagueId, group.id, group.name, standingRow, playerMatches);
        });

        return { html: createArchiveAccordion(group.name, uid, String(i+1), standings, visibleSchedule, matchesMap), standings };
      }));

      avgLigeDataCache[leagueId] = groupsData.length
        ? groupsData.map(g => g.html).join('')
        : '<div class="empty-state">Nema grupa za ovu ligu.</div>';

      const avgKey = `avg:${seasonId}:${leagueId}`;
      window.playerSeasonAvgMap = window.playerSeasonAvgMap || {};
      window.playerSeasonAvgMap[avgKey] = {};
      groupsData.forEach(g => g.standings.forEach(p => { window.playerSeasonAvgMap[avgKey][p.name] = { avg: p.avg, f9: p.f9 }; }));
      renderRecentMatches();
    }

    async function loadAvgLige(leagueId) {
      const contentEl = document.getElementById('avg-lige-content');
      if (avgLigeDataCache[leagueId]) { contentEl.innerHTML = avgLigeDataCache[leagueId]; return; }
      contentEl.innerHTML = `<div class="loading-state"><div class="loading-spinner"></div><span class="loading-text">Učitavanje podataka...</span></div>`;
      try {
        await fetchAvgLeagueData(leagueId);
        contentEl.innerHTML = avgLigeDataCache[leagueId];
      } catch(err) {
        contentEl.innerHTML = '<div class="error-state">Ne mogu dohvatiti podatke. ' + escapeHtml(err?.message||err) + '</div>';
      }
    }
    window.loadAvgLige = loadAvgLige;

    // AVG playoff - jedan zajednički ždrijeb po ligi, JEDAN dokument (ne
    // kolekcija) avg-leagues/{ACTIVE_SEASON_ID}/{leagueId}/bracket s mapom
    // mečeva u polju 'matches'. Dokument danas ne postoji ni za jednu ligu
    // (admin/kreiranje ždrijeba za AVG lige je posebna, buduća funkcionalnost) -
    // fetch tiho ne nađe ništa i avgBracketDataMap[sezona][liga] ostaje prazan
    // objekt, isti obrazac kao ostali "spreman za buduće podatke" dijelovi koda.
    async function loadAvgBracket(leagueId) {
      const seasonId = ACTIVE_SEASON_ID;
      try {
        const snap = await getDoc(doc(db, 'avg-leagues', seasonId, leagueId, 'bracket'));
        avgBracketDataMap[seasonId] = avgBracketDataMap[seasonId] || {};
        avgBracketDataMap[seasonId][leagueId] = snap.exists() ? (snap.data().matches || {}) : {};
      } catch (err) {
        console.error(`Greška pri učitavanju AVG ždrijeba za ${seasonId}/${leagueId}:`, err);
      }
    }

    // Povijesni AVG lige rezultati - JEDAN dokument (ne kolekcija)
    // avg-leagues/{seasonId}/{leagueId}/rezultati s mapom igrača u poljima
    // dokumenta ({ [slug]: {name, avg, result} }). Samo finalni avg+result,
    // bez mečeva (vidi registerAvgHistoryData). Dokument koji ne postoji za
    // neku sezonu/ligu (npr. Silver dok se ne doda) → tiho ništa. Poziva se za
    // SVAKU sezonu iz SEASON_ORDER (ne samo trenutnu) - buduće arhivske sezone
    // rade same od sebe, bez novog koda.
    async function loadAvgHistoryForSeason(seasonId, leagueId) {
      try {
        const snap = await getDoc(doc(db, 'avg-leagues', seasonId, leagueId, 'rezultati'));
        if (!snap.exists()) return;
        Object.values(snap.data() || {}).forEach(data => {
          if (!data?.name) return;
          registerAvgHistoryData(data.name, seasonId, leagueId, AVG_LEAGUE_LABELS[leagueId] || leagueId, data.avg, data.result);
        });
      } catch (err) {
        console.error(`Greška pri učitavanju povijesnih AVG rezultata za ${seasonId}/${leagueId}:`, err);
      }
    }

    function loadAllAvgLeagues() {
      Object.keys(AVG_LEAGUE_LABELS).forEach(leagueId => {
        fetchAvgLeagueData(leagueId).catch(err => console.error(`Greška pri učitavanju AVG lige ${leagueId}:`, err));
        loadAvgBracket(leagueId);
        SEASON_ORDER.forEach(seasonId => loadAvgHistoryForSeason(seasonId, leagueId));
      });
    }

    // -- TABLICE ARHIVA (prošle sezone, puni standings + raspored, read-only) --
    // Odvojeno od aktivne sezone (koja koristi koloDataMap/createAccordion) -
    // koristi arhivske, namespace-ane funkcije definirane u prvom <script> bloku
    // (archiveKoloDataMap, createArchiveAccordion...), tako da nikad ne kolidira
    // s DOM-om ili globalnim mapama aktivne sezone.
    const archiveDataCache = {}; // seasonId -> html string (izgrađen jednom, keširan)
    const archiveGroupStandingsMap = {}; // seasonId -> {slovo: standings[]} - treba ga i arhivski bracket (loadArchiveBracket)
    let activeSeasonView = 'active'; // 'active' | seasonId arhive - jedini izvor istine za TABLICE/NAJBOLJI/ŽDRIJEB toggle

    async function loadArchiveSeason(seasonId) {
      if (archiveDataCache[seasonId]) return; // već učitano
      try {
        const groupsSnap = await getDocs(collection(db, 'seasons', seasonId, 'groups'));
        const groups = []; groupsSnap.forEach(d => groups.push({id:d.id,...d.data()}));
        if (!groups.length) return; // sezona nema grupa (arhiva još ne postoji) - preskoči tiho

        groups.sort((a,b) => a.id.localeCompare(b.id));

        const groupStandingsMap = {};
        const groupsHtml = await Promise.all(groups.map(async (group, i) => {
          const playersSnap = await getDocs(query(collection(db,'seasons',seasonId,'groups',group.id,'players'), orderBy('position')));
          const players = []; playersSnap.forEach(p => players.push(p.data().name));

          const matchesSnap = await getDocs(collection(db,'seasons',seasonId,'groups',group.id,'matches'));
          const matchesMap  = {}; matchesSnap.forEach(m => { const d=m.data(); matchesMap[`${d.kolo}_${d.mec}`]=d; });

          const schedule  = generateSchedule(players);
          const standings = computeStandings(players, schedule, matchesMap);
          const uid = `arch-${seasonId}-${i+1}`;

          const letter = group.id.replace(/[^a-zA-Z]/g,'').slice(-1).toUpperCase();
          groupStandingsMap[letter] = standings;

          // Registriraj igrače u playerDatabase (player profile tabovi po sezoni) -
          // isti poziv kao loadStandings radi za aktivnu sezonu, ovdje za arhivsku.
          standings.forEach(standingRow => {
            const playerMatches = buildPlayerMatches(standingRow.name, players, schedule, matchesMap);
            registerPlayerSeasonData(standingRow.name, seasonId, SEASON_LABELS[seasonId] || seasonId, letter, group.name, standingRow, playerMatches);
          });

          return createArchiveAccordion(group.name, uid, String(i+1), standings, schedule, matchesMap);
        }));

        archiveDataCache[seasonId] = groupsHtml.join('');
        archiveGroupStandingsMap[seasonId] = groupStandingsMap;
        renderGlobalSeasonToggle(); // sezona sad ima podataka - prikaži joj pil u toggleu

        // Eager preload playoff (gornji+donji ždrijeb) mečeva ove arhivske
        // sezone - potrebno da player profile odmah prikaže i zbroji playoff
        // mečeve za ovu sezonu (getPlayoffMatchesForPlayer), a ne tek nakon
        // što netko ručno otvori Ždrijeb tab arhive. Isti helperi (ensure...)
        // koriste se i tamo, pa se HTML ne gradi dvaput.
        await ensureArchiveBracketBuilt(seasonId, groupStandingsMap);
        await ensureArchiveLowerBracketBuilt(seasonId, groupStandingsMap);
      } catch (err) {
        console.error(`Greška pri učitavanju arhive za ${seasonId}:`, err);
      }
    }

    async function ensureArchiveBracketBuilt(seasonId, groupStandingsMap) {
      if (archiveBracketDataCache[seasonId]) return;
      try {
        const bracketSnap = await getDocs(collection(db, 'seasons', seasonId, 'bracket'));
        const matchesByRound = {}; bracketSnap.forEach(d => { matchesByRound[d.id] = d.data(); });
        archiveBracketMatchData[seasonId] = {};
        archiveBracketDataCache[seasonId] = buildBracketHtml(
          matchesByRound, groupStandingsMap || archiveGroupStandingsMap[seasonId] || {}, archiveBracketMatchData[seasonId],
          id => `openArchiveBracketMatchPopup('${seasonId}','${id}')`, 'archive-bracket-wrap-upper'
        );
      } catch (err) {
        console.error(`Greška pri učitavanju gornjeg ždrijeba (playoff) za ${seasonId}:`, err);
      }
    }

    async function ensureArchiveLowerBracketBuilt(seasonId, groupStandingsMap) {
      if (archiveLowerBracketDataCache[seasonId]) return;
      try {
        const lowerSnap = await getDocs(collection(db, 'seasons', seasonId, 'lower-bracket'));
        const matchesByRound = {}; lowerSnap.forEach(d => { matchesByRound[d.id] = d.data(); });
        archiveLowerBracketMatchData[seasonId] = {};
        archiveLowerBracketDataCache[seasonId] = buildLowerBracketHtml(
          matchesByRound, groupStandingsMap || archiveGroupStandingsMap[seasonId] || {}, archiveLowerBracketMatchData[seasonId],
          id => `openArchiveLowerBracketMatchPopup('${seasonId}','${id}')`, 'archive-bracket-wrap-lower'
        );
      } catch (err) {
        console.error(`Greška pri učitavanju donjeg ždrijeba (playoff) za ${seasonId}:`, err);
      }
    }

    // -- ZAJEDNIČKI TOGGLE (TABLICE + NAJBOLJI U LIGI + GORNJI/DONJI ŽDRIJEB) --
    // Jedan gumb-red u .player-search-wrap upravlja sve četiri sekcije odjednom.
    // Bracket arhiva ostaje lijena (fetch tek na klik + cache u
    // archiveBracketDataCache/archiveLowerBracketDataCache), TABLICE i Najbolji
    // su već eager učitani (loadArchiveSeason/loadLeagueStatsForSeason u bootstrapu).
    function renderGlobalSeasonToggle() {
      const wrap = document.getElementById('global-season-toggle');
      const archiveSeasons = Object.keys(archiveDataCache).filter(s => SEASON_ORDER.includes(s)).sort((a,b)=>SEASON_ORDER.indexOf(a)-SEASON_ORDER.indexOf(b));
      if (!archiveSeasons.length) { wrap.innerHTML = ''; return; } // nema arhive - ne prikazuj toggle (današnje ponašanje)

      const activeLabel = SEASON_LABELS[ACTIVE_SEASON_ID] || ACTIVE_SEASON_ID;
      const buttons = [
        `<button class="player-season-tab ${activeSeasonView==='active'?'active':''}" onclick="switchGlobalSeasonView('active')">${escapeHtml(activeLabel)}</button>`,
        ...archiveSeasons.map(s =>
          `<button class="player-season-tab ${activeSeasonView===s?'active':''}" onclick="switchGlobalSeasonView('${s}')">${escapeHtml(SEASON_LABELS[s]||s)}</button>`
        )
      ];
      wrap.innerHTML = buttons.join('');
    }

    function switchGlobalSeasonView(target) {
      // Sačuvaj scroll poziciju - bez ovoga, ako novi prikaz ima manje sadržaja
      // od trenutnog (npr. TABLICE žive sezone dok još nema grupa), browser
      // sam skrati scroll na novu (kraću) visinu stranice, što djeluje kao
      // neželjen "skok na vrh". GORNJI/DONJI ŽDRIJEB to ne pokazuju jer bracket
      // uvijek renderira punu shemu od 64 meča bez obzira ima li podataka, pa
      // mu se visina praktički ne mijenja - ali fix mora vrijediti posvuda.
      const scrollY = window.scrollY;

      activeSeasonView = target;
      renderGlobalSeasonToggle();
      const isActive = target === 'active';

      const contentEl = document.getElementById('content');
      const archiveEl = document.getElementById('archive-content');
      contentEl.style.display = isActive ? '' : 'none';
      archiveEl.style.display = isActive ? 'none' : '';
      if (!isActive) archiveEl.innerHTML = archiveDataCache[target] || '<div class="empty-state">Nema podataka za ovu sezonu.</div>';

      const gornjiContentEl = document.getElementById('gornji-zdrijeb-content');
      const gornjiArchiveEl = document.getElementById('gornji-zdrijeb-archive-content');
      gornjiContentEl.style.display = isActive ? '' : 'none';
      gornjiArchiveEl.style.display = isActive ? 'none' : '';
      if (!isActive) loadArchiveBracket(target);

      const donjiContentEl = document.getElementById('donji-zdrijeb-content');
      const donjiArchiveEl = document.getElementById('donji-zdrijeb-archive-content');
      donjiContentEl.style.display = isActive ? '' : 'none';
      donjiArchiveEl.style.display = isActive ? 'none' : '';
      if (!isActive) loadArchiveLowerBracket(target);

      activeNajboljiSeason = isActive ? ACTIVE_SEASON_ID : target;
      renderActiveNajboljiSeason();

      window.scrollTo(0, scrollY);
    }
    window.switchGlobalSeasonView = switchGlobalSeasonView;

    async function loadArchiveBracket(seasonId) {
      const contentEl = document.getElementById('gornji-zdrijeb-archive-content');
      if (archiveBracketDataCache[seasonId]) {
        contentEl.innerHTML = archiveBracketDataCache[seasonId];
        requestAnimationFrame(() => scheduleAllPairOffsets());
        window.__observeBracketWrap('archive-bracket-wrap-upper');
        return;
      }
      contentEl.innerHTML = `<div class="loading-state"><div class="loading-spinner"></div><span class="loading-text">Učitavanje ždrijeba...</span></div>`;
      try {
        await loadArchiveSeason(seasonId); // osigurava archiveGroupStandingsMap[seasonId] + poziva ensureArchiveBracketBuilt
        await ensureArchiveBracketBuilt(seasonId, archiveGroupStandingsMap[seasonId] || {});
        contentEl.innerHTML = archiveBracketDataCache[seasonId] || '<div class="empty-state">Nema podataka o ždrijebu.</div>';
        requestAnimationFrame(() => scheduleAllPairOffsets());
        window.__observeBracketWrap('archive-bracket-wrap-upper');
      } catch (err) {
        contentEl.innerHTML = '<div class="error-state">Greška pri učitavanju ždrijeba: ' + escapeHtml(err?.message||err) + '</div>';
      }
    }

    async function loadArchiveLowerBracket(seasonId) {
      const contentEl = document.getElementById('donji-zdrijeb-archive-content');
      if (archiveLowerBracketDataCache[seasonId]) {
        contentEl.innerHTML = archiveLowerBracketDataCache[seasonId];
        requestAnimationFrame(() => scheduleAllPairOffsets());
        window.__observeBracketWrap('archive-bracket-wrap-lower');
        return;
      }
      contentEl.innerHTML = `<div class="loading-state"><div class="loading-spinner"></div><span class="loading-text">Učitavanje ždrijeba...</span></div>`;
      try {
        await ensureArchiveLowerBracketBuilt(seasonId);
        contentEl.innerHTML = archiveLowerBracketDataCache[seasonId] || '<div class="empty-state">Nema podataka o ždrijebu.</div>';
        requestAnimationFrame(() => scheduleAllPairOffsets());
        window.__observeBracketWrap('archive-bracket-wrap-lower');
      } catch (err) {
        contentEl.innerHTML = '<div class="error-state">Greška pri učitavanju ždrijeba: ' + escapeHtml(err?.message||err) + '</div>';
      }
    }

    function loadArchiveSeasons() {
      // Sezona 1 ima poseban legacy oblik (standings polja izravno na igraču,
      // bez matches subcollectiona) i već ima svoj prikaz kroz playerDatabase/
      // profil popup - generateSchedule+computeStandings bi za nju dao krive
      // (nul-ove) rezultate jer nema mečeva za izračun, pa se ovdje preskače.
      SEASON_ORDER.filter(s => s !== ACTIVE_SEASON_ID && s !== 'sezona-1').forEach(seasonId => loadArchiveSeason(seasonId));
    }

    // -- BOOTSTRAP --
    // Redoslijed je bitan: prvo se pročita koja je sezona aktivna, tek onda
    // se pokreću svi loaderi koji o tome ovise (TABLICE, bracketovi, Najbolji
    // u ligi, arhiva). Sezona 1 (posebni legacy oblik) učitava se neovisno.
    async function bootstrap() {
      ACTIVE_SEASON_ID = await resolveActiveSeasonId();
      window.ACTIVE_SEASON_ID = ACTIVE_SEASON_ID;
      activeNajboljiSeason = ACTIVE_SEASON_ID;

      await loadBracketConfig();
      loadPlayerPhotos();
      loadSezona1Data();
      loadStandings(ACTIVE_SEASON_ID); // sad interno zove i loadBracket i loadLowerBracket (trebaju groupStandingsMap)
      loadAdditionalLeagueStatSeasons();
      loadArchiveSeasons();
      loadAllAvgLeagues();

      openProfileFromUrl();
    }

    // Podrška za duboku poveznicu ?player=Ime - koristi je group-detail.html
    // (nema svoj player profile modal, otvara ovu stranicu u novom tabu).
    // playerDatabase se puni asinkrono iz više neovisnih loadera iznad, pa se
    // čeka (kratko pollanje) dok ime ne postane dostupno, umjesto da se odmah
    // odustane ako bootstrap još nije gotov.
    function openProfileFromUrl() {
      const name = new URLSearchParams(window.location.search).get('player');
      if (!name) return;
      let attempts = 0;
      const tryOpen = () => {
        if (playerDatabase[name]) { openPlayerProfile(name); return; }
        if (++attempts > 30) return; // ~6s, odustani tiho ako igrač ne postoji
        setTimeout(tryOpen, 200);
      };
      tryOpen();
    }

    bootstrap();
  </script>
