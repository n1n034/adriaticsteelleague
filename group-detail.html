<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a1628">
  <title>Adriatic Steel League - Admin grupe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" href="images/ASL-logo.png">

  <style>
    :root {
      --text: #ffffff;
      --muted: #c8d3ea;
      --panel: rgba(8, 14, 28, 0.82);
      --panel-2: rgba(12, 20, 38, 0.96);
      --header: rgba(21, 49, 99, 0.95);
      --header-hover: rgba(39, 81, 159, 0.98);
      --line: rgba(255,255,255,0.10);
      --shadow: 0 18px 50px rgba(0,0,0,0.35);
      --radius: 18px;
      --accent: #4a90e2;
      --accent-hover: #5ba3f5;
      --table-head: #183a78;
      --success: #2ecc71;
      --warning: #f39c12;
      --danger: #e74c3c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      background: #1a3a5c;
      font-family: 'Lexend', sans-serif;
      font-weight: 400;
      color: var(--text);
    }

    .bg-image {
      position: fixed; inset: 0; z-index: 0;
      background-image: url("images/background.jpeg");
      background-size: cover;
      background-position: center center;
    }

    .bg-overlay {
      position: fixed; inset: 0; z-index: 1;
      background: linear-gradient(rgba(3,8,18,0.65), rgba(3,8,18,0.88));
    }

    .page {
      position: relative; z-index: 10;
      min-height: 100vh;
      padding: 24px 16px 60px;
    }

    .container { max-width: 1200px; margin: 0 auto; }

    /* ── TOPBAR ── */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 28px; flex-wrap: wrap; gap: 12px;
    }

    .back-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 9px 18px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 999px;
      color: var(--muted);
      font-family: 'Lexend', sans-serif;
      font-size: 0.82rem; font-weight: 600;
      cursor: pointer; text-decoration: none;
      transition: 0.2s ease;
    }
    .back-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }

    .group-title-bar {
      display: flex; align-items: center; gap: 14px;
    }

    .group-name { font-size: 1.4rem; font-weight: 800; letter-spacing: 0.5px; }
    .group-sub  { font-size: 0.75rem; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }

    .admin-badge {
      padding: 5px 14px; border-radius: 999px;
      font-size: 0.72rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
      background: rgba(255,215,0,0.15); border: 1px solid rgba(255,215,0,0.35); color: #FFD700;
    }

    /* ── TABS ── */
    .tabs {
      display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap;
    }

    .tab-btn {
      padding: 10px 24px;
      background: rgba(10,19,38,0.78);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 999px;
      color: var(--muted);
      font-family: 'Lexend', sans-serif;
      font-size: 0.85rem; font-weight: 600;
      cursor: pointer; transition: 0.2s ease;
    }
    .tab-btn:hover { background: rgba(38,74,138,0.7); color: #fff; }
    .tab-btn.active {
      background: rgba(21,49,99,1);
      border-color: rgba(255,255,255,0.7);
      color: #fff;
      box-shadow: 0 0 12px rgba(255,255,255,0.2);
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── STANDINGS ── */
    .standings-wrap {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      backdrop-filter: blur(7px);
      animation: fadeInUp 0.4s ease both;
    }

    .standings-header {
      background: var(--header);
      padding: 16px 20px;
      display: flex; align-items: center; justify-content: space-between;
    }

    .standings-header h2 { font-size: 1rem; font-weight: 700; letter-spacing: 0.5px; }

    .table-wrap { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; }
    thead th {
      background: var(--table-head);
      color: #fff;
      padding: 12px 14px;
      font-size: 0.85rem; font-weight: 700;
      text-align: center; white-space: nowrap;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    thead th:first-child { text-align: left; }
    tbody td {
      padding: 11px 14px;
      font-size: 0.88rem; color: #edf3ff;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      white-space: nowrap;
    }
    tbody td:first-child { text-align: left; font-weight: 600; }
    tbody tr:hover { background: rgba(110,168,255,0.08); }
    tbody tr:nth-child(4) td { border-bottom: 2px solid rgba(255,255,255,0.4); }

    .rank-cell { font-weight: 700; color: var(--muted); width: 32px; }
    .pts-cell  { font-weight: 800; color: #7eb8ff; }

    /* ── KOLO SECTION ── */
    .kolo-section {
      margin-bottom: 20px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      backdrop-filter: blur(7px);
      box-shadow: var(--shadow);
      animation: fadeInUp 0.4s ease both;
    }

    .kolo-header {
      background: var(--header);
      padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; transition: 0.2s ease;
    }
    .kolo-header:hover { background: var(--header-hover); }
    .kolo-header-left { display: flex; align-items: center; gap: 12px; }
    .kolo-number {
      width: 32px; height: 32px;
      background: rgba(255,255,255,0.12);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; font-weight: 700;
    }
    .kolo-title { font-size: 0.95rem; font-weight: 700; }
    .kolo-status {
      font-size: 0.72rem; font-weight: 600; letter-spacing: 0.5px;
      padding: 3px 10px; border-radius: 999px;
    }
    .kolo-status.complete  { background: rgba(46,204,113,0.15); border: 1px solid rgba(46,204,113,0.3); color: #2ecc71; }
    .kolo-status.partial   { background: rgba(243,156,18,0.15); border: 1px solid rgba(243,156,18,0.3); color: #f39c12; }
    .kolo-status.empty     { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: var(--muted); }

    .kolo-body { padding: 16px; display: none; }
    .kolo-body.open { display: block; }

    .bye-notice {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; margin-bottom: 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px;
      font-size: 0.78rem; color: var(--muted);
    }

    /* ── MATCH CARD ── */
    .match-card {
      background: rgba(6,12,24,0.6);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      margin-bottom: 12px;
      overflow: hidden;
      transition: border-color 0.2s ease;
    }
    .match-card.has-score { border-color: rgba(74,144,226,0.3); }

    .match-top {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
    }

    .player-side { display: flex; flex-direction: column; gap: 4px; }
    .player-side.right { align-items: flex-end; text-align: right; }

    .player-name {
      font-size: 0.95rem; font-weight: 700;
    }

    .score-center {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }

    .score-display {
      font-size: 1.4rem; font-weight: 800;
      color: #7eb8ff; letter-spacing: 1px;
      min-width: 70px; text-align: center;
    }
    .score-display.empty { color: rgba(255,255,255,0.2); font-size: 1rem; }

    .match-num {
      font-size: 0.68rem; color: var(--muted);
      letter-spacing: 0.5px; text-transform: uppercase;
    }

    /* ── STATS ROW ── */
    .match-stats {
      display: none;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding: 14px 16px;
      background: rgba(0,0,0,0.2);
    }
    .match-stats.visible { display: block; }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: start;
    }

    .stats-col { display: flex; flex-direction: column; gap: 8px; }
    .stats-col.right { align-items: flex-end; }

    .stat-row {
      display: flex; align-items: center; gap: 8px;
    }
    .stat-row.right { flex-direction: row-reverse; }

    .stat-label {
      font-size: 0.68rem; font-weight: 600;
      color: var(--muted); letter-spacing: 0.5px;
      text-transform: uppercase; min-width: 60px;
    }
    .stat-label.right { text-align: right; }

    .stat-input {
      width: 70px; height: 32px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      color: #fff;
      font-family: 'Lexend', sans-serif;
      font-size: 0.85rem; font-weight: 600;
      text-align: center;
      outline: none;
      transition: 0.2s ease;
    }
    .stat-input:focus {
      border-color: rgba(74,144,226,0.6);
      background: rgba(74,144,226,0.08);
    }
    .stat-input:disabled {
      opacity: 0.4; cursor: not-allowed;
    }

    .score-input-wrap {
      display: flex; align-items: center; gap: 6px;
    }
    .score-input {
      width: 52px; height: 38px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 10px;
      color: #fff;
      font-family: 'Lexend', sans-serif;
      font-size: 1rem; font-weight: 700;
      text-align: center; outline: none;
      transition: 0.2s ease;
    }
    .score-input:focus {
      border-color: rgba(74,144,226,0.7);
      background: rgba(74,144,226,0.1);
    }
    .score-input:disabled { opacity: 0.4; cursor: not-allowed; }
    .score-sep { font-size: 1.2rem; font-weight: 700; color: var(--muted); }

    .stats-divider {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 4px;
      padding: 0 8px;
    }
    .stats-divider-line {
      width: 1px; flex: 1;
      background: rgba(255,255,255,0.08);
      min-height: 20px;
    }
    .stats-divider-vs {
      font-size: 0.7rem; color: rgba(255,255,255,0.2);
      font-weight: 600; letter-spacing: 1px;
    }

    /* ── ACTION BUTTONS ── */
    .match-actions {
      display: flex; align-items: center; justify-content: flex-end;
      gap: 8px; padding: 10px 16px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .btn-toggle-stats {
      padding: 6px 14px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 999px;
      color: var(--muted);
      font-family: 'Lexend', sans-serif;
      font-size: 0.75rem; font-weight: 600;
      cursor: pointer; transition: 0.2s ease;
    }
    .btn-toggle-stats:hover { background: rgba(255,255,255,0.06); color: #fff; }

    .btn-save {
      padding: 6px 18px;
      background: rgba(21,49,99,1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 999px;
      color: #fff;
      font-family: 'Lexend', sans-serif;
      font-size: 0.75rem; font-weight: 700;
      cursor: pointer; transition: 0.2s ease;
      display: flex; align-items: center; gap: 6px;
    }
    .btn-save:hover { background: rgba(39,81,159,0.98); }
    .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-save.saving { opacity: 0.7; }
    .btn-save.saved  { background: rgba(46,204,113,0.2); border-color: rgba(46,204,113,0.4); color: #2ecc71; }

    /* ── LOADING ── */
    .loading-state {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 60px 20px; gap: 16px;
    }
    .loading-spinner {
      width: 34px; height: 34px;
      border: 4px solid rgba(255,255,255,0.1);
      border-top: 4px solid rgba(120,170,255,0.85);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .loading-text { font-size: 0.95rem; font-weight: 500; color: var(--muted); }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 9999;
      padding: 12px 20px;
      background: rgba(12,20,38,0.97);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      font-size: 0.85rem; font-weight: 600;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      transform: translateY(80px); opacity: 0;
      transition: 0.3s ease;
      display: flex; align-items: center; gap: 8px;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { border-color: rgba(46,204,113,0.4); color: #2ecc71; }
    .toast.error   { border-color: rgba(231,76,60,0.4);  color: #e74c3c; }

    @media (max-width: 640px) {
      .match-top { grid-template-columns: 1fr auto 1fr; gap: 6px; padding: 12px; }
      .stats-grid { grid-template-columns: 1fr auto 1fr; gap: 6px; }
      .stat-input { width: 58px; }
      .score-input { width: 44px; }
      .player-name { font-size: 0.82rem; }
    }
  </style>
</head>
<body>
  <div class="bg-image"></div>
  <div class="bg-overlay"></div>

  <div class="page">
    <div class="container">

      <!-- TOPBAR -->
      <div class="topbar">
        <div class="group-title-bar">
          <a href="index-admin.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> Natrag
          </a>
          <div>
            <div class="group-name" id="group-name">Učitavanje...</div>
            <div class="group-sub">Adriatic Steel League · Sezona 2</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="admin-badge" id="role-badge" style="display:none;">Admin</span>
          <span id="user-email-label" style="font-size:0.8rem;color:var(--muted);"></span>
        </div>
      </div>

      <!-- TABS -->
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('standings', this)">
          <i class="fas fa-table" style="margin-right:6px;"></i>Standings
        </button>
        <button class="tab-btn" onclick="switchTab('raspored', this)">
          <i class="fas fa-calendar-alt" style="margin-right:6px;"></i>Raspored & Rezultati
        </button>
      </div>

      <!-- TAB: STANDINGS -->
      <div id="tab-standings" class="tab-panel active">
        <div id="standings-container">
          <div class="loading-state">
            <div class="loading-spinner"></div>
            <span class="loading-text">Učitavanje standings...</span>
          </div>
        </div>
      </div>

      <!-- TAB: RASPORED -->
      <div id="tab-raspored" class="tab-panel">
        <div id="raspored-container">
          <div class="loading-state">
            <div class="loading-spinner"></div>
            <span class="loading-text">Učitavanje rasporeda...</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, getDocs, setDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDyG6WN60VOhp-iHq_18vOLDcHP6zHNoRk",
      authDomain: "adriatic-steel-league.firebaseapp.com",
      projectId: "adriatic-steel-league",
      storageBucket: "adriatic-steel-league.firebasestorage.app",
      messagingSenderId: "269059044337",
      appId: "1:269059044337:web:6b2e69f8604a0546b00a50",
      measurementId: "G-8HLYCZLJ2Y"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    // Get group ID from URL
    const params  = new URLSearchParams(window.location.search);
    const groupId = params.get('group');

    let isAdmin    = false;
    let groupData  = null;
    let players    = [];
    let matchesMap = {}; // "kolo_mec" -> match data
    let schedule   = []; // [{kolo, matches:[{mec,p1,p2}], bye}]

    // ── AUTH ──
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'index-admin.html';
        return;
      }

      document.getElementById('user-email-label').textContent = user.email;

      const userDoc = await getDoc(doc(db, 'users', user.uid));
      const userData = userDoc.exists() ? userDoc.data() : { role: 'operator', groups: [] };
      isAdmin = userData.role === 'admin' || (userData.groups || []).includes(groupId);

      if (isAdmin) {
        document.getElementById('role-badge').style.display = 'inline-flex';
      }

      await loadGroup();
    });

    // ── LOAD GROUP ──
    async function loadGroup() {
      if (!groupId) {
        document.getElementById('group-name').textContent = 'Greška: nema grupe';
        return;
      }

      // Load group info
      const groupDoc = await getDoc(doc(db, 'seasons', 'sezona-2', 'groups', groupId));
      if (!groupDoc.exists()) {
        document.getElementById('group-name').textContent = 'Grupa nije pronađena';
        return;
      }
      groupData = groupDoc.data();

      document.getElementById('group-name').textContent = groupData.name || groupId;

      // Load players
      const playersSnap = await getDocs(collection(db, 'seasons', 'sezona-2', 'groups', groupId, 'players'));
      players = [];
      playersSnap.forEach(p => players.push(p.data().name));
      players.sort();

      // Load existing matches
      const matchesSnap = await getDocs(query(
        collection(db, 'seasons', 'sezona-2', 'groups', groupId, 'matches'),
        orderBy('kolo'), orderBy('mec')
      ));
      matchesMap = {};
      matchesSnap.forEach(m => {
        const d = m.data();
        matchesMap[`${d.kolo}_${d.mec}`] = { id: m.id, ...d };
      });

      // Generate schedule
      schedule = generateSchedule(players);

      // Render both tabs
      renderStandings();
      renderRaspored();
    }

    // ── ROUND ROBIN ──
    function generateSchedule(p) {
      const n = p.length;
      const arr = n % 2 === 0 ? [...p] : [...p, 'BYE'];
      const total = arr.length;
      const rounds = [];

      for (let r = 0; r < total - 1; r++) {
        const matches = [];
        let bye = null;
        let mecNum = 1;
        for (let i = 0; i < total / 2; i++) {
          const p1 = arr[i], p2 = arr[total - 1 - i];
          if (p1 === 'BYE') { bye = p2; continue; }
          if (p2 === 'BYE') { bye = p1; continue; }
          matches.push({ mec: mecNum++, player1: p1, player2: p2 });
        }
        rounds.push({ kolo: r + 1, matches, bye });
        arr.splice(1, 0, arr.pop());
      }
      return rounds;
    }

    // ── STANDINGS ──
    function computeStandings() {
      const stats = {};
      players.forEach(p => {
        stats[p] = { win:0, draw:0, lost:0, total:0, legs:0, pts:0, avgSum:0, avgCount:0, f9Sum:0, f9Count:0, bl:0, bco:0, x180:0 };
      });

      schedule.forEach(({ kolo, matches }) => {
        matches.forEach(({ mec, player1, player2 }) => {
          const m = matchesMap[`${kolo}_${mec}`];
          if (!m || !m.score) return;

          const parts = m.score.split('-');
          if (parts.length !== 2) return;
          const s1 = parseInt(parts[0]), s2 = parseInt(parts[1]);
          if (isNaN(s1) || isNaN(s2)) return;

          const st1 = stats[player1], st2 = stats[player2];
          if (!st1 || !st2) return;

          st1.total++; st2.total++;
          st1.legs += (s1 - s2); st2.legs += (s2 - s1);

          if (m.score === '5-5') {
            st1.draw++; st2.draw++;
            st1.pts++; st2.pts++;
          } else if (s1 > s2) {
            st1.win++; st2.lost++;
            st1.pts += 2;
          } else {
            st2.win++; st1.lost++;
            st2.pts += 2;
          }

          if (m.average1) { st1.avgSum += parseFloat(m.average1); st1.avgCount++; }
          if (m.average2) { st2.avgSum += parseFloat(m.average2); st2.avgCount++; }
          if (m.first9_1) { st1.f9Sum  += parseFloat(m.first9_1); st1.f9Count++; }
          if (m.first9_2) { st2.f9Sum  += parseFloat(m.first9_2); st2.f9Count++; }
          if (m.bestleg1) st1.bl  = Math.max(st1.bl,  parseInt(m.bestleg1) || 0);
          if (m.bestleg2) st2.bl  = Math.max(st2.bl,  parseInt(m.bestleg2) || 0);
          if (m.bestcheckout1) st1.bco = Math.max(st1.bco, parseInt(m.bestcheckout1) || 0);
          if (m.bestcheckout2) st2.bco = Math.max(st2.bco, parseInt(m.bestcheckout2) || 0);
          if (m['180_1']) st1.x180 += parseInt(m['180_1']) || 0;
          if (m['180_2']) st2.x180 += parseInt(m['180_2']) || 0;
        });
      });

      return Object.entries(stats)
        .map(([name, s]) => ({
          name,
          win: s.win, draw: s.draw, lost: s.lost, total: s.total,
          legs: s.legs, pts: s.pts,
          avg:  s.avgCount > 0 ? (s.avgSum / s.avgCount).toFixed(2) : '--',
          f9:   s.f9Count  > 0 ? (s.f9Sum  / s.f9Count).toFixed(2)  : '--',
          bl:   s.bl  || '',
          bco:  s.bco || '',
          x180: s.x180
        }))
        .sort((a, b) => b.pts - a.pts || b.legs - a.legs);
    }

    function renderStandings() {
      const standings = computeStandings();
      const container = document.getElementById('standings-container');

      container.innerHTML = `
        <div class="standings-wrap">
          <div class="standings-header">
            <h2><i class="fas fa-trophy" style="margin-right:8px;color:#FFD700;"></i>Standings — ${groupData?.name || ''}</h2>
            <span style="font-size:0.75rem;color:var(--muted);">${players.length} igrača</span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th style="text-align:left;">Igrač</th>
                  <th>W</th><th>D</th><th>L</th>
                  <th>Tot</th><th>Legs</th><th>PTS</th>
                  <th>AVG</th><th>First 9</th>
                  <th>Best Leg</th><th>Best CO</th><th>180</th>
                </tr>
              </thead>
              <tbody>
                ${standings.map((p, i) => `
                  <tr>
                    <td class="rank-cell">${i + 1}</td>
                    <td style="text-align:left;font-weight:700;">${esc(p.name)}</td>
                    <td style="color:#2ecc71;font-weight:700;">${p.win}</td>
                    <td style="color:#f39c12;font-weight:700;">${p.draw}</td>
                    <td style="color:#e74c3c;font-weight:700;">${p.lost}</td>
                    <td>${p.total}</td>
                    <td style="color:${p.legs>0?'#2ecc71':p.legs<0?'#e74c3c':'inherit'}">${p.legs > 0 ? '+'+p.legs : p.legs}</td>
                    <td class="pts-cell">${p.pts}</td>
                    <td>${p.avg}</td><td>${p.f9}</td>
                    <td>${p.bl || '--'}</td><td>${p.bco || '--'}</td><td>${p.x180}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // ── RASPORED ──
    function renderRaspored() {
      const container = document.getElementById('raspored-container');

      let html = '';
      schedule.forEach(({ kolo, matches, bye }) => {
        const filled  = matches.filter(m => matchesMap[`${kolo}_${m.mec}`]?.score).length;
        const total   = matches.length;
        const statusClass = filled === total ? 'complete' : filled > 0 ? 'partial' : 'empty';
        const statusText  = filled === total ? 'Završeno' : filled > 0 ? `${filled}/${total}` : 'Nije počelo';

        html += `
          <div class="kolo-section">
            <div class="kolo-header" onclick="toggleKolo(${kolo})">
              <div class="kolo-header-left">
                <div class="kolo-number">${kolo}</div>
                <span class="kolo-title">Kolo ${kolo}</span>
                ${bye ? `<span style="font-size:0.75rem;color:var(--muted);">· BYE: ${esc(bye)}</span>` : ''}
              </div>
              <div style="display:flex;align-items:center;gap:10px;">
                <span class="kolo-status ${statusClass}">${statusText}</span>
                <i class="fas fa-chevron-down" id="kolo-icon-${kolo}" style="font-size:0.85rem;color:var(--muted);transition:0.2s;"></i>
              </div>
            </div>
            <div class="kolo-body" id="kolo-body-${kolo}">
              ${matches.map(m => renderMatchCard(kolo, m)).join('')}
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function renderMatchCard(kolo, { mec, player1, player2 }) {
      const key   = `${kolo}_${mec}`;
      const saved = matchesMap[key] || {};
      const score = saved.score || '';
      const hasScore = !!score;

      const scoreDisplay = hasScore
        ? `<span class="score-display">${esc(score)}</span>`
        : `<span class="score-display empty">- : -</span>`;

      const disabled = isAdmin ? '' : 'disabled';

      return `
        <div class="match-card ${hasScore ? 'has-score' : ''}" id="match-${kolo}-${mec}">
          <div class="match-top">
            <div class="player-side">
              <span class="player-name">${esc(player1)}</span>
            </div>
            <div class="score-center">
              <span class="match-num">Meč ${mec}</span>
              ${scoreDisplay}
            </div>
            <div class="player-side right">
              <span class="player-name">${esc(player2)}</span>
            </div>
          </div>

          <div class="match-stats ${hasScore ? 'visible' : ''}" id="stats-${kolo}-${mec}">
            <div class="stats-grid">
              <!-- P1 stats -->
              <div class="stats-col">
                <div class="stat-row">
                  <span class="stat-label">Score</span>
                  <div class="score-input-wrap">
                    <input class="score-input" type="number" min="0" max="9" id="s1-${kolo}-${mec}" value="${saved.score ? saved.score.split('-')[0] : ''}" ${disabled} placeholder="0">
                  </div>
                </div>
                <div class="stat-row">
                  <span class="stat-label">AVG</span>
                  <input class="stat-input" type="number" step="0.01" id="avg1-${kolo}-${mec}" value="${saved.average1 || ''}" ${disabled} placeholder="0.00">
                </div>
                <div class="stat-row">
                  <span class="stat-label">First 9</span>
                  <input class="stat-input" type="number" step="0.01" id="f9_1-${kolo}-${mec}" value="${saved.first9_1 || ''}" ${disabled} placeholder="0.00">
                </div>
                <div class="stat-row">
                  <span class="stat-label">Best Leg</span>
                  <input class="stat-input" type="number" id="bl1-${kolo}-${mec}" value="${saved.bestleg1 || ''}" ${disabled} placeholder="0">
                </div>
                <div class="stat-row">
                  <span class="stat-label">Best CO</span>
                  <input class="stat-input" type="number" id="bco1-${kolo}-${mec}" value="${saved.bestcheckout1 || ''}" ${disabled} placeholder="0">
                </div>
                <div class="stat-row">
                  <span class="stat-label">180s</span>
                  <input class="stat-input" type="number" id="180_1-${kolo}-${mec}" value="${saved['180_1'] || ''}" ${disabled} placeholder="0">
                </div>
              </div>

              <!-- Divider -->
              <div class="stats-divider">
                <div class="stats-divider-line"></div>
                <div class="score-input-wrap" style="flex-direction:column;align-items:center;gap:4px;">
                  <input class="score-input" type="number" min="0" max="9" id="s1-${kolo}-${mec}" value="${saved.score ? saved.score.split('-')[0] : ''}" style="display:none">
                  <span class="score-sep">:</span>
                  <input class="score-input" type="number" min="0" max="9" id="s2-${kolo}-${mec}" value="${saved.score ? saved.score.split('-')[1] : ''}" ${disabled} placeholder="0">
                </div>
                <div class="stats-divider-line"></div>
              </div>

              <!-- P2 stats -->
              <div class="stats-col right">
                <div class="stat-row right">
                  <span class="stat-label right">Score</span>
                  <div class="score-input-wrap">
                    <input class="score-input" type="number" min="0" max="9" id="s1b-${kolo}-${mec}" value="${saved.score ? saved.score.split('-')[0] : ''}" style="display:none">
                  </div>
                </div>
                <div class="stat-row right">
                  <span class="stat-label right">AVG</span>
                  <input class="stat-input" type="number" step="0.01" id="avg2-${kolo}-${mec}" value="${saved.average2 || ''}" ${disabled} placeholder="0.00">
                </div>
                <div class="stat-row right">
                  <span class="stat-label right">First 9</span>
                  <input class="stat-input" type="number" step="0.01" id="f9_2-${kolo}-${mec}" value="${saved.first9_2 || ''}" ${disabled} placeholder="0.00">
                </div>
                <div class="stat-row right">
                  <span class="stat-label right">Best Leg</span>
                  <input class="stat-input" type="number" id="bl2-${kolo}-${mec}" value="${saved.bestleg2 || ''}" ${disabled} placeholder="0">
                </div>
                <div class="stat-row right">
                  <span class="stat-label right">Best CO</span>
                  <input class="stat-input" type="number" id="bco2-${kolo}-${mec}" value="${saved.bestcheckout2 || ''}" ${disabled} placeholder="0">
                </div>
                <div class="stat-row right">
                  <span class="stat-label right">180s</span>
                  <input class="stat-input" type="number" id="180_2-${kolo}-${mec}" value="${saved['180_2'] || ''}" ${disabled} placeholder="0">
                </div>
              </div>
            </div>
          </div>

          <div class="match-actions">
            <button class="btn-toggle-stats" onclick="toggleStats(${kolo}, ${mec})">
              <i class="fas fa-chart-bar" style="margin-right:4px;"></i>
              ${hasScore ? 'Sakrij statistiku' : 'Unesi statistiku'}
            </button>
            ${isAdmin ? `
            <button class="btn-save" id="save-${kolo}-${mec}" onclick="saveMatch(${kolo}, ${mec}, '${esc(player1)}', '${esc(player2)}')">
              <i class="fas fa-save"></i> Spremi
            </button>` : ''}
          </div>
        </div>
      `;
    }

    // ── TOGGLE KOLO ──
    window.toggleKolo = function(kolo) {
      const body = document.getElementById(`kolo-body-${kolo}`);
      const icon = document.getElementById(`kolo-icon-${kolo}`);
      const open = body.classList.contains('open');
      body.classList.toggle('open', !open);
      if (icon) icon.style.transform = open ? '' : 'rotate(180deg)';
    };

    // ── TOGGLE STATS ──
    window.toggleStats = function(kolo, mec) {
      const stats = document.getElementById(`stats-${kolo}-${mec}`);
      const btn   = stats?.previousElementSibling?.querySelector('.btn-toggle-stats') ||
                    stats?.nextElementSibling?.querySelector('.btn-toggle-stats');
      const open  = stats.classList.contains('visible');
      stats.classList.toggle('visible', !open);

      // Find toggle button
      const card = document.getElementById(`match-${kolo}-${mec}`);
      const toggleBtn = card.querySelector('.btn-toggle-stats');
      if (toggleBtn) {
        toggleBtn.innerHTML = `<i class="fas fa-chart-bar" style="margin-right:4px;"></i>${open ? 'Unesi statistiku' : 'Sakrij statistiku'}`;
      }
    };

    // ── SAVE MATCH ──
    window.saveMatch = async function(kolo, mec, player1, player2) {
      const btn = document.getElementById(`save-${kolo}-${mec}`);
      const s1  = document.getElementById(`s1-${kolo}-${mec}`)?.value?.trim();
      const s2  = document.getElementById(`s2-${kolo}-${mec}`)?.value?.trim();

      if (!s1 && !s2) {
        showToast('Unesite rezultat!', 'error');
        return;
      }

      const score = s1 && s2 ? `${s1}-${s2}` : '';

      const data = {
        kolo, mec, player1, player2, score,
        average1:       parseFloatOrNull(document.getElementById(`avg1-${kolo}-${mec}`)?.value),
        average2:       parseFloatOrNull(document.getElementById(`avg2-${kolo}-${mec}`)?.value),
        first9_1:       parseFloatOrNull(document.getElementById(`f9_1-${kolo}-${mec}`)?.value),
        first9_2:       parseFloatOrNull(document.getElementById(`f9_2-${kolo}-${mec}`)?.value),
        bestleg1:       parseIntOrNull(document.getElementById(`bl1-${kolo}-${mec}`)?.value),
        bestleg2:       parseIntOrNull(document.getElementById(`bl2-${kolo}-${mec}`)?.value),
        bestcheckout1:  parseIntOrNull(document.getElementById(`bco1-${kolo}-${mec}`)?.value),
        bestcheckout2:  parseIntOrNull(document.getElementById(`bco2-${kolo}-${mec}`)?.value),
        '180_1':        parseIntOrNull(document.getElementById(`180_1-${kolo}-${mec}`)?.value),
        '180_2':        parseIntOrNull(document.getElementById(`180_2-${kolo}-${mec}`)?.value),
      };

      btn.classList.add('saving');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sprema...';

      try {
        const matchId = `k${kolo}_m${mec}`;
        await setDoc(doc(db, 'seasons', 'sezona-2', 'groups', groupId, 'matches', matchId), data);

        matchesMap[`${kolo}_${mec}`] = { id: matchId, ...data };

        btn.classList.remove('saving');
        btn.classList.add('saved');
        btn.innerHTML = '<i class="fas fa-check"></i> Spremljeno';

        // Update score display
        const card = document.getElementById(`match-${kolo}-${mec}`);
        const scoreEl = card.querySelector('.score-display');
        if (scoreEl) { scoreEl.textContent = score; scoreEl.classList.remove('empty'); }
        card.classList.add('has-score');

        // Refresh standings
        renderStandings();

        setTimeout(() => {
          btn.classList.remove('saved');
          btn.innerHTML = '<i class="fas fa-save"></i> Spremi';
          btn.disabled = false;
        }, 2500);

        showToast('Rezultat spremljen!', 'success');
      } catch (err) {
        btn.classList.remove('saving');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-save"></i> Spremi';
        showToast('Greška: ' + err.message, 'error');
      }
    };

    // ── HELPERS ──
    function parseFloatOrNull(v) { const f = parseFloat(v); return isNaN(f) ? null : f; }
    function parseIntOrNull(v)   { const i = parseInt(v);   return isNaN(i) ? null : i; }
    function esc(v) {
      return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }

    // ── TAB SWITCH ──
    window.switchTab = function(name, btn) {
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + name).classList.add('active');
      btn.classList.add('active');
    };

    // ── TOAST ──
    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `toast ${type} show`;
      setTimeout(() => t.classList.remove('show'), 3000);
    }
  </script>
</body>
</html>
